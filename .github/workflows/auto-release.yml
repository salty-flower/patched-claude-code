name: auto-release

on:
  schedule:
    - cron: "55 1,19,21,23 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: auto-release
  cancel-in-progress: false

env:
  TARGET_PLATFORM_PACKAGE: "@anthropic-ai/claude-code-darwin-arm64"

jobs:
  poll:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.13"

      - name: Install missing Ubuntu tools
        run: |
          sudo apt-get update
          sudo apt-get install -y just

      - name: Tool availability
        run: |
          set -euo pipefail
          bun --version
          just --version
          jq --version
          gh --version
          git --version
          tar --version
          curl --version
          sha256sum --version
          node --version
          npm --version
          script --version

      - name: Install tool dependencies
        run: bun install --cwd tools --frozen-lockfile

      - name: Detect upstream candidate
        id: detect
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          handled_args=()
          prerelease_args=()
          while IFS=$'\t' read -r tag prerelease; do
            if [[ -z "$tag" ]]; then
              continue
            fi
            if [[ "$prerelease" == "true" ]]; then
              prerelease_args+=(--prerelease-tag "$tag")
            else
              handled_args+=(--handled-tag "$tag")
            fi
          done < <(gh release list --repo "$GITHUB_REPOSITORY" --limit 100 --json tagName,isPrerelease --jq '.[] | [.tagName, .isPrerelease] | @tsv')

          bun run tools/patch/detect-upstream.ts "${handled_args[@]}" "${prerelease_args[@]}" > upstream.json
          cat upstream.json
          {
            echo "action=$(jq -r '.action' upstream.json)"
            echo "version=$(jq -r '.version // empty' upstream.json)"
            echo "source=$(jq -r '.source // empty' upstream.json)"
          } >> "$GITHUB_OUTPUT"

      - name: Stop when there is no candidate
        if: steps.detect.outputs.action == 'none'
        run: echo "No upstream candidate detected."

      - name: Typecheck tools
        if: steps.detect.outputs.action != 'none'
        run: just typecheck

      - name: Verify, render, and smoke
        if: steps.detect.outputs.action != 'none'
        env:
          TARGET_SOURCE: ${{ steps.detect.outputs.action == 'promote' && 'canonical' || steps.detect.outputs.source }}
          TARGET_PLATFORM: darwin-arm64
        run: |
          set -euo pipefail
          just render "${{ steps.detect.outputs.version }}"
          just smoke-rendered "${{ steps.detect.outputs.version }}"
          just _patch-test-rendered "${{ steps.detect.outputs.version }}"

      - name: Prepare prompt identity ledger
        id: identity
        if: steps.detect.outputs.action != 'none'
        run: |
          set -euo pipefail
          version="${{ steps.detect.outputs.version }}"
          result="dist/prompt-identity-bump-$version.json"
          just prompt-identity-prepare "$version"
          jq . "$result"
          echo "status=$(jq -r .status "$result")" >> "$GITHUB_OUTPUT"

      - name: Upload prompt identity review
        if: steps.detect.outputs.action != 'none' && steps.identity.outputs.status != 'ready-existing'
        uses: actions/upload-artifact@v6
        with:
          name: prompt-identity-${{ steps.detect.outputs.version }}
          path: |
            dist/prompt-identity-bump-*.json
            dist/prompt-identities-*.draft.json
          if-no-files-found: error

      - name: Commit exact-only prompt identity ledger
        if: steps.identity.outputs.status == 'finalized-exact-only'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="${{ steps.detect.outputs.version }}"
          branch="automation/prompt-identities-$version"
          existing_pr="$(gh pr list --repo "$GITHUB_REPOSITORY" --head "$branch" --state open --json url --jq '.[0].url // empty')"
          if [[ -n "$existing_pr" ]]; then
            echo "Prompt identity PR already open: $existing_pr"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add prompt-identities/registry.json "prompt-identities/versions/$version.json"
          git diff --cached --quiet && { echo "Exact-only preparation produced no identity commit" >&2; exit 1; }
          git commit -m "tools(prompt-catalog): carry prompt identities for $version"
          git push origin "HEAD:refs/heads/$branch"
          gh pr create \
            --repo "$GITHUB_REPOSITORY" \
            --base "${{ github.event.repository.default_branch }}" \
            --head "$branch" \
            --title "tools(prompt-catalog): carry prompt identities for $version" \
            --body "Automated unique-exact prompt lineage carry for Claude Code $version. Release remains deferred until this PR is merged."

      - name: Block unresolved prompt identities
        if: steps.identity.outputs.status == 'review-required'
        run: |
          echo "Prompt identity review is required; download the prompt-identity-${{ steps.detect.outputs.version }} artifact." >&2
          exit 1

      - name: Fetch previous prompt catalog source tag
        if: steps.detect.outputs.action != 'none' && steps.identity.outputs.status == 'ready-existing'
        shell: bash
        run: |
          set -euo pipefail
          version="${{ steps.detect.outputs.version }}"
          previous_version="$(
            for path in prompt-identities/versions/*.json; do
              basename "$path" .json
            done | sort -V | awk -v current="$version" '$0 < current { previous=$0 } END { print previous }'
          )"
          if [[ -z "$previous_version" ]]; then
            echo "No lower prompt identity ledger for $version; prompt review will use baseline semantics."
            exit 0
          fi
          tag="$(
            git ls-remote --tags origin "refs/tags/claude-code-${previous_version}-patch.*" |
              awk 'index($2, "^{}") == 0 { sub("refs/tags/", "", $2); print $2 }' |
              sort -V | tail -n1
          )"
          if [[ -z "$tag" ]]; then
            echo "Previous prompt catalog source tag not found for $previous_version" >&2
            exit 1
          fi
          git fetch --no-tags origin "refs/tags/$tag:refs/tags/$tag"
          echo "Fetched $tag for structured prompt review"

      - name: Package release artifact
        if: steps.detect.outputs.action != 'none' && steps.identity.outputs.status == 'ready-existing'
        run: |
          set -euo pipefail
          just _package-rendered "${{ steps.detect.outputs.version }}" "patch.1"

      - name: Check canonical platform merge before promotion
        if: steps.detect.outputs.action == 'promote' && steps.identity.outputs.status == 'ready-existing'
        run: |
          set -euo pipefail
          jq -e '(.unclassifiedDrift | length == 0) and (.acceptedDrift | length == 0) and (.output.structuralParseErrors == 0)' \
            "staging/${{ steps.detect.outputs.version }}/canonical/platform-merge-report.json"

      - name: Create and push Nix source refs
        if: steps.detect.outputs.action == 'promote' && steps.identity.outputs.status == 'ready-existing'
        run: |
          set -euo pipefail
          tag="claude-code-${{ steps.detect.outputs.version }}-patch.1"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          just _release-source-rendered "${{ steps.detect.outputs.version }}" "patch.1"
          bun ./cli.js --version
          git push origin "refs/tags/$tag" --force
          git push origin "refs/tags/$tag:refs/heads/claude-code-latest" --force

      - name: Create or update prerelease
        if: steps.detect.outputs.action == 'prerelease' && steps.identity.outputs.status == 'ready-existing'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="claude-code-${{ steps.detect.outputs.version }}-patch.1"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release edit "$tag" \
              --repo "$GITHUB_REPOSITORY" \
              --title "$tag" \
              --notes-file dist/release-notes.md \
              --prerelease
            gh release upload "$tag" \
              --repo "$GITHUB_REPOSITORY" \
              --clobber \
              dist/*.tar.gz \
              dist/*.sha256 \
              dist/*.manifest.json \
              dist/prompt-review.md
          else
            gh release create "$tag" \
              --repo "$GITHUB_REPOSITORY" \
              --title "$tag" \
              --notes-file dist/release-notes.md \
              --prerelease \
              --target "$GITHUB_SHA" \
              dist/*.tar.gz \
              dist/*.sha256 \
              dist/*.manifest.json \
              dist/prompt-review.md
          fi

      - name: Promote prerelease
        if: steps.detect.outputs.action == 'promote' && steps.identity.outputs.status == 'ready-existing'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="claude-code-${{ steps.detect.outputs.version }}-patch.1"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$tag" \
              --repo "$GITHUB_REPOSITORY" \
              --clobber \
              dist/*.tar.gz \
              dist/*.sha256 \
              dist/*.manifest.json \
              dist/prompt-review.md
          else
            gh release create "$tag" \
              --repo "$GITHUB_REPOSITORY" \
              --title "$tag" \
              --notes-file dist/release-notes.md \
              --latest \
              dist/*.tar.gz \
              dist/*.sha256 \
              dist/*.manifest.json \
              dist/prompt-review.md
          fi
          release_id="$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$tag" --jq .id)"
          gh api \
            --method PATCH \
            "repos/$GITHUB_REPOSITORY/releases/$release_id" \
            -f name="$tag" \
            -f body="$(cat dist/release-notes.md)" \
            -F prerelease=false \
            -f make_latest=true
