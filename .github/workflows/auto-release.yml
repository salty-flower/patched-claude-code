name: auto-release

on:
  schedule:
    - cron: "55 1,19,21,23 * * *"
  workflow_dispatch:

permissions:
  contents: write

env:
  TARGET_PLATFORM_PACKAGE: "@anthropic-ai/claude-code-darwin-arm64"

jobs:
  poll:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.13"

      - name: Install missing Ubuntu tools
        run: |
          sudo apt-get update
          sudo apt-get install -y just

      - name: Tool availability
        run: |
          set -euo pipefail
          bun --version
          just --version
          jq --version
          gh --version
          git --version
          tar --version
          curl --version
          sha256sum --version
          node --version
          npm --version
          script --version

      - name: Install tool dependencies
        run: bun install --cwd tools --frozen-lockfile

      - name: Detect upstream candidate
        id: detect
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          handled_args=()
          prerelease_args=()
          while IFS=$'\t' read -r tag prerelease; do
            if [[ -z "$tag" ]]; then
              continue
            fi
            if [[ "$prerelease" == "true" ]]; then
              prerelease_args+=(--prerelease-tag "$tag")
            else
              handled_args+=(--handled-tag "$tag")
            fi
          done < <(gh release list --repo "$GITHUB_REPOSITORY" --limit 100 --json tagName,isPrerelease --jq '.[] | [.tagName, .isPrerelease] | @tsv')

          bun run tools/patch/detect-upstream.ts "${handled_args[@]}" "${prerelease_args[@]}" > upstream.json
          cat upstream.json
          echo "action=$(jq -r '.action' upstream.json)" >> "$GITHUB_OUTPUT"
          echo "version=$(jq -r '.version // empty' upstream.json)" >> "$GITHUB_OUTPUT"
          echo "source=$(jq -r '.source // empty' upstream.json)" >> "$GITHUB_OUTPUT"

      - name: Stop when there is no candidate
        if: steps.detect.outputs.action == 'none'
        run: echo "No upstream candidate detected."

      - name: Typecheck tools
        if: steps.detect.outputs.action != 'none'
        run: just typecheck

      - name: Stage candidate
        if: steps.detect.outputs.action != 'none'
        env:
          TARGET_SOURCE: ${{ steps.detect.outputs.action == 'promote' && 'canonical' || steps.detect.outputs.source }}
          TARGET_PLATFORM: darwin-arm64
        run: just stage "${{ steps.detect.outputs.version }}"

      - name: Verify, render, smoke, and package
        if: steps.detect.outputs.action != 'none'
        env:
          TARGET_SOURCE: ${{ steps.detect.outputs.action == 'promote' && 'canonical' || steps.detect.outputs.source }}
          TARGET_PLATFORM: darwin-arm64
        run: |
          set -euo pipefail
          just verify "${{ steps.detect.outputs.version }}"
          just render "${{ steps.detect.outputs.version }}"
          just smoke "${{ steps.detect.outputs.version }}"
          just patch-test "${{ steps.detect.outputs.version }}"
          just package "${{ steps.detect.outputs.version }}" "patch.1"
          just release-source "${{ steps.detect.outputs.version }}" "patch.1"
          bun ./cli.js --version

      - name: Check canonical platform merge before promotion
        if: steps.detect.outputs.action == 'promote'
        run: |
          set -euo pipefail
          jq -e '(.unclassifiedDrift | length == 0) and (.acceptedDrift | length == 0) and (.output.structuralParseErrors == 0)' \
            "staging/${{ steps.detect.outputs.version }}/canonical/platform-merge-report.json"

      - name: Push Nix source refs
        if: steps.detect.outputs.action != 'none'
        run: |
          set -euo pipefail
          tag="claude-code-${{ steps.detect.outputs.version }}-patch.1"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git push origin "refs/tags/$tag" --force
          git push origin "refs/tags/$tag:refs/heads/claude-code-latest" --force

      - name: Create or update prerelease
        if: steps.detect.outputs.action == 'prerelease'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="claude-code-${{ steps.detect.outputs.version }}-patch.1"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release edit "$tag" \
              --repo "$GITHUB_REPOSITORY" \
              --title "$tag" \
              --notes-file dist/release-notes.md \
              --prerelease
            gh release upload "$tag" \
              --repo "$GITHUB_REPOSITORY" \
              --clobber \
              dist/*.tar.gz \
              dist/*.sha256 \
              dist/*.manifest.json
          else
            gh release create "$tag" \
              --repo "$GITHUB_REPOSITORY" \
              --title "$tag" \
              --notes-file dist/release-notes.md \
              --prerelease \
              dist/*.tar.gz \
              dist/*.sha256 \
              dist/*.manifest.json
          fi

      - name: Promote prerelease
        if: steps.detect.outputs.action == 'promote'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="claude-code-${{ steps.detect.outputs.version }}-patch.1"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$tag" \
              --repo "$GITHUB_REPOSITORY" \
              --clobber \
              dist/*.tar.gz \
              dist/*.sha256 \
              dist/*.manifest.json
          else
            gh release create "$tag" \
              --repo "$GITHUB_REPOSITORY" \
              --title "$tag" \
              --notes-file dist/release-notes.md \
              --latest \
              dist/*.tar.gz \
              dist/*.sha256 \
              dist/*.manifest.json
          fi
          release_id="$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$tag" --jq .id)"
          gh api \
            --method PATCH \
            "repos/$GITHUB_REPOSITORY/releases/$release_id" \
            -f name="$tag" \
            -f body="$(cat dist/release-notes.md)" \
            -F prerelease=false \
            -f make_latest=true
