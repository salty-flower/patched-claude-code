name: ci

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

env:
  TARGET_VERSION: "2.1.168"
  TARGET_SOURCE: canonical
  TARGET_PLATFORM_PACKAGE: "@anthropic-ai/claude-code-darwin-arm64"

jobs:
  changes:
    runs-on: ubuntu-24.04
    outputs:
      full: ${{ steps.classify.outputs.full }}
      typecheck: ${{ steps.classify.outputs.typecheck }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Classify changed paths
        id: classify
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          SHA: ${{ github.sha }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail

          full=false
          typecheck=false

          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            full=true
            typecheck=true
          else
            if [[ "$EVENT_NAME" == "pull_request" ]]; then
              base="$PR_BASE_SHA"
              head="$PR_HEAD_SHA"
            elif [[ -n "${BEFORE:-}" && ! "$BEFORE" =~ ^0+$ ]]; then
              base="$BEFORE"
              head="$SHA"
            else
              base="$(git rev-list --max-parents=0 "$SHA")"
              head="$SHA"
            fi

            git diff --name-only "$base" "$head" > changed-files.txt
            if [[ ! -s changed-files.txt ]]; then
              full=true
              typecheck=true
            fi

            while IFS= read -r path; do
              case "$path" in
                patches/*|reference/*|justfile)
                  full=true
                  typecheck=true
                  ;;
                tools/lib/*|tools/patch/*|tools/platform/*|tools/test/*)
                  full=true
                  typecheck=true
                  ;;
                docs/rules/Native-Bundle-Extraction.md|docs/rules/Patch-Format.md)
                  full=true
                  typecheck=true
                  ;;
                .github/workflows/*|.pre-commit-config.yaml)
                  full=true
                  typecheck=true
                  ;;
                tools/*)
                  typecheck=true
                  ;;
              esac
            done < changed-files.txt
          fi

          printf 'Changed files:\n'
          if [[ -f changed-files.txt ]]; then
            sed 's/^/- /' changed-files.txt
          else
            printf -- '- workflow_dispatch\n'
          fi
          printf 'full=%s\n' "$full" | tee -a "$GITHUB_OUTPUT"
          printf 'typecheck=%s\n' "$typecheck" | tee -a "$GITHUB_OUTPUT"

  routed-checks:
    runs-on: ubuntu-24.04
    needs: changes
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        if: needs.changes.outputs.typecheck == 'true'
        with:
          bun-version: "1.3.13"

      - name: Install tool dependencies
        if: needs.changes.outputs.typecheck == 'true'
        run: bun install --cwd tools --frozen-lockfile

      - name: Typecheck tools
        if: needs.changes.outputs.typecheck == 'true'
        run: bun run --cwd tools typecheck

      - name: Check whitespace
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          SHA: ${{ github.sha }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            base="$PR_BASE_SHA"
            head="$PR_HEAD_SHA"
          elif [[ -n "${BEFORE:-}" && ! "$BEFORE" =~ ^0+$ ]]; then
            base="$BEFORE"
            head="$SHA"
          else
            base="$(git rev-list --max-parents=0 "$SHA")"
            head="$SHA"
          fi
          git diff --check "$base" "$head"

      - name: Route summary
        run: |
          set -euo pipefail
          echo "full=${{ needs.changes.outputs.full }}"
          echo "typecheck=${{ needs.changes.outputs.typecheck }}"

  canonical-platform-merge:
    name: canonical-platform-merge (ubuntu-24.04)
    needs: changes
    if: needs.changes.outputs.full == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.13"

      - name: Install missing Ubuntu tools
        run: |
          sudo apt-get update
          sudo apt-get install -y just

      - name: Tool availability
        run: |
          set -euo pipefail
          bun --version
          just --version
          jq --version
          git --version
          tar --version
          curl --version
          node --version
          npm --version

      - name: Install tool dependencies
        run: bun install --cwd tools --frozen-lockfile

      - name: Typecheck tools
        run: just typecheck

      - name: Stage canonical bundle
        run: just stage "$TARGET_VERSION"

      - name: Check canonical merge report
        run: |
          set -euo pipefail
          jq -e '(.unclassifiedDrift | length == 0) and (.acceptedDrift | length == 0) and (.output.structuralParseErrors == 0)' \
            "staging/${TARGET_VERSION}/canonical/platform-merge-report.json"

      - name: Upload canonical report
        uses: actions/upload-artifact@v6
        with:
          name: canonical-platform-merge-ubuntu-24.04-${{ env.TARGET_VERSION }}
          path: staging/${{ env.TARGET_VERSION }}/canonical/platform-merge-report.json
          if-no-files-found: error

  canonical-platform-merge-macos:
    name: canonical-platform-merge (macos-15 audit)
    needs: changes
    if: github.event_name == 'workflow_dispatch' && needs.changes.outputs.full == 'true'
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v6

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.13"

      - name: Install missing macOS tools
        run: brew install just

      - name: Tool availability
        run: |
          set -euo pipefail
          bun --version
          just --version
          jq --version
          git --version
          tar --version
          curl --version
          node --version
          npm --version

      - name: Install tool dependencies
        run: bun install --cwd tools --frozen-lockfile

      - name: Typecheck tools
        run: just typecheck

      - name: Stage canonical bundle
        run: just stage "$TARGET_VERSION"

      - name: Check canonical merge report
        run: |
          set -euo pipefail
          jq -e '(.unclassifiedDrift | length == 0) and (.acceptedDrift | length == 0) and (.output.structuralParseErrors == 0)' \
            "staging/${TARGET_VERSION}/canonical/platform-merge-report.json"

      - name: Upload canonical report
        uses: actions/upload-artifact@v6
        with:
          name: canonical-platform-merge-macos-15-${{ env.TARGET_VERSION }}
          path: staging/${{ env.TARGET_VERSION }}/canonical/platform-merge-report.json
          if-no-files-found: error

  verify:
    needs: changes
    if: needs.changes.outputs.full == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.13"

      - name: Install missing Ubuntu tools
        run: |
          sudo apt-get update
          sudo apt-get install -y just

      - name: Tool availability
        run: |
          set -euo pipefail
          bun --version
          just --version
          jq --version
          gh --version
          git --version
          tar --version
          curl --version
          sha256sum --version
          node --version
          npm --version
          script --version

      - name: Install tool dependencies
        run: bun install --cwd tools --frozen-lockfile

      - name: Typecheck tools
        run: just typecheck

      - name: Run release audit
        run: just ci-release-audit "$TARGET_VERSION" "ci.${GITHUB_SHA::12}"

      - name: Upload CI artifact
        uses: actions/upload-artifact@v6
        with:
          name: patched-claude-code-${{ env.TARGET_VERSION }}
          path: |
            dist/*.tar.gz
            dist/*.sha256
            dist/*.manifest.json
            cli.js
            manifest.json
            package.json
            bin/claude-patched
          if-no-files-found: error
