name: ci

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

env:
  TARGET_VERSION: "2.1.132"
  TARGET_PLATFORM_PACKAGE: "@anthropic-ai/claude-code-darwin-arm64"

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.13"

      - name: Install missing Ubuntu tools
        run: |
          sudo apt-get update
          sudo apt-get install -y just

      - name: Tool availability
        run: |
          set -euo pipefail
          bun --version
          just --version
          jq --version
          gh --version
          git --version
          tar --version
          curl --version
          sha256sum --version
          node --version
          npm --version
          script --version

      - name: Install tool dependencies
        run: bun install --cwd tools --frozen-lockfile

      - name: Typecheck tools
        run: just typecheck

      - name: Stage target bundle
        run: just stage "$TARGET_VERSION"

      - name: Verify patches and contracts
        run: just verify "$TARGET_VERSION"

      - name: Render patched bundle
        run: just render "$TARGET_VERSION"

      - name: Smoke patched bundle
        run: just smoke "$TARGET_VERSION"

      - name: Patch tests
        run: just patch-test "$TARGET_VERSION"

      - name: Package release artifact
        run: just package "$TARGET_VERSION" "ci.${GITHUB_SHA::12}"

      - name: Upload CI artifact
        uses: actions/upload-artifact@v6
        with:
          name: audited-claude-code-${{ env.TARGET_VERSION }}
          path: |
            dist/*.tar.gz
            dist/*.sha256
            dist/*.manifest.json
          if-no-files-found: error
