name: ci

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

env:
  TARGET_VERSION: "2.1.132"
  TARGET_SOURCE: canonical
  TARGET_PLATFORM_PACKAGE: "@anthropic-ai/claude-code-darwin-arm64"

jobs:
  canonical-platform-merge:
    name: canonical-platform-merge (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    steps:
      - uses: actions/checkout@v6

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.13"

      - name: Install missing Ubuntu tools
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y just

      - name: Install missing macOS tools
        if: runner.os == 'macOS'
        run: brew install just

      - name: Tool availability
        run: |
          set -euo pipefail
          bun --version
          just --version
          jq --version
          git --version
          tar --version
          curl --version
          node --version
          npm --version

      - name: Install tool dependencies
        run: bun install --cwd tools --frozen-lockfile

      - name: Typecheck tools
        run: just typecheck

      - name: Stage canonical bundle
        run: just stage "$TARGET_VERSION"

      - name: Check canonical merge report
        run: |
          set -euo pipefail
          jq -e '(.unclassifiedDrift | length == 0) and (.acceptedDrift | length == 0) and (.output.structuralParseErrors == 0)' \
            "staging/${TARGET_VERSION}/canonical/platform-merge-report.json"

      - name: Upload canonical report
        uses: actions/upload-artifact@v6
        with:
          name: canonical-platform-merge-${{ matrix.os }}-${{ env.TARGET_VERSION }}
          path: staging/${{ env.TARGET_VERSION }}/canonical/platform-merge-report.json
          if-no-files-found: error

  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.13"

      - name: Install missing Ubuntu tools
        run: |
          sudo apt-get update
          sudo apt-get install -y just

      - name: Tool availability
        run: |
          set -euo pipefail
          bun --version
          just --version
          jq --version
          gh --version
          git --version
          tar --version
          curl --version
          sha256sum --version
          node --version
          npm --version
          script --version

      - name: Install tool dependencies
        run: bun install --cwd tools --frozen-lockfile

      - name: Typecheck tools
        run: just typecheck

      - name: Stage target bundle
        run: just stage "$TARGET_VERSION"

      - name: Verify patches and contracts
        run: just verify "$TARGET_VERSION"

      - name: Render patched bundle
        run: just render "$TARGET_VERSION"

      - name: Smoke patched bundle
        run: just smoke "$TARGET_VERSION"

      - name: Patch tests
        run: just patch-test "$TARGET_VERSION"

      - name: Package release artifact
        run: just package "$TARGET_VERSION" "ci.${GITHUB_SHA::12}"

      - name: Create Nix source tag
        run: |
          set -euo pipefail
          just release-source "$TARGET_VERSION" "ci.${GITHUB_SHA::12}"
          test -s cli.js
          test -s manifest.json
          test -s package.json
          test -x bin/claude-audited
          bun ./cli.js --version
          git ls-tree -r --name-only "claude-code-${TARGET_VERSION}-ci.${GITHUB_SHA::12}" > source-tag-files.txt
          diff -u <(printf '%s\n' bin/claude-audited cli.js flake.lock flake.nix manifest.json package.json) source-tag-files.txt

      - name: Upload CI artifact
        uses: actions/upload-artifact@v6
        with:
          name: audited-claude-code-${{ env.TARGET_VERSION }}
          path: |
            dist/*.tar.gz
            dist/*.sha256
            dist/*.manifest.json
            cli.js
            manifest.json
            package.json
            bin/claude-audited
          if-no-files-found: error
