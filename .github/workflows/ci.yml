name: ci

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:
    inputs:
      target_version:
        description: "Claude Code version to audit"
        required: false
        default: "2.1.260"

env:
  TARGET_VERSION: ${{ inputs.target_version || '2.1.260' }}
  TARGET_SOURCE: canonical
  TARGET_PLATFORM_PACKAGE: "@anthropic-ai/claude-code-darwin-arm64"

jobs:
  changes:
    runs-on: ubuntu-24.04
    outputs:
      full: ${{ steps.classify.outputs.full }}
      target_version: ${{ steps.coordinates.outputs.target_version }}
      typecheck: ${{ steps.classify.outputs.typecheck }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Resolve CI target version
        id: coordinates
        shell: bash
        env:
          DEFAULT_TARGET_VERSION: ${{ env.TARGET_VERSION }}
          EVENT_NAME: ${{ github.event_name }}
          HEAD_COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
          REQUESTED_TARGET_VERSION: ${{ inputs.target_version }}
        run: |
          set -euo pipefail
          target_version="${REQUESTED_TARGET_VERSION:-$DEFAULT_TARGET_VERSION}"
          if [[ "$EVENT_NAME" == "push" ]]; then
            subject="${HEAD_COMMIT_MESSAGE%%$'\n'*}"
            if [[ "$subject" =~ ^release:\ claude-code-([0-9]+\.[0-9]+\.[0-9]+)-patch\.[0-9]+$ ]]; then
              target_version="${BASH_REMATCH[1]}"
            fi
          fi
          if [[ ! "$target_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "target version must be an explicit semver: $target_version" >&2
            exit 2
          fi
          echo "target_version=$target_version" | tee -a "$GITHUB_OUTPUT"

      - name: Classify changed paths
        id: classify
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          SHA: ${{ github.sha }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail

          full=false
          typecheck=false

          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            full=true
            typecheck=true
          else
            if [[ "$EVENT_NAME" == "pull_request" ]]; then
              base="$PR_BASE_SHA"
              head="$PR_HEAD_SHA"
            elif [[ -n "${BEFORE:-}" && ! "$BEFORE" =~ ^0+$ ]]; then
              base="$BEFORE"
              head="$SHA"
            else
              base="$(git rev-list --max-parents=0 "$SHA")"
              head="$SHA"
            fi

            if ! git cat-file -e "${base}^{commit}" 2>/dev/null; then
              base="$(git rev-parse "${head}^")"
            fi

            git diff --name-only "$base" "$head" > changed-files.txt
            if [[ ! -s changed-files.txt ]]; then
              full=true
              typecheck=true
            fi

            while IFS= read -r path; do
              case "$path" in
                patches/*|patch-obligations/*|reference/*|justfile)
                  full=true
                  typecheck=true
                  ;;
                runtime/*)
                  full=true
                  typecheck=true
                  ;;
                tools/lib/*|tools/patch/*|tools/platform/*|tools/test/*)
                  full=true
                  typecheck=true
                  ;;
                docs/rules/Native-Bundle-Extraction.md|docs/rules/Patch-Format.md)
                  full=true
                  typecheck=true
                  ;;
                .github/workflows/*|.pre-commit-config.yaml)
                  full=true
                  typecheck=true
                  ;;
                tools/*)
                  typecheck=true
                  ;;
              esac
            done < changed-files.txt
          fi

          printf 'Changed files:\n'
          if [[ -f changed-files.txt ]]; then
            sed 's/^/- /' changed-files.txt
          else
            printf -- '- workflow_dispatch\n'
          fi
          printf 'full=%s\n' "$full" | tee -a "$GITHUB_OUTPUT"
          printf 'typecheck=%s\n' "$typecheck" | tee -a "$GITHUB_OUTPUT"

  routed-checks:
    runs-on: ubuntu-24.04
    needs: changes
    env:
      TARGET_VERSION: ${{ needs.changes.outputs.target_version }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        if: needs.changes.outputs.typecheck == 'true'
        with:
          bun-version: "1.3.13"

      - name: Install tool dependencies
        if: needs.changes.outputs.typecheck == 'true'
        run: bun install --cwd tools --frozen-lockfile

      - name: Typecheck tools
        if: needs.changes.outputs.typecheck == 'true'
        run: bun run --cwd tools typecheck

      - name: Check whitespace
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          SHA: ${{ github.sha }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            base="$PR_BASE_SHA"
            head="$PR_HEAD_SHA"
          elif [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            head="$SHA"
            base="$(git rev-parse "${head}^")"
          elif [[ -n "${BEFORE:-}" && ! "$BEFORE" =~ ^0+$ ]]; then
            base="$BEFORE"
            head="$SHA"
          else
            base="$(git rev-list --max-parents=0 "$SHA")"
            head="$SHA"
          fi
          if ! git cat-file -e "${base}^{commit}" 2>/dev/null; then
            base="$(git rev-parse "${head}^")"
          fi
          git diff --check "$base" "$head"

      - name: Route summary
        run: |
          set -euo pipefail
          echo "full=${{ needs.changes.outputs.full }}"
          echo "typecheck=${{ needs.changes.outputs.typecheck }}"

  canonical-platform-merge:
    name: canonical-platform-merge (ubuntu-24.04)
    needs: changes
    if: needs.changes.outputs.full == 'true'
    runs-on: ubuntu-24.04
    env:
      TARGET_VERSION: ${{ needs.changes.outputs.target_version }}
    steps:
      - uses: actions/checkout@v6

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.13"

      - name: Install missing Ubuntu tools
        run: |
          sudo apt-get update
          sudo apt-get install -y just

      - name: Tool availability
        run: |
          set -euo pipefail
          bun --version
          just --version
          jq --version
          git --version
          tar --version
          curl --version
          node --version
          npm --version

      - name: Install tool dependencies
        run: bun install --cwd tools --frozen-lockfile

      - name: Typecheck tools
        run: just typecheck

      - name: Stage canonical bundle
        run: just stage "$TARGET_VERSION"

      - name: Check canonical stage
        run: |
          set -euo pipefail
          stage="staging/${TARGET_VERSION}"
          if jq -e '.dualGraph != null' "$stage/stage-manifest.json" >/dev/null; then
            jq -e \
              '.schema == 2 and .mergePolicy == "canonical-dual-graph-v1" and
               .textAssetMaterialization == "zstd-decompress-v1" and
               (.platforms | length == 2) and
               ([.platforms[] | (.files | length) > 0] | all) and
               ([.platforms[].files[] |
                 (.upstream.sha256 | type == "string") and
                 (.materialized.sha256 | type == "string") and
                 (if .loader == 5 then .transformation == "zstd-decompress-v1" else true end)] | all)' \
              "$stage/graph-manifest.json"
          else
            jq -e \
              '(.unclassifiedDrift | length == 0) and (.acceptedDrift | length == 0) and (.output.structuralParseErrors == 0)' \
              "$stage/canonical/platform-merge-report.json"
          fi

      - name: Upload canonical stage
        uses: actions/upload-artifact@v6
        with:
          name: canonical-stage-ubuntu-24.04-${{ env.TARGET_VERSION }}
          path: |
            staging/${{ env.TARGET_VERSION }}/cli.js
            staging/${{ env.TARGET_VERSION }}/stage-manifest.json
            staging/${{ env.TARGET_VERSION }}/graph-manifest.json
            staging/${{ env.TARGET_VERSION }}/graph/
            staging/${{ env.TARGET_VERSION }}/canonical/cli.js
            staging/${{ env.TARGET_VERSION }}/canonical/platform-merge-report.json
          if-no-files-found: error

  canonical-platform-merge-macos:
    name: canonical-platform-merge (macos-15 audit)
    needs: changes
    if: github.event_name == 'workflow_dispatch' && needs.changes.outputs.full == 'true'
    runs-on: macos-15
    env:
      TARGET_VERSION: ${{ needs.changes.outputs.target_version }}
    steps:
      - uses: actions/checkout@v6

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.13"

      - name: Install missing macOS tools
        run: brew install just

      - name: Tool availability
        run: |
          set -euo pipefail
          bun --version
          just --version
          jq --version
          git --version
          tar --version
          curl --version
          node --version
          npm --version

      - name: Install tool dependencies
        run: bun install --cwd tools --frozen-lockfile

      - name: Typecheck tools
        run: just typecheck

      - name: Stage canonical bundle
        run: just stage "$TARGET_VERSION"

      - name: Check canonical stage
        run: |
          set -euo pipefail
          stage="staging/${TARGET_VERSION}"
          if jq -e '.dualGraph != null' "$stage/stage-manifest.json" >/dev/null; then
            jq -e \
              '.schema == 2 and .mergePolicy == "canonical-dual-graph-v1" and
               .textAssetMaterialization == "zstd-decompress-v1" and
               (.platforms | length == 2) and
               ([.platforms[] | (.files | length) > 0] | all) and
               ([.platforms[].files[] |
                 (.upstream.sha256 | type == "string") and
                 (.materialized.sha256 | type == "string") and
                 (if .loader == 5 then .transformation == "zstd-decompress-v1" else true end)] | all)' \
              "$stage/graph-manifest.json"
          else
            jq -e \
              '(.unclassifiedDrift | length == 0) and (.acceptedDrift | length == 0) and (.output.structuralParseErrors == 0)' \
              "$stage/canonical/platform-merge-report.json"
          fi

      - name: Upload canonical stage report
        uses: actions/upload-artifact@v6
        with:
          name: canonical-platform-merge-macos-15-${{ env.TARGET_VERSION }}
          path: |
            staging/${{ env.TARGET_VERSION }}/stage-manifest.json
            staging/${{ env.TARGET_VERSION }}/graph-manifest.json
            staging/${{ env.TARGET_VERSION }}/canonical/platform-merge-report.json
          if-no-files-found: error

  darwin-tool-test:
    name: darwin-tool-test (macos-15)
    needs: [changes, canonical-platform-merge]
    if: needs.changes.outputs.full == 'true'
    runs-on: macos-15
    env:
      TARGET_VERSION: ${{ needs.changes.outputs.target_version }}
    steps:
      - uses: actions/checkout@v6

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.13"

      - name: Install missing macOS tools
        run: brew install just

      - name: Install tool dependencies
        run: bun install --cwd tools --frozen-lockfile

      - name: Typecheck tools
        run: just typecheck

      - name: Reuse canonical stage
        uses: actions/download-artifact@v6
        with:
          name: canonical-stage-ubuntu-24.04-${{ env.TARGET_VERSION }}
          path: staging/${{ env.TARGET_VERSION }}

      - name: Run tool tests
        env:
          TARGET_VERSION: ${{ env.TARGET_VERSION }}
        run: bun run --cwd tools test

  darwin-obligation-evidence:
    name: darwin-obligation-evidence (macos-15)
    needs: [changes, canonical-platform-merge]
    if: needs.changes.outputs.full == 'true'
    runs-on: macos-15
    env:
      TARGET_VERSION: ${{ needs.changes.outputs.target_version }}
    steps:
      - uses: actions/checkout@v6

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.13"

      - name: Install missing macOS tools
        run: brew install just

      - name: Install tool dependencies
        run: bun install --cwd tools --frozen-lockfile

      - name: Reuse canonical stage for Darwin evidence
        uses: actions/download-artifact@v6
        with:
          name: canonical-stage-ubuntu-24.04-${{ env.TARGET_VERSION }}
          path: staging/${{ env.TARGET_VERSION }}

      - name: Record Darwin patch-obligation evidence
        run: |
          just render "$TARGET_VERSION"
          just obligation-evidence "$TARGET_VERSION" darwin-arm64

      - name: Upload Darwin patch-obligation evidence
        uses: actions/upload-artifact@v6
        with:
          name: patch-obligation-evidence-darwin-${{ env.TARGET_VERSION }}
          path: dist/patch-obligation-evidence/${{ env.TARGET_VERSION }}/darwin-arm64.json
          if-no-files-found: error

  linux-obligation-evidence:
    name: linux-obligation-evidence (ubuntu-24.04)
    needs: [changes, canonical-platform-merge]
    if: needs.changes.outputs.full == 'true'
    runs-on: ubuntu-24.04
    env:
      TARGET_VERSION: ${{ needs.changes.outputs.target_version }}
    steps:
      - uses: actions/checkout@v6

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.13"

      - name: Install missing Ubuntu tools for Linux evidence
        run: |
          sudo apt-get update
          sudo apt-get install -y just ripgrep

      - name: Install tool dependencies
        run: bun install --cwd tools --frozen-lockfile

      - name: Reuse canonical stage for Linux evidence
        uses: actions/download-artifact@v6
        with:
          name: canonical-stage-ubuntu-24.04-${{ env.TARGET_VERSION }}
          path: staging/${{ env.TARGET_VERSION }}

      - name: Record Linux patch-obligation evidence
        run: |
          just render "$TARGET_VERSION"
          just obligation-evidence "$TARGET_VERSION" linux-x64

      - name: Upload Linux patch-obligation evidence
        uses: actions/upload-artifact@v6
        with:
          name: patch-obligation-evidence-linux-${{ env.TARGET_VERSION }}
          path: dist/patch-obligation-evidence/${{ env.TARGET_VERSION }}/linux-x64.json
          if-no-files-found: error

  verify:
    needs: [changes, canonical-platform-merge, darwin-tool-test, darwin-obligation-evidence, linux-obligation-evidence]
    if: needs.changes.outputs.full == 'true'
    runs-on: ubuntu-24.04
    env:
      TARGET_VERSION: ${{ needs.changes.outputs.target_version }}
    steps:
      - uses: actions/checkout@v6

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.13"

      - name: Install missing Ubuntu tools
        run: |
          sudo apt-get update
          sudo apt-get install -y just ripgrep

      - name: Tool availability
        run: |
          set -euo pipefail
          bun --version
          just --version
          jq --version
          gh --version
          git --version
          tar --version
          curl --version
          rg --version
          sha256sum --version
          node --version
          npm --version
          script --version

      - name: Install tool dependencies
        run: bun install --cwd tools --frozen-lockfile

      - name: Typecheck tools
        run: just typecheck

      - name: Reuse canonical stage
        uses: actions/download-artifact@v6
        with:
          name: canonical-stage-ubuntu-24.04-${{ env.TARGET_VERSION }}
          path: staging/${{ env.TARGET_VERSION }}

      - name: Reuse Darwin patch-obligation evidence
        uses: actions/download-artifact@v6
        with:
          name: patch-obligation-evidence-darwin-${{ env.TARGET_VERSION }}
          path: dist/patch-obligation-evidence/${{ env.TARGET_VERSION }}

      - name: Reuse Linux patch-obligation evidence
        uses: actions/download-artifact@v6
        with:
          name: patch-obligation-evidence-linux-${{ env.TARGET_VERSION }}
          path: dist/patch-obligation-evidence/${{ env.TARGET_VERSION }}

      - name: Render patched graph for admission
        run: just render "$TARGET_VERSION"

      - name: Admit patch obligations
        run: just obligation-admission "$TARGET_VERSION"

      - name: Configure audit swap
        run: |
          sudo fallocate -l 8G /mnt/pcc-audit.swap
          sudo chmod 600 /mnt/pcc-audit.swap
          sudo mkswap /mnt/pcc-audit.swap
          sudo swapon /mnt/pcc-audit.swap
          free -h

      - name: Fetch previous prompt catalog source tag
        shell: bash
        run: |
          set -euo pipefail
          version="$TARGET_VERSION"
          previous_version="$(
            for path in prompt-identities/versions/*.json; do
              basename "$path" .json
            done | sort -V | awk -v current="$version" '$0 < current { previous=$0 } END { print previous }'
          )"
          if [[ -z "$previous_version" ]]; then
            echo "No lower prompt identity ledger for $version; prompt review will use baseline semantics."
            exit 0
          fi
          tag="$(
            git ls-remote --tags origin "refs/tags/claude-code-${previous_version}-patch.*" |
              awk 'index($2, "^{}") == 0 { sub("refs/tags/", "", $2); print $2 }' |
              sort -V | tail -n1
          )"
          if [[ -z "$tag" ]]; then
            echo "Previous prompt catalog source tag not found for $previous_version" >&2
            exit 1
          fi
          git fetch --no-tags origin "refs/tags/$tag:refs/tags/$tag"
          echo "Fetched $tag for structured prompt review"

      - name: Run release audit
        run: just ci-release-audit "$TARGET_VERSION" "ci.${GITHUB_SHA::12}"

      - name: Check generated prompt review notes
        shell: bash
        run: |
          set -euo pipefail
          test -s dist/release-notes.md
          test -s dist/prompt-review.md
          rg -q '^## Prompt review$' dist/release-notes.md

      - name: Upload CI artifact
        uses: actions/upload-artifact@v6
        with:
          name: patched-claude-code-${{ env.TARGET_VERSION }}
          path: |
            dist/*.tar.gz
            dist/*.sha256
            dist/*.manifest.json
            dist/release-notes.md
            dist/prompt-review.md
            dist/patch-obligation-admission-*.json
            dist/patch-obligation-evidence/
            cli.js
            manifest.json
            package.json
            bin/claude-patched
            runtime/macos-keychain.ts
            runtime/release-integrity.ts
            runtime/system-prompt-overrides.ts
            prompts/catalog/
            patch-obligations/
            staging/${{ env.TARGET_VERSION }}/stage-manifest.json
            staging/${{ env.TARGET_VERSION }}/graph.patched/
          if-no-files-found: error
