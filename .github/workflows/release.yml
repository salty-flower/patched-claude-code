name: release

on:
  push:
    branches: ["main"]
    tags:
      - "claude-code-*-patch.*"
  workflow_dispatch:
    inputs:
      target_version:
        description: "Claude Code version to stage and patch"
        required: true
        default: "2.1.220"
      release_id:
        description: "Patch release id, for example patch.1"
        required: true
        default: "patch.1"
      publish:
        description: "Create or update the GitHub release"
        type: boolean
        required: true
        default: false

permissions:
  actions: read
  checks: read
  contents: write

jobs:
  release:
    if: >-
      ${{
        github.event_name != 'push' ||
        startsWith(github.ref, 'refs/tags/claude-code-') ||
        startsWith(github.event.head_commit.message, 'release: claude-code-')
      }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.13"

      - name: Install missing Ubuntu tools
        run: |
          sudo apt-get update
          sudo apt-get install -y just

      - name: Tool availability
        run: |
          set -euo pipefail
          bun --version
          just --version
          jq --version
          gh --version
          git --version
          tar --version
          curl --version
          sha256sum --version
          node --version
          npm --version
          script --version

      - name: Resolve release coordinates
        id: coord
        shell: bash
        env:
          HEAD_COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF_TYPE:-}" == "tag" ]]; then
            tag="$GITHUB_REF_NAME"
            if [[ ! "$tag" =~ ^claude-code-([0-9]+\.[0-9]+\.[0-9]+)-(patch\.[0-9]+)$ ]]; then
              echo "tag must match claude-code-<version>-patch.<n>" >&2
              exit 2
            fi
            version="${BASH_REMATCH[1]}"
            release_id="${BASH_REMATCH[2]}"
            publish=true
          elif [[ "${GITHUB_EVENT_NAME:-}" == "push" ]]; then
            subject="$(printf '%s' "$HEAD_COMMIT_MESSAGE" | head -n1)"
            if [[ ! "$subject" =~ ^release:\ claude-code-([0-9]+\.[0-9]+\.[0-9]+)-(patch\.[0-9]+)$ ]]; then
              echo "release commit title must match: release: claude-code-<version>-patch.<n>" >&2
              exit 2
            fi
            version="${BASH_REMATCH[1]}"
            release_id="${BASH_REMATCH[2]}"
            tag="claude-code-${version}-${release_id}"
            publish=true
          else
            version="${{ inputs.target_version }}"
            release_id="${{ inputs.release_id }}"
            tag="claude-code-${version}-${release_id}"
            publish="${{ inputs.publish }}"
          fi
          {
            echo "version=$version"
            echo "release_id=$release_id"
            echo "tag=$tag"
            echo "publish=$publish"
          } >> "$GITHUB_OUTPUT"

      - name: Install tool dependencies
        run: bun install --cwd tools --frozen-lockfile

      - name: Typecheck tools
        run: just typecheck

      - name: Reuse CI artifact (release-commit path)
        id: reuse
        if: >-
          github.event_name == 'push' &&
          startsWith(github.ref, 'refs/heads/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="${{ steps.coord.outputs.version }}"
          artifact_name="patched-claude-code-${version}"

          # Full release audit can exceed 10 min on GitHub runners.
          deadline=$((SECONDS + 1800))
          run_id=""
          while [[ $SECONDS -lt $deadline ]]; do
            run_id=$(gh run list \
              --workflow=ci.yml \
              --commit "$GITHUB_SHA" \
              --limit 1 \
              --json databaseId \
              --jq '.[0].databaseId // empty' 2>/dev/null || true)
            [[ -n "$run_id" ]] && break
            sleep 15
          done

          if [[ -z "$run_id" ]]; then
            echo "No CI run found for release commit $GITHUB_SHA — aborting release" >&2
            exit 1
          fi

          echo "Found CI run $run_id — waiting for completion"
          if ! gh run watch "$run_id" --exit-status; then
            echo "CI run failed — aborting release" >&2
            exit 1
          fi

          if ! gh run download "$run_id" --name "$artifact_name" --dir ci-artifact 2>/dev/null; then
            echo "Artifact not found (verify job may have been skipped) — will render from scratch"
            echo "reused=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          cp ci-artifact/cli.js cli.js
          cp ci-artifact/manifest.json manifest.json
          cp ci-artifact/package.json package.json
          mkdir -p bin runtime "staging/$version"
          mkdir -p prompts
          cp ci-artifact/cli.js "staging/$version/cli.patched.js"
          install -m755 ci-artifact/bin/claude-patched bin/claude-patched
          cp ci-artifact/runtime/system-prompt-overrides.ts runtime/system-prompt-overrides.ts
          cp -R ci-artifact/prompts/catalog prompts/catalog
          echo "reused=true" >> "$GITHUB_OUTPUT"

      - name: Verify and render patched bundle
        if: steps.reuse.outputs.reused != 'true'
        env:
          TARGET_SOURCE: canonical
        run: just render "${{ steps.coord.outputs.version }}"

      - name: Smoke patched bundle
        if: steps.reuse.outputs.reused != 'true'
        run: just smoke-rendered "${{ steps.coord.outputs.version }}"

      - name: Patch tests
        if: steps.reuse.outputs.reused != 'true'
        run: just _patch-test-rendered "${{ steps.coord.outputs.version }}"

      - name: Fetch previous prompt catalog source tag
        shell: bash
        run: |
          set -euo pipefail
          version="${{ steps.coord.outputs.version }}"
          previous_version="$(
            for path in prompt-identities/versions/*.json; do
              basename "$path" .json
            done | sort -V | awk -v current="$version" '$0 < current { previous=$0 } END { print previous }'
          )"
          if [[ -z "$previous_version" ]]; then
            echo "No lower prompt identity ledger for $version; prompt review will use baseline semantics."
            exit 0
          fi
          tag="$(
            git ls-remote --tags origin "refs/tags/claude-code-${previous_version}-patch.*" |
              awk 'index($2, "^{}") == 0 { sub("refs/tags/", "", $2); print $2 }' |
              sort -V | tail -n1
          )"
          if [[ -z "$tag" ]]; then
            echo "Previous prompt catalog source tag not found for $previous_version" >&2
            exit 1
          fi
          git fetch --no-tags origin "refs/tags/$tag:refs/tags/$tag"
          echo "Fetched $tag for structured prompt review"

      - name: Package release artifact
        run: just _package-rendered "${{ steps.coord.outputs.version }}" "${{ steps.coord.outputs.release_id }}"

      - name: Create Nix source tag
        run: |
          set -euo pipefail
          just _release-source-rendered "${{ steps.coord.outputs.version }}" "${{ steps.coord.outputs.release_id }}"
          bun ./cli.js --version

      - name: Push Nix source refs
        if: steps.coord.outputs.publish == 'true'
        run: |
          set -euo pipefail
          tag="${{ steps.coord.outputs.tag }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git push origin "refs/tags/$tag" --force
          git push origin "refs/tags/$tag:refs/heads/claude-code-latest" --force

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v6
        with:
          name: patched-claude-code-${{ steps.coord.outputs.version }}-${{ steps.coord.outputs.release_id }}
          path: |
            dist/*.tar.gz
            dist/*.sha256
            dist/*.manifest.json
            dist/release-notes.md
            cli.js
            manifest.json
            package.json
            bin/claude-patched
            runtime/system-prompt-overrides.ts
            prompts/catalog/
          if-no-files-found: error

      - name: Publish GitHub release
        if: steps.coord.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${{ steps.coord.outputs.tag }}"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release edit "$tag" \
              --repo "$GITHUB_REPOSITORY" \
              --title "$tag" \
              --notes-file dist/release-notes.md
            gh release upload "$tag" \
              --repo "$GITHUB_REPOSITORY" \
              --clobber \
              dist/*.tar.gz \
              dist/*.sha256 \
              dist/*.manifest.json
          else
            gh release create "$tag" \
              --repo "$GITHUB_REPOSITORY" \
              --title "$tag" \
              --notes-file dist/release-notes.md \
              dist/*.tar.gz \
              dist/*.sha256 \
              dist/*.manifest.json
          fi
