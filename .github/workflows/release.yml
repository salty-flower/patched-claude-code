name: release

on:
  push:
    branches: ["main"]
    tags:
      - "claude-code-*-patch.*"
  workflow_dispatch:
    inputs:
      target_version:
        description: "Claude Code version to stage and patch"
        required: true
        default: "2.1.132"
      release_id:
        description: "Patch release id, for example patch.1"
        required: true
        default: "patch.1"
      platform_package:
        description: "Native package to extract"
        required: true
        default: "@anthropic-ai/claude-code-darwin-arm64"
      publish:
        description: "Create or update the GitHub release"
        type: boolean
        required: true
        default: false

permissions:
  contents: write

jobs:
  release:
    if: >-
      ${{
        github.event_name != 'push' ||
        startsWith(github.ref, 'refs/tags/claude-code-') ||
        startsWith(github.event.head_commit.message, 'release: claude-code-')
      }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.13"

      - name: Install missing Ubuntu tools
        run: |
          sudo apt-get update
          sudo apt-get install -y just

      - name: Tool availability
        run: |
          set -euo pipefail
          bun --version
          just --version
          jq --version
          gh --version
          git --version
          tar --version
          curl --version
          sha256sum --version
          node --version
          npm --version
          script --version

      - name: Resolve release coordinates
        id: coord
        shell: bash
        env:
          HEAD_COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF_TYPE:-}" == "tag" ]]; then
            tag="$GITHUB_REF_NAME"
            if [[ ! "$tag" =~ ^claude-code-([0-9]+\.[0-9]+\.[0-9]+)-(patch\.[0-9]+)$ ]]; then
              echo "tag must match claude-code-<version>-patch.<n>" >&2
              exit 2
            fi
            version="${BASH_REMATCH[1]}"
            release_id="${BASH_REMATCH[2]}"
            platform_package="@anthropic-ai/claude-code-darwin-arm64"
            publish=true
          elif [[ "${GITHUB_EVENT_NAME:-}" == "push" ]]; then
            subject="$(printf '%s' "$HEAD_COMMIT_MESSAGE" | head -n1)"
            if [[ ! "$subject" =~ ^release:\ claude-code-([0-9]+\.[0-9]+\.[0-9]+)-(patch\.[0-9]+)$ ]]; then
              echo "release commit title must match: release: claude-code-<version>-patch.<n>" >&2
              exit 2
            fi
            version="${BASH_REMATCH[1]}"
            release_id="${BASH_REMATCH[2]}"
            platform_package="@anthropic-ai/claude-code-darwin-arm64"
            tag="claude-code-${version}-${release_id}"
            publish=true
          else
            version="${{ inputs.target_version }}"
            release_id="${{ inputs.release_id }}"
            platform_package="${{ inputs.platform_package }}"
            tag="claude-code-${version}-${release_id}"
            publish="${{ inputs.publish }}"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "release_id=$release_id" >> "$GITHUB_OUTPUT"
          echo "platform_package=$platform_package" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "publish=$publish" >> "$GITHUB_OUTPUT"

      - name: Install tool dependencies
        run: bun install --cwd tools --frozen-lockfile

      - name: Typecheck tools
        run: just typecheck

      - name: Stage target bundle
        env:
          TARGET_PLATFORM_PACKAGE: ${{ steps.coord.outputs.platform_package }}
        run: just stage "${{ steps.coord.outputs.version }}"

      - name: Verify patches and contracts
        env:
          TARGET_PLATFORM_PACKAGE: ${{ steps.coord.outputs.platform_package }}
        run: just verify "${{ steps.coord.outputs.version }}"

      - name: Render patched bundle
        run: just render "${{ steps.coord.outputs.version }}"

      - name: Smoke patched bundle
        run: just smoke "${{ steps.coord.outputs.version }}"

      - name: Patch tests
        run: just patch-test "${{ steps.coord.outputs.version }}"

      - name: Package release artifact
        run: just package "${{ steps.coord.outputs.version }}" "${{ steps.coord.outputs.release_id }}"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v6
        with:
          name: audited-claude-code-${{ steps.coord.outputs.version }}-${{ steps.coord.outputs.release_id }}
          path: |
            dist/*.tar.gz
            dist/*.sha256
            dist/*.manifest.json
            dist/release-notes.md
          if-no-files-found: error

      - name: Publish GitHub release
        if: steps.coord.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${{ steps.coord.outputs.tag }}"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release edit "$tag" \
              --repo "$GITHUB_REPOSITORY" \
              --title "$tag" \
              --notes-file dist/release-notes.md
            gh release upload "$tag" \
              --repo "$GITHUB_REPOSITORY" \
              --clobber \
              dist/*.tar.gz \
              dist/*.sha256 \
              dist/*.manifest.json
          else
            gh release create "$tag" \
              --repo "$GITHUB_REPOSITORY" \
              --title "$tag" \
              --target "$GITHUB_SHA" \
              --notes-file dist/release-notes.md \
              dist/*.tar.gz \
              dist/*.sha256 \
              dist/*.manifest.json
          fi
