fail_fast: false

repos:
  - repo: local
    hooks:
      - id: staged-diff-check
        name: staged diff has no whitespace errors
        entry: git diff --cached --check
        language: system
        always_run: true
        pass_filenames: false

      - id: tools-typecheck
        name: tools TypeScript typecheck
        entry: just typecheck
        language: system
        always_run: true
        pass_filenames: false

      - id: verify-patches
        name: patch locators and rationale refs verify
        entry: just verify
        language: system
        always_run: true
        pass_filenames: false

      - id: render-and-smoke-current-target
        name: render and smoke current patched target
        entry: just smoke
        language: system
        always_run: true
        pass_filenames: false
        stages: [manual]
