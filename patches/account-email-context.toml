name = "account-email-context"
target_version = "2.1.325"
applies_to = ">=2.1.325 <2.1.326"

[[patches]]
name = "account-email-context-omit"
rationale = """
Keep authentication identity outside the model's automatically constructed user context.
The v2.1.88 context constructor contains project instructions and the current date;
the later account-email spread is a new gate absent from that audit baseline.
Removing that spread prevents both the main conversation and inherited subagent
contexts from acquiring the account email while preserving authentication,
session identity, and the upstream privacy tool check.
Prompt-only restrictions and outbound shell heuristics leave the email available
for generated artifacts, so neither is a substitute for omitting it at construction.
Cleanup condition: upstream no longer inserts account identity into model-visible context.
"""
rationale_ref = "reference/v2.1.88/sources/src/context.ts#L152-L189"
locator_kind = "ast_transform"

[patches.ast]
schema = 1
match = { node = "SpreadElement", strings = ["userEmail:", "The user's email address is"] }

[patches.transform]
op = "replace_node"
value = '''.../* account-email-context: omitted */{}'''

[[patches.tests]]
kind = "static"
name = "account identity spread is explicitly omitted"
assert_contains = '''.../* account-email-context: omitted */{}'''

[[patches.tests]]
kind = "static"
name = "account email prompt is absent"
assert_not_contains = '''The user's email address is'''

[[patches]]
name = "account-email-context-omit-replayed-section"
rationale = """
Exclude account email from historical typed session-context attachments before API normalization.
Suppressing new context construction leaves both the saved context dictionary and
its cached rendered reminder in a transcript created by an unpatched bundle.
Remove only that typed attachment's userEmail field and rendered userEmail section;
other context sections, arbitrary tool output, and all user-authored text remain.
The API generator's first message-array parameter is captured from its AST;
no inserted symbol depends on version-local minification.
Cleanup condition: upstream discards historical account-email context during replay.
"""
rationale_ref = "reference/v2.1.88/sources/src/services/api/claude.ts#L1257-L1285"
locator_kind = "ast_transform"

[patches.ast]
schema = 1
match = { node = "FunctionDeclaration", strings = ["tengu_api_before_normalize", "tengu_api_after_normalize"] }

[patches.ast.captures.messages]
kind = "identifier"
path = "params.0"

[patches.transform]
op = "prepend_function_body"
code = '''/* account-email-context: replay omitted */const __pccEmailText=(text)=>text.replace(/(^|\n)# userEmail\r?\n[\s\S]*?(?=\n# [^\n]+\n|\n<\/system-reminder>)/g,"$1");const __pccEmailContent=(content)=>typeof content==="string"?__pccEmailText(content):Array.isArray(content)?content.map((block)=>block&&block.type==="text"&&typeof block.text==="string"?{...block,text:__pccEmailText(block.text)}:block):content;%%CAPTURE:messages%%=%%CAPTURE:messages%%.map((message)=>{if(message.type!=="attachment"||message.attachment?.type!=="session_context")return message;const{userEmail:__pccOmittedEmail,...__pccSafeContext}=message.attachment.context??{};return{...message,attachment:{...message.attachment,context:__pccSafeContext},...Array.isArray(message.rendered)&&{rendered:message.rendered.map((part)=>({...part,content:__pccEmailContent(part.content)}))}};});'''

[[patches.tests]]
kind = "static"
name = "historical harness context is sanitized before normalization"
assert_contains = '''/* account-email-context: replay omitted */const __pccEmailText='''

[[patches.tests]]
kind = "static"
name = "historical filtering requires typed harness context"
assert_contains = '''message.type!=="attachment"||message.attachment?.type!=="session_context"'''
