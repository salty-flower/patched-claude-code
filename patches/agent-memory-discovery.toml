target_version = "2.1.133"
applies_to = ">=2.1.133 <2.1.137"

rationale = """
Load AGENTS.md while walking project ancestor directories.

The primary project-memory walk currently tries each ancestor directory's
CLAUDE.md before .claude/CLAUDE.md and rules. Patched bundles should also read
AGENTS.md from the same ancestor so Codex-oriented repo instructions participate
in Claude Code's normal project-memory precedence. Cleanup condition: upstream
supports AGENTS.md as an official memory file or exposes a configurable
project-memory filename list.
"""
rationale_ref = "reference/v2.1.88/sources/src/utils/claudemd.ts#L886-L910"

locator_pattern = '''let G=rT.join(X,"CLAUDE.md");q.push(...await YC(G,"Project",K,T));let W=rT.join(X,".claude","CLAUDE.md")'''
locator_kind = "literal"
expected_matches = 1

replacement = '''let G=rT.join(X,"CLAUDE.md");q.push(...await YC(G,"Project",K,T));let Q=rT.join(X,"AGENTS.md");q.push(...await YC(Q,"Project",K,T));let W=rT.join(X,".claude","CLAUDE.md")'''

