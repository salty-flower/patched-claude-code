name = "agent-memory-discovery"
target_version = "2.1.133"
applies_to = ">=2.1.133 <2.2.0"

rationale = """
Group the AGENTS.md/memory discovery patches that control project, ancestor, nested, additional-directory, and realpath-dedup behavior.
"""
[[patches]]
name = "agents-memory-additional-directories"
target_version = "2.1.133"
applies_to = ">=2.1.133 <2.1.137"

rationale = """
Load AGENTS.md from additional project directories.

When the explicit additional-directory memory path is enabled, upstream reads
CLAUDE.md and .claude/CLAUDE.md from each added directory. Patched bundles
should also read AGENTS.md so explicit extra workspaces retain the same
Codex-compatible instruction behavior as the main workspace. Cleanup condition:
upstream supports AGENTS.md as an official memory file or exposes a
configurable project-memory filename list.
"""
rationale_ref = "reference/v2.1.88/sources/src/utils/claudemd.ts#L936-L956"

locator_pattern = '''let G=rT.join(P,"CLAUDE.md");q.push(...await YC(G,"Project",K,T));let W=rT.join(P,".claude","CLAUDE.md")'''
locator_kind = "literal"
expected_matches = 1

replacement = '''let G=rT.join(P,"CLAUDE.md");q.push(...await YC(G,"Project",K,T));let Q=rT.join(P,"AGENTS.md");q.push(...await YC(Q,"Project",K,T));let W=rT.join(P,".claude","CLAUDE.md")'''

[[patches.tests]]
kind = "static"
name = "replacement is rendered"
assert_contains = '''"AGENTS.md"'''

[[patches]]
name = "agents-memory-additional-directories-2-1-137"
target_version = "2.1.137"
applies_to = ">=2.1.137 <2.2.0"

rationale = """
