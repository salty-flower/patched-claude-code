name = "agent-memory-discovery"
target_version = "2.1.133"
applies_to = ">=2.1.133 <2.2.0"

rationale = """
Group the AGENTS.md/memory discovery patches that control project, ancestor, nested, additional-directory, and realpath-dedup behavior.
"""

[[patches]]
name = "agents-memory-nested-directory"
target_version = "2.1.133"
applies_to = ">=2.1.133 <2.1.181"

rationale = """
Load AGENTS.md beside CLAUDE.md when collecting nested-directory project memory.

The upstream memory loader reads CLAUDE.md and .claude/CLAUDE.md for a nested
directory. Codex-compatible repositories commonly put durable agent rules in
AGENTS.md, so patched bundles should treat that sibling file as project memory
too. Cleanup condition: upstream supports AGENTS.md as an official memory file
or exposes a configurable project-memory filename list.
"""
rationale_ref = "reference/v2.1.88/sources/src/utils/claudemd.ts#L1249-L1268"

locator_kind = "regex"
locator_pattern = '''let\s+([a-zA-Z0-9_$]+)=([a-zA-Z0-9_.$]+)\(([a-zA-Z0-9_$]+),"CLAUDE\.md"\);K\.push\(\.\.\.await\s+([a-zA-Z0-9_$]+)\(\1,"Project",q,!1\)\);let\s+([a-zA-Z0-9_$]+)=\2\(\3,"\.claude","CLAUDE\.md"\)'''
expected_matches = 1

replacement = '''let $1=$2($3,"CLAUDE.md");K.push(...await $4($1,"Project",q,!1));let AGENTS_MD=$2($3,"AGENTS.md");K.push(...await $4(AGENTS_MD,"Project",q,!1));let $5=$2($3,".claude","CLAUDE.md")'''

[[patches.tests]]
kind = "static"
name = "replacement is rendered"
assert_contains = '''"AGENTS.md"'''

[[patches]]
name = "agents-memory-nested-directory-2-1-181"
target_version = "2.1.181"
applies_to = ">=2.1.181 <2.1.212"

rationale = """
Load AGENTS.md beside CLAUDE.md when collecting nested-directory project memory.

This is the 2.1.181 minified-symbol variant of
`agents-memory-nested-directory`; the local accumulator no longer minifies to
`K` and the function prologue is needed to keep the match unique. Cleanup
condition: upstream supports AGENTS.md as an official memory file or exposes a
configurable project-memory filename list.
"""
rationale_ref = "reference/v2.1.88/sources/src/utils/claudemd.ts#L1249-L1268"

locator_kind = "regex"
locator_pattern = '''(async function [a-zA-Z0-9_$]+\([^)]*\)\{if\([^)]+CLAUDE_CODE_DISABLE_CLAUDE_MDS[^)]*\)return\[\];let\s+[a-zA-Z0-9_$]+=\[\];if\([a-zA-Z0-9_$]+\("projectSettings"\)\)\{)let\s+([a-zA-Z0-9_$]+)=([a-zA-Z0-9_.$]+)\(([a-zA-Z0-9_$]+),"CLAUDE\.md"\);([a-zA-Z0-9_$]+)\.push\(\.\.\.await\s+([a-zA-Z0-9_$]+)\(\2,"Project",([a-zA-Z0-9_$]+),!1\)\);let\s+([a-zA-Z0-9_$]+)=\3\(\4,"\.claude","CLAUDE\.md"\)'''
expected_matches = 1

replacement = '''$1let $2=$3($4,"CLAUDE.md");$5.push(...await $6($2,"Project",$7,!1));let AGENTS_MD=$3($4,"AGENTS.md");$5.push(...await $6(AGENTS_MD,"Project",$7,!1));let $8=$3($4,".claude","CLAUDE.md")'''

[[patches.tests]]
kind = "static"
name = "replacement is rendered in 2.1.181"
assert_contains = '''"AGENTS.md"'''

[[patches]]
name = "agents-memory-nested-directory-2-1-212"
target_version = "2.1.212"
applies_to = ">=2.1.212 <2.1.215"

rationale = """
Load AGENTS.md beside CLAUDE.md when collecting nested-directory project memory.

This is the 2.1.212 minified-symbol variant of
`agents-memory-nested-directory`. The nested loader is now `ZJn`; its path
namespace is `gb`, accumulator is `n`, memory loader is `qle`, and processed
path set is `r`. Cleanup condition: upstream supports AGENTS.md as an official
memory file or exposes a configurable project-memory filename list.
"""
rationale_ref = "reference/v2.1.88/sources/src/utils/claudemd.ts#L1249-L1268"

locator_kind = "ast_transform"

[patches.ast]
schema = 1
match = { node = "FunctionDeclaration", function_name = "ZJn", strings = ['''CLAUDE_CODE_DISABLE_CLAUDE_MDS''', '''let i=gb.join(e,"CLAUDE.md");n.push(...await qle(i,"Project",r,!1));let s=gb.join(e,".claude","CLAUDE.md")'''] }

[patches.transform]
op = "replace_substring"
find = '''let i=gb.join(e,"CLAUDE.md");n.push(...await qle(i,"Project",r,!1));let s=gb.join(e,".claude","CLAUDE.md")'''
value = '''let i=gb.join(e,"CLAUDE.md");n.push(...await qle(i,"Project",r,!1));let AGENTS_MD=gb.join(e,"AGENTS.md");n.push(...await qle(AGENTS_MD,"Project",r,!1));let s=gb.join(e,".claude","CLAUDE.md")'''

[[patches.tests]]
kind = "static"
name = "nested-directory AGENTS.md loader is rendered in 2.1.212"
assert_contains = '''let i=gb.join(e,"CLAUDE.md");n.push(...await qle(i,"Project",r,!1));let AGENTS_MD=gb.join(e,"AGENTS.md");n.push(...await qle(AGENTS_MD,"Project",r,!1));let s=gb.join(e,".claude","CLAUDE.md")'''

[[patches.tests]]
kind = "static"
name = "unpatched 2.1.212 nested-memory sequence is absent"
assert_not_contains = '''let i=gb.join(e,"CLAUDE.md");n.push(...await qle(i,"Project",r,!1));let s=gb.join(e,".claude","CLAUDE.md")'''

[[patches.tests]]
kind = "static"
name = "2.1.212 nested loader no longer carries 2.1.210 symbols"
assert_not_contains = '''let s=z_.join(e,"CLAUDE.md");n.push(...await Kae(s,"Project",r,!1));let AGENTS_MD=z_.join(e,"AGENTS.md");n.push(...await Kae(AGENTS_MD,"Project",r,!1));let a=z_.join(e,".claude","CLAUDE.md")'''

