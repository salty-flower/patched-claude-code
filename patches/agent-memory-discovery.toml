[[patches]]
name = "memory-file-realpath-overlap-dedup"
target_version = "2.1.133"
applies_to = ">=2.1.133 <2.1.142"

rationale = """
Deduplicate memory files only when their resolved filesystem targets overlap.

The shared memory-file processor records a symlink's realpath after the initial
path check, but it does not check that resolved path before reading. With
AGENTS.md loaded through the same processor as CLAUDE.md, both files should be
kept when they are distinct and deduplicated only when one is a symlink to the
other. Cleanup condition: upstream performs realpath overlap checks before
loading memory files.
"""
rationale_ref = "reference/v2.1.88/sources/src/utils/claudemd.ts#L626-L648"

locator_kind = "regex"
locator_pattern = '''let\{resolvedPath:([a-zA-Z0-9_$]+),isSymlink:([a-zA-Z0-9_$]+)\}=([a-zA-Z0-9_$]+)\(([a-zA-Z0-9_$]+\(\),[a-zA-Z0-9_$]+)\);if\(q\.add\(([a-zA-Z0-9_$]+)\),\2\)q\.add\(([a-zA-Z0-9_$]+)\(\1\)\);let\{info:([a-zA-Z0-9_$]+),includePaths:([a-zA-Z0-9_$]+)\}=await ([a-zA-Z0-9_$]+)\(H,_,\1\)'''
expected_matches = 1

replacement = '''let{resolvedPath:$1,isSymlink:$2}=$3($4),YH=$6($1);if($2&&q.has(YH))return[];if(q.add($5),$2)q.add(YH);let{info:$7,includePaths:$8}=await $9(H,_,$1)'''

[[patches.tests]]
kind = "static"
name = "replacement is rendered"
assert_contains = '''if($&&q.has(YH))return[];'''
