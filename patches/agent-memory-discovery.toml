name = "agent-memory-discovery"
target_version = "2.1.133"
applies_to = ">=2.1.133 <2.2.0"

rationale = """
Group the AGENTS.md/memory discovery patches that control project, ancestor, nested, additional-directory, and realpath-dedup behavior.
"""

[[patches]]
name = "agents-memory-nested-directory"
target_version = "2.1.133"
applies_to = ">=2.1.133 <2.2.0"

rationale = """
Load AGENTS.md beside CLAUDE.md when collecting nested-directory project memory.

The upstream memory loader reads CLAUDE.md and .claude/CLAUDE.md for a nested
directory. Codex-compatible repositories commonly put durable agent rules in
AGENTS.md, so patched bundles should treat that sibling file as project memory
too. Cleanup condition: upstream supports AGENTS.md as an official memory file
or exposes a configurable project-memory filename list.
"""
rationale_ref = "reference/v2.1.88/sources/src/utils/claudemd.ts#L1249-L1268"

locator_kind = "regex"
locator_pattern = '''let\s+([a-zA-Z0-9_$]+)=([a-zA-Z0-9_.]+)\(([a-zA-Z0-9_$]+),"CLAUDE\.md"\);K\.push\(\.\.\.await\s+([a-zA-Z0-9_$]+)\(\1,"Project",q,!1\)\);let\s+([a-zA-Z0-9_$]+)=\2\(\3,"\.claude","CLAUDE\.md"\)'''
expected_matches = 1

replacement = '''let $1=$2($3,"CLAUDE.md");K.push(...await $4($1,"Project",q,!1));let AGENTS_MD=$2($3,"AGENTS.md");K.push(...await $4(AGENTS_MD,"Project",q,!1));let $5=$2($3,".claude","CLAUDE.md")'''

[[patches.tests]]
kind = "static"
name = "replacement is rendered"
assert_contains = '''"AGENTS.md"'''

[[patches]]
name = "agents-memory-ancestor-directories"
target_version = "2.1.133"
applies_to = ">=2.1.133 <2.2.0"

rationale = """
Load AGENTS.md while walking project ancestor directories.

The primary project-memory walk currently tries each ancestor directory's
CLAUDE.md before .claude/CLAUDE.md and rules. Patched bundles should also read
AGENTS.md from the same ancestor so Codex-oriented repo instructions participate
in Claude Code's normal project-memory precedence. Cleanup condition: upstream
supports AGENTS.md as an official memory file or exposes a configurable
project-memory filename list.
"""
rationale_ref = "reference/v2.1.88/sources/src/utils/claudemd.ts#L886-L910"

locator_kind = "regex"
locator_pattern = '''for\(let [a-zA-Z0-9_$]+ of [a-zA-Z0-9_$]+\.reverse\(\)\)\{.{0,600}?let\s+([a-zA-Z0-9_$]+)=([a-zA-Z0-9_.]+)\(([a-zA-Z0-9_$]+),"CLAUDE\.md"\);q\.push\(\.\.\.await\s+([a-zA-Z0-9_$]+)\(\1,"Project",([^)]+)\)\);let\s+([a-zA-Z0-9_$]+)=\2\(\3,"\.claude","CLAUDE\.md"\)'''
expected_matches = 1

replacement = '''let $1=$2($3,"CLAUDE.md");q.push(...await $4($1,"Project",$5));let AGENTS_MD=$2($3,"AGENTS.md");q.push(...await $4(AGENTS_MD,"Project",$5));let $6=$2($3,".claude","CLAUDE.md")'''

[[patches.tests]]
kind = "static"
name = "replacement is rendered"
assert_contains = '''"AGENTS.md"'''

[[patches]]
name = "agents-memory-additional-directories"
target_version = "2.1.133"
applies_to = ">=2.1.133 <2.2.0"

rationale = """
Load AGENTS.md from additional project directories.

When the explicit additional-directory memory path is enabled, upstream reads
CLAUDE.md and .claude/CLAUDE.md from each added directory. Patched bundles
should also read AGENTS.md so explicit extra workspaces retain the same
Codex-compatible instruction behavior as the main workspace. Cleanup condition:
upstream supports AGENTS.md as an official memory file or exposes a
configurable project-memory filename list.
"""
rationale_ref = "reference/v2.1.88/sources/src/utils/claudemd.ts#L936-L956"

locator_kind = "regex"
locator_pattern = '''CLAUDE_CODE_ADDITIONAL_DIRECTORIES_CLAUDE_MD\)\)\{.{0,400}?for\(let [a-zA-Z0-9_$]+ of [a-zA-Z0-9_$]+\)\{.{0,300}?let\s+([a-zA-Z0-9_$]+)=([a-zA-Z0-9_.]+)\(([a-zA-Z0-9_$]+),"CLAUDE\.md"\);q\.push\(\.\.\.await\s+([a-zA-Z0-9_$]+)\(\1,"Project",([^)]+)\)\);let\s+([a-zA-Z0-9_$]+)=\2\(\3,"\.claude","CLAUDE\.md"\)'''
expected_matches = 1

replacement = '''let $1=$2($3,"CLAUDE.md");q.push(...await $4($1,"Project",$5));let AGENTS_MD=$2($3,"AGENTS.md");q.push(...await $4(AGENTS_MD,"Project",$5));let $6=$2($3,".claude","CLAUDE.md")'''

[[patches.tests]]
kind = "static"
name = "replacement is rendered"
assert_contains = '''"AGENTS.md"'''

[[patches]]
name = "agents-memory-file-detection"
target_version = "2.1.133"
applies_to = ">=2.1.133 <2.2.0"

rationale = """
Treat AGENTS.md as a memory file for cache and invalidation checks.

The memory-file detector recognizes CLAUDE.md, CLAUDE.local.md, and
.claude/rules markdown files. Once AGENTS.md is loaded as project memory, the
same detector must recognize it so memory file tracking and cache invalidation
observe edits. Cleanup condition: upstream supports AGENTS.md as an official
memory file or exposes a configurable project-memory filename list.
"""
rationale_ref = "reference/v2.1.88/sources/src/utils/claudemd.ts#L1432-L1448"

locator_kind = "regex"
locator_pattern = '''function ([a-zA-Z0-9_$]+)\(H\)\{let _=([a-zA-Z0-9_.]+)\.basename\(H\);if\(_==="CLAUDE\.md"\|\|_==="CLAUDE\.local\.md"\)return!0;'''
expected_matches = 1

replacement = '''function $1(H){let _=$2.basename(H);if(_==="CLAUDE.md"||_==="CLAUDE.local.md"||_==="AGENTS.md")return!0;'''

[[patches.tests]]
kind = "static"
name = "replacement is rendered"
assert_contains = '''||_==="AGENTS.md")return!0;'''

[[patches]]
name = "memory-file-realpath-overlap-dedup"
target_version = "2.1.133"
applies_to = ">=2.1.133 <2.2.0"

rationale = """
Deduplicate memory files only when their resolved filesystem targets overlap.

The shared memory-file processor records a symlink's realpath after the initial
path check, but it does not check that resolved path before reading. With
AGENTS.md loaded through the same processor as CLAUDE.md, both files should be
kept when they are distinct and deduplicated only when one is a symlink to the
other. Cleanup condition: upstream performs realpath overlap checks before
loading memory files.
"""
rationale_ref = "reference/v2.1.88/sources/src/utils/claudemd.ts#L626-L648"

locator_kind = "regex"
locator_pattern = '''let\{resolvedPath:z,isSymlink:\$\}=([a-zA-Z0-9_$]+)\(([a-zA-Z0-9_$]+\(\),[a-zA-Z0-9_$]+)\);if\(q\.add\(A\),\$\)q\.add\(([a-zA-Z0-9_$]+)\(z\)\);let\{info:Y,includePaths:w\}=await ([a-zA-Z0-9_$]+)\(H,_,z\)'''
expected_matches = 1

replacement = '''let{resolvedPath:z,isSymlink:$}=$1($2),YH=$3(z);if($$&&q.has(YH))return[];if(q.add(A),$)q.add(YH);let{info:Y,includePaths:w}=await $4(H,_,z)'''

[[patches.tests]]
kind = "static"
name = "replacement is rendered"
assert_contains = '''if($&&q.has(YH))return[];'''
