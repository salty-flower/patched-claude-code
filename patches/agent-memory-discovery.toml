[[patches]]
name = "agents-memory-ancestor-directories"
target_version = "2.1.133"
applies_to = ">=2.1.133 <2.2.0"

rationale = """
Load AGENTS.md while walking project ancestor directories.

The primary project-memory walk currently tries each ancestor directory's
CLAUDE.md before .claude/CLAUDE.md and rules. Patched bundles should also read
AGENTS.md from the same ancestor so Codex-oriented repo instructions participate
in Claude Code's normal project-memory precedence. Cleanup condition: upstream
supports AGENTS.md as an official memory file or exposes a configurable
project-memory filename list.
"""
rationale_ref = "reference/v2.1.88/sources/src/utils/claudemd.ts#L886-L910"

locator_kind = "regex"
locator_pattern = '''(for\(let [a-zA-Z0-9_$]+ of [a-zA-Z0-9_$]+\.reverse\(\)\)\{.{0,700}?if\([^{]*"projectSettings"[^}]*?\)\{)let\s+([a-zA-Z0-9_$]+)=([a-zA-Z0-9_.$]+)\(([a-zA-Z0-9_$]+),"CLAUDE\.md"\);([a-zA-Z0-9_$]+)\.push\(\.\.\.await\s+([a-zA-Z0-9_$]+)\(\2,"Project",([^)]+)\)\);let\s+([a-zA-Z0-9_$]+)=\3\(\4,"\.claude","CLAUDE\.md"\)'''
expected_matches = 1

replacement = '''$1let $2=$3($4,"CLAUDE.md");$5.push(...await $6($2,"Project",$7));let AGENTS_MD=$3($4,"AGENTS.md");$5.push(...await $6(AGENTS_MD,"Project",$7));let $8=$3($4,".claude","CLAUDE.md")'''

[[patches.tests]]
kind = "static"
name = "replacement is rendered"
assert_contains = '''"AGENTS.md"'''

[[patches]]
name = "agents-memory-additional-directories"
target_version = "2.1.133"
applies_to = ">=2.1.133 <2.2.0"

rationale = """
Load AGENTS.md from additional project directories.

When the explicit additional-directory memory path is enabled, upstream reads
CLAUDE.md and .claude/CLAUDE.md from each added directory. Patched bundles
should also read AGENTS.md so explicit extra workspaces retain the same
Codex-compatible instruction behavior as the main workspace. Cleanup condition:
upstream supports AGENTS.md as an official memory file or exposes a
configurable project-memory filename list.
"""
rationale_ref = "reference/v2.1.88/sources/src/utils/claudemd.ts#L936-L956"

locator_kind = "regex"
locator_pattern = '''(CLAUDE_CODE_ADDITIONAL_DIRECTORIES_CLAUDE_MD\)\)\{.{0,400}?for\(let [a-zA-Z0-9_$]+ of [a-zA-Z0-9_$]+\)\{)let\s+([a-zA-Z0-9_$]+)=([a-zA-Z0-9_.$]+)\(([a-zA-Z0-9_$]+),"CLAUDE\.md"\);([a-zA-Z0-9_$]+)\.push\(\.\.\.await\s+([a-zA-Z0-9_$]+)\(\2,"Project",([^)]+)\)\);let\s+([a-zA-Z0-9_$]+)=\3\(\4,"\.claude","CLAUDE\.md"\)'''
expected_matches = 1

replacement = '''$1let $2=$3($4,"CLAUDE.md");$5.push(...await $6($2,"Project",$7));let AGENTS_MD=$3($4,"AGENTS.md");$5.push(...await $6(AGENTS_MD,"Project",$7));let $8=$3($4,".claude","CLAUDE.md")'''

[[patches.tests]]
kind = "static"
name = "replacement is rendered"
assert_contains = '''"AGENTS.md"'''

[[patches]]
name = "agents-memory-file-detection"
target_version = "2.1.133"
applies_to = ">=2.1.133 <2.1.210"

rationale = """
Treat AGENTS.md as a memory file for cache and invalidation checks.

The memory-file detector recognizes CLAUDE.md, CLAUDE.local.md, and
.claude/rules markdown files. Once AGENTS.md is loaded as project memory, the
same detector must recognize it so memory file tracking and cache invalidation
observe edits. Cleanup condition: upstream supports AGENTS.md as an official
memory file or exposes a configurable project-memory filename list.
"""
rationale_ref = "reference/v2.1.88/sources/src/utils/claudemd.ts#L1432-L1448"

locator_kind = "regex"
locator_pattern = '''function ([a-zA-Z0-9_$]+)\(([a-zA-Z0-9_$]+)\)\{let ([a-zA-Z0-9_$]+)=([a-zA-Z0-9_.$]+)\.basename\(\2\);if\(\3==="CLAUDE\.md"\|\|\3==="CLAUDE\.local\.md"\)return!0;'''
expected_matches = 1

replacement = '''function $1($2){let $3=$4.basename($2);if($3==="CLAUDE.md"||$3==="CLAUDE.local.md"||$3==="AGENTS.md")return!0;'''

[[patches.tests]]
kind = "static"
name = "replacement is rendered"
assert_contains = '''==="AGENTS.md")return!0;'''

[[patches]]
name = "agents-memory-file-detection-2-1-210"
target_version = "2.1.210"
applies_to = ">=2.1.210 <2.1.212"

rationale = """
Treat AGENTS.md as a memory file for nested-memory propagation checks.

The v2.1.210 bundle replaces the standalone CLAUDE.md filename predicate with
a two-item filename allowlist at the propagation site. Add AGENTS.md to that
allowlist so loaded project memory continues to participate in cache and
invalidation propagation. Cleanup condition: upstream supports AGENTS.md as an
official memory file or exposes a configurable project-memory filename list.
"""
rationale_ref = "reference/v2.1.88/sources/src/utils/claudemd.ts#L1432-L1448"

locator_kind = "literal"
locator_pattern = '''["CLAUDE.md","CLAUDE.local.md"].includes(hre.basename(Jo))'''
expected_matches = 1

replacement = '''["CLAUDE.md","CLAUDE.local.md","AGENTS.md"].includes(hre.basename(Jo))'''

[[patches.tests]]
kind = "static"
name = "AGENTS.md participates in nested-memory propagation in 2.1.210"
assert_contains = '''["CLAUDE.md","CLAUDE.local.md","AGENTS.md"].includes(hre.basename(Jo))'''

[[patches.tests]]
kind = "static"
name = "2.1.210 allowlist no longer carries the stale two-file predicate"
assert_not_contains = '''["CLAUDE.md","CLAUDE.local.md"].includes(hre.basename(Jo))'''

