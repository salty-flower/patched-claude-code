    node = "ObjectExpression"
    object_property_direct = "hooksModule"
    strings = ["userConfig:", "import.meta.dir"]

    [patches.ast.captures.module]
    kind = "identifier"
    path = "arguments.1"
    select = { node = "CallExpression", source_regex = '^\w+\(import\.meta\.dir,' }

    [patches.ast.captures.scan]
    kind = "identifier"
    path = "arguments.2.body.callee"
    select = { node = "CallExpression", source_regex = '^\w+\(import\.meta\.dir,' }

  [patches.transform]
  op = "set_object_property"
  property = "hooksModule"
  value = '''{module:%%CAPTURE:module%%,scan:%%CAPTURE:scan%%().scan,files:{}}'''

  [[patches.tests]]
  kind = "static"
  name = "2.1.289 Darwin agents-md carries the current module and scan bindings"
  assert_contains = '''hooksModule:{module:I,scan:Le().scan,files:{}}'''

  [[patches.tests]]
  kind = "static"
  name = "2.1.289 Darwin agents-md rejects the 2.1.285 module binding"
  assert_not_contains = '''hooksModule:{module:S,scan:Le().scan,files:{}}'''

  [[patches.tests]]
  kind = "static"
  name = "2.1.289 Darwin agents-md no longer uses a disk folder descriptor"
  assert_not_contains = '''hooksModule:FU(import.meta.dir,I,()=>Le())'''

