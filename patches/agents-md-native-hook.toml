name = "agents-md-native-hook-host-path-2-1-290"
lineage = "agents-md-native-hook-host-path"
target_version = "2.1.290"
applies_to = ">=2.1.290 <2.1.291"
rationale = "Expose the built-in agents-md scan descriptor to the native host in both 2.1.290 disk graphs. Capture the current module namespace M and scan factory ke from the registration object that carries userConfig; preserve that registration and instructionFiles setting. The native hook registrar consumes the descriptor scan through registerScan/Ne.scan, so the upstream callback stays on the trusted runtime path without custom discovery or restricted-worker privilege changes. Remove when the disk runtime consumes this compiled descriptor directly."
rationale_ref = "reference/v2.1.88/sources/src/utils/plugins/loadPluginHooks.ts#L123-L148"
locator_kind = "ast_transform"
expected_matches = 1

