    [patches.ast.captures.scan]
    kind = "identifier"
    path = "arguments.2.body.callee"
    select = { node = "CallExpression", source_regex = '^\w+\(import\.meta\.dir,' }

  [patches.transform]
  op = "set_object_property"
  property = "hooksModule"
  value = '''{module:%%CAPTURE:module%%,scan:%%CAPTURE:scan%%().scan,files:{}}'''

  [[patches.tests]]
  kind = "static"
  name = "2.1.290 agents-md exposes its current module and scan to the native host"
  assert_contains = '''hooksModule:{module:M,scan:ke().scan,files:{}},userConfig:pe'''

  [[patches.tests]]
  kind = "static"
  name = "2.1.290 Darwin agents-md rejects its stale 2.1.289 module binding"
