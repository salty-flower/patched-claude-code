platforms = ["darwin-arm64"]
rationale = "Expose the built-in agents-md scan descriptor to the native host when the 2.1.289 Darwin graph runs from disk. Match the plugin registration that carries userConfig, capture the current module namespace and scan factory from that descriptor, and preserve its registration and instructionFiles setting. The 2.1.289 Darwin bindings are I and Le. The native loader registers the descriptor's scan metadata and consumes it through its built-in scan path; this keeps the callback in the trusted runtime and does not widen the restricted worker. Remove when the disk runtime consumes this compiled built-in descriptor directly."
rationale_ref = "reference/v2.1.88/sources/src/utils/plugins/loadPluginHooks.ts#L123-L148"
locator_kind = "ast_transform"
expected_matches = 1

  [patches.ast]
  schema = 1

