name = "agents-md-native-hook-native-host-path"
enabled = true
target_version = "2.1.281"
applies_to = ">=2.1.281 <2.1.282"

[[patches]]
name = "agents-md-native-hook-host-path-darwin"
platforms = ["darwin-arm64"]
rationale = """
Make the built-in agents-md plugin's prompt.context hook run in the main
session when the Darwin Bun graph runs from disk, so AGENTS.md follows the
instructionFiles setting. Carry only its compiled scan in the native hook
descriptor; preserve upstream's registerPlugin callback and hook body. Do not
force the global standalone branch, which would change other built-ins. This
is the 2.1.281 Darwin symbol variant: module namespace I, scan factory Le, and
descriptor helper Rq. Remove it when the disk graph routes agents-md through
the native host itself.
"""
rationale_ref = "reference/v2.1.88/sources/src/utils/plugins/loadPluginHooks.ts#L123-L148"
locator_kind = "literal"
locator_pattern = '''hooksModule:Rq(import.meta.dir,I,()=>Le())'''
replacement = '''hooksModule:{module:I,scan:Le().scan,files:{}}'''

[[patches.tests]]
kind = "static"
name = "Darwin agents-md exposes the compiled native hook scan"
assert_contains = '''hooksModule:{module:I,scan:Le().scan,files:{}}'''

[[patches.tests]]
kind = "static"
name = "Darwin agents-md no longer uses the disk graph folder descriptor"
assert_not_contains = '''hooksModule:Rq(import.meta.dir,I,()=>Le())'''

[[patches]]
name = "agents-md-native-hook-host-path-linux"
platforms = ["linux-x64"]
rationale = """
Make the built-in agents-md plugin's prompt.context hook run in the main
session when the Linux Bun graph runs from disk, so AGENTS.md follows the
instructionFiles setting. Carry only its compiled scan in the native hook
descriptor; preserve upstream's registerPlugin callback and hook body. Do not
force the global standalone branch, which would change other built-ins. This
is the 2.1.281 Linux symbol variant: module namespace S, scan factory Le, and
descriptor helper y4. Remove it when the disk graph routes agents-md through
the native host itself.
"""
rationale_ref = "reference/v2.1.88/sources/src/utils/plugins/loadPluginHooks.ts#L123-L148"
locator_kind = "literal"
locator_pattern = '''hooksModule:y4(import.meta.dir,S,()=>Le())'''
replacement = '''hooksModule:{module:S,scan:Le().scan,files:{}}'''

[[patches.tests]]
kind = "static"
name = "Linux agents-md exposes the compiled native hook scan"
assert_contains = '''hooksModule:{module:S,scan:Le().scan,files:{}}'''

[[patches.tests]]
kind = "static"
name = "Linux agents-md no longer uses the disk graph folder descriptor"
assert_not_contains = '''hooksModule:y4(import.meta.dir,S,()=>Le())'''

[[patches]]
name = "agents-md-native-hook-host-path-2-1-282"
lineage = "agents-md-native-hook-host-path"
target_version = "2.1.282"
applies_to = ">=2.1.282 <2.1.283"
rationale = "Expose the agents-md compiled hook scan to the native host when the 2.1.282 graph runs from disk. Capture the module namespace and scan factory from the existing descriptor in the plugin registration with userConfig; preserve the registration and instructionFiles settings. Remove when upstream uses the compiled native hook descriptor for disk graphs."
rationale_ref = "reference/v2.1.88/sources/src/utils/plugins/loadPluginHooks.ts#L123-L148"
locator_kind = "ast_transform"
expected_matches = 1

[patches.ast]
schema = 1
match = { node = "ObjectExpression", object_property_direct = "hooksModule", strings = ["userConfig:", "import.meta.dir"] }

[patches.ast.captures.module]
kind = "identifier"
select = { node = "CallExpression", source_regex = '^\w+\(import\.meta\.dir,' }
path = "arguments.1"

[patches.ast.captures.scan]
kind = "identifier"
select = { node = "CallExpression", source_regex = '^\w+\(import\.meta\.dir,' }
path = "arguments.2.body.callee"

[patches.transform]
op = "set_object_property"
property = "hooksModule"
value = '''{module:%%CAPTURE:module%%,scan:%%CAPTURE:scan%%().scan,files:{}}'''

[[patches.tests]]
kind = "static"
name = "2.1.282 agents-md uses a compiled native hook descriptor"
assert_contains = '''().scan,files:{}},userConfig:'''
