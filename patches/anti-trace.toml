rationale = "Require explicit assistant-response OTel opt-in in the 2.1.251 Linux module graph. The telemetry attribute namespace remains `a`; the gate is `d6n`, bound to the `OTEL_LOG_ASSISTANT_RESPONSES` / `OTEL_LOG_USER_PROMPTS` fallback function identified by those string literals."
rationale_ref = "reference/v2.1.88/sources/src/utils/telemetry/events.ts#L13-L19"
target_version = "2.1.251"
applies_to = ">=2.1.251 <2.1.258"
locator_kind = "literal"
locator_pattern = '''function d6n(){return a.OTEL_LOG_ASSISTANT_RESPONSES??a.OTEL_LOG_USER_PROMPTS}'''
replacement = '''function d6n(){return a.OTEL_LOG_ASSISTANT_RESPONSES===!0}'''

[[patches.tests]]
kind = "static"
assert_contains = '''function d6n(){return a.OTEL_LOG_ASSISTANT_RESPONSES===!0}'''

[[patches.tests]]
kind = "static"
assert_not_contains = '''function g5n(){return a.OTEL_LOG_ASSISTANT_RESPONSES===!0}'''

