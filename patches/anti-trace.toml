name = "anti-trace"
target_version = "2.1.197"
applies_to = ">=2.1.197 <2.1.198"

rationale = """
Disable hidden prompt fingerprinting and high-risk content tracing behaviors
introduced after the v2.1.88 audit baseline.
"""

[[patches]]
name = "disable-date-environment-fingerprint"
target_version = "2.1.197"
applies_to = ">=2.1.197 <2.1.198"

rationale = """
Short-circuit the v2.1.197 minified-symbol environment classifier `ddp`.

Upstream now derives quote variants and slash-form dates from timezone and
ANTHROPIC_BASE_URL host classification before inserting currentDate into the
system context. Patched bundles should restore the v2.1.88 behavior: the date
context is only the local ISO date string, with no hidden host or region marker.
Cleanup condition: upstream removes the hidden classifier or exposes a
documented, disabled-by-default diagnostic with visible user consent.
"""
rationale_ref = "reference/v2.1.88/sources/src/context.ts#L184-L187"

locator_kind = "literal"
locator_pattern = '''function ddp(){if(Crt())return null;let e=udp(),t=e0t(),n=t==="Asia/Shanghai"||t==="Asia/Urumqi";if(!e)return{known:!1,labKw:!1,cnTZ:n,host:null};return{known:ldp().some((r)=>e===r||e.endsWith("."+r)),labKw:cdp().some((r)=>e.includes(r)),cnTZ:n,host:e}}'''
expected_matches = 1

replacement = '''function ddp(){return null}'''

[[patches.tests]]
kind = "static"
name = "environment classifier is disabled"
assert_contains = '''function ddp(){return null}'''

[[patches.tests]]
kind = "static"
name = "region date marker is not rendered"
assert_not_contains = '''t==="Asia/Shanghai"||t==="Asia/Urumqi";if(!e)return{known:!1,labKw:!1,cnTZ:n,host:null}'''

[[patches]]
name = "require-explicit-assistant-response-otel"
target_version = "2.1.197"
applies_to = ">=2.1.197 <2.1.198"

rationale = """
Replace the v2.1.197 minified-symbol assistant-response OTel gate `TXi`.

Assistant response logging was added after the v2.1.88 audit baseline and now
falls back to OTEL_LOG_USER_PROMPTS when OTEL_LOG_ASSISTANT_RESPONSES is unset.
Patched bundles should require an explicit assistant-response opt-in instead of
silently broadening an existing prompt-logging deployment. Cleanup condition:
upstream makes assistant-response logging independent from user-prompt logging
by default.
"""
rationale_ref = "reference/v2.1.88/sources/src/utils/telemetry/events.ts#L13-L19"

locator_kind = "literal"
locator_pattern = '''function TXi(){return Ne.OTEL_LOG_ASSISTANT_RESPONSES??Ne.OTEL_LOG_USER_PROMPTS}'''
expected_matches = 1

replacement = '''function TXi(){return Ne.OTEL_LOG_ASSISTANT_RESPONSES===!0}'''

[[patches.tests]]
kind = "static"
name = "assistant response logging requires explicit opt-in"
assert_contains = '''function TXi(){return Ne.OTEL_LOG_ASSISTANT_RESPONSES===!0}'''

[[patches.tests]]
kind = "static"
name = "assistant response logging no longer inherits prompt logging"
assert_not_contains = '''function TXi(){return Ne.OTEL_LOG_ASSISTANT_RESPONSES??Ne.OTEL_LOG_USER_PROMPTS}'''

[[patches]]
name = "disable-raw-api-body-otel"
target_version = "2.1.197"
applies_to = ">=2.1.197 <2.1.198"

