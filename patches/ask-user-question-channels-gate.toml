name = "ask-user-question-channels-gate"
target_version = "2.1.112"
applies_to = ">=2.1.112 <2.2.0"

rationale = """
Re-enable AskUserQuestion / EnterPlanMode / ExitPlanMode when --channels is
populated.

In v2.1.88 the gate read `(feature('KAIROS') || feature('KAIROS_CHANNELS'))
&& getAllowedChannels().length > 0` (see rationale_ref). Bun's bundler
inlines feature() macros at build time, leaving only the channel-length
check in production. By 2.1.112 the gate body is identical modulo
identifier renaming and is shared across the three multiple-choice tools.

The harness in this house always launches Claude Code with `--channels
plugin:telegram@claude-plugins-official` (telegram dev channel notification
relay), which would silently strip these tools from every session. We
prefer keeping the tools available — the channel relay handles permission
prompts elsewhere.

The patch flips the gate to unconditional return-true. Cleanup condition:
upstream allows opting out of the gate per-tool, or removes the gate.
"""
rationale_ref = "reference/v2.1.88/sources/src/tools/AskUserQuestionTool/AskUserQuestionTool.tsx#L135-L146"

locator_pattern = '''isEnabled\(\)\{if\(\w+\(\)\.length>0\)return!1;return!0\}'''
locator_kind = "regex"
expected_matches = 3

replacement = "isEnabled(){return!0}"
