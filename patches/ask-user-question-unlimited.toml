name = "ask-user-question-unlimited"
enabled = true
target_version = "2.1.260"
applies_to = ">=2.1.260 <2.2.0"

[[patches]]
name = "ask-user-question-remove-standard-question-cap"
rationale = """
Allow a standard AskUserQuestion call to carry every related question in one interaction. The upstream four-question ceiling forces artificial follow-up rounds even when the user requested a larger coherent questionnaire; keep the one-question minimum and the separate per-question option bound. Remove this patch when upstream no longer imposes a fixed question-array maximum.
"""
rationale_ref = "reference/v2.1.88/sources/src/tools/AskUserQuestionTool/AskUserQuestionTool.tsx#L62-L67"
locator_kind = "ast_transform"

[patches.ast]
schema = 1
match = { node = "CallExpression", callee_property = "describe", strings = ["Questions to ask the user (1-4 questions). The 1-4 questions and 2-4 options bounds are hard schema constraints; do not exceed them even if the user requests more", "Questions to ask the user (1-4 questions)"] }

[patches.transform]
op = "replace_substring"
find = '''.min(1).max(4)'''
value = '''.min(1)'''

[[patches.tests]]
kind = "static"
name = "standard question array has no fixed maximum"
assert_not_contains = '''.min(1).max(4).describe("Questions to ask the user (one or more; no fixed maximum).'''

[[patches]]
name = "ask-user-question-remove-extended-question-cap"
rationale = """
Apply the same unbounded question-array contract to the extended AskUserQuestion schema used by hosts with richer question rendering. Keeping this sibling capped would make behavior depend on the active host format. Remove this patch when upstream removes the extended schema's fixed maximum.
"""
rationale_ref = "reference/v2.1.88/sources/src/tools/AskUserQuestionTool/AskUserQuestionTool.tsx#L62-L67"
locator_kind = "ast_transform"

[patches.ast]
schema = 1
match = { node = "CallExpression", callee_property = "describe", string = "Questions to ask the user (1-4, most important first). The 1-4 questions and 2-4 options bounds are hard schema constraints; do not exceed them even if the user requests more" }

[patches.transform]
op = "replace_substring"
find = '''.min(1).max(4)'''
value = '''.min(1)'''

[[patches.tests]]
kind = "static"
name = "extended question array has no fixed maximum"
assert_not_contains = '''.min(1).max(4).describe("Questions to ask the user (one or more; no fixed maximum, most important first).'''

[[patches]]
name = "ask-user-question-standard-host-description"
rationale = """
Describe the standard host-aware schema without the retired four-question limit while preserving its 2-4 options contract. This prevents the generated tool schema from teaching the model to split coherent questionnaires. Remove this patch when upstream advertises the unbounded question contract.
"""
rationale_ref = "reference/v2.1.88/sources/src/tools/AskUserQuestionTool/AskUserQuestionTool.tsx#L62-L67"
locator_kind = "ast_transform"

[patches.ast]
schema = 1
match = { node = "StringLiteral", string_literal = "Questions to ask the user (1-4 questions). The 1-4 questions and 2-4 options bounds are hard schema constraints; do not exceed them even if the user requests more — split into multiple calls instead." }

[patches.transform]
op = "replace_node"
value = '''"Questions to ask the user (one or more; no fixed maximum). Group related questions in one call when that is easier to answer. Each choice question still accepts 2-4 options."'''

[[patches.tests]]
kind = "static"
name = "standard host description advertises unbounded batching"
assert_contains = '''Questions to ask the user (one or more; no fixed maximum). Group related questions in one call when that is easier to answer. Each choice question still accepts 2-4 options.'''

[[patches]]
name = "ask-user-question-standard-sdk-description"
rationale = """
Give SDK consumers the same unbounded question contract as the host-aware schema. Leaving the fallback description at 1-4 would preserve a model-visible limit for consumers without the richer host format. Remove this patch when upstream's fallback schema has no fixed question maximum.
"""
rationale_ref = "reference/v2.1.88/sources/src/tools/AskUserQuestionTool/AskUserQuestionTool.tsx#L62-L67"
locator_kind = "ast_transform"

[patches.ast]
schema = 1
match = { node = "StringLiteral", source = '''"Questions to ask the user (1-4 questions)"''' }

[patches.transform]
op = "replace_node"
value = '''"Questions to ask the user (one or more; no fixed maximum). Group related questions in one call when that is easier to answer."'''

[[patches.tests]]
kind = "static"
name = "standard SDK description advertises unbounded batching"
assert_contains = '''Questions to ask the user (one or more; no fixed maximum). Group related questions in one call when that is easier to answer.'''

[[patches]]
name = "ask-user-question-extended-description"
rationale = """
Update the extended input schema's model-visible description to match its unbounded runtime question array. The ordering guidance remains, but the prompt no longer instructs the model to split after four questions. Remove this patch when upstream documents the same contract.
"""
rationale_ref = "reference/v2.1.88/sources/src/tools/AskUserQuestionTool/AskUserQuestionTool.tsx#L62-L67"
locator_kind = "ast_transform"

[patches.ast]
schema = 1
match = { node = "StringLiteral", string_literal = "Questions to ask the user (1-4, most important first). The 1-4 questions and 2-4 options bounds are hard schema constraints; do not exceed them even if the user requests more — split into multiple calls instead." }

[patches.transform]
op = "replace_node"
value = '''"Questions to ask the user (one or more; no fixed maximum, most important first). Group related questions in one call when that is easier to answer. Each choice question still accepts 2-4 options."'''

[[patches.tests]]
kind = "static"
name = "extended description advertises unbounded batching"
assert_contains = '''Questions to ask the user (one or more; no fixed maximum, most important first). Group related questions in one call when that is easier to answer. Each choice question still accepts 2-4 options.'''

[[patches]]
name = "ask-user-question-tool-description"
rationale = """
Make the top-level tool description state that one call may contain an unbounded question set. Schema details alone are not always surfaced prominently by tool consumers, so the concise description must carry the same contract. Remove this patch when upstream's tool description does so.
"""
rationale_ref = "reference/v2.1.88/sources/src/tools/AskUserQuestionTool/prompt.ts#L7-L8"
locator_kind = "ast_transform"

[patches.ast]
schema = 1
match = { node = "StringLiteral", source = '''"Asks the user multiple choice questions to gather information, clarify ambiguity, understand preferences, make decisions or offer them choices."''' }

[patches.transform]
op = "replace_node"
value = '''"Asks the user one or more questions in a single interaction to resolve decisions, requirements, or preferences. A call has no fixed question-count maximum."'''

[[patches.tests]]
kind = "static"
name = "tool description states the unbounded contract"
assert_contains = '''A call has no fixed question-count maximum.'''

[[patches]]
name = "ask-user-question-tool-prompt"
rationale = """
Tell the model to batch a coherent set of questions instead of manufacturing follow-up calls at four. This aligns generation behavior with the relaxed runtime schema while still letting the model ask follow-ups when answers create new questions. Remove this patch when upstream prompt guidance has no fixed question cap.
"""
rationale_ref = "reference/v2.1.88/sources/src/tools/AskUserQuestionTool/prompt.ts#L32-L44"
locator_kind = "ast_transform"

[patches.ast]
schema = 1
match = { node = "TemplateLiteral", string = "Use this tool only when you are blocked on a decision that is genuinely the user's to make" }

[patches.transform]
op = "wrap_expression"
template = '''%%EXPR%%+`\nQuestion batching:\n- A call may contain one or more questions with no fixed maximum.\n- Batch related questions into one call when they form a coherent set for the user.\n`'''

[[patches.tests]]
kind = "static"
name = "tool prompt encourages coherent unbounded batching"
assert_contains = '''Question batching:\n- A call may contain one or more questions with no fixed maximum.'''
