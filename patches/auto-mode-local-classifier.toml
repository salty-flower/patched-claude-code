[[patches]]
name = "deny-when-local-fallback-has-no-verdict"
rationale = """
Refuse a tool call when neither classifier returns a verdict.
In 2.1.325, Gi records the fallback source, Ma is the queued result, and zce or Ice marks no result.
Reject a missing fallback result before upstream can offer manual approval or deliver a flagged call.
"""
rationale_ref = "reference/v2.1.88/sources/src/utils/permissions/permissions.ts#L843-L868"
locator_kind = "regex"
locator_pattern = '''(?=if\(Ma===(?:zce|Ice)&&Fo\)return\{behavior:"deny")'''
replacement = '''if(Gi==="missing_server_verdict"&&Ma?.unavailable===!0)return{behavior:"deny",message:e.name+" was not run because auto mode's local classifier gave no verdict.",decisionReason:{type:"classifier",classifier:"auto-mode",reason:"Classifier unavailable",noVerdict:!0}};'''

[[patches.tests]]
kind = "static"
name = "deny-when-local-fallback-has-no-verdict is rendered"
assert_contains = '''Gi==="missing_server_verdict"&&Ma?.unavailable===!0'''
