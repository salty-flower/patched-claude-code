name = "auto-mode-local-classifier"
target_version = "2.1.325"
applies_to = ">=2.1.325 <2.1.326"

rationale = """
Review auto-mode tool calls with the built-in local classifier when the
server response has no verdict for the call.
Use the explicitly missing and unsupported verdict states so the decision
does not depend on whether a proxy preserves the requested model ID.
A server verdict still takes precedence, and the next response can use
the server classifier even after a proxied response carried no verdict.

The v2.1.88 baseline predates server-side review.
Its local classification and failure handling anchor the intent.
The server resolver, rollout gate, and session latch were audited in the
2.1.325 Linux and Darwin permission-gate chunks.
Remove this patch when upstream provides a per-call, fail-closed fallback.
"""

[[patches]]
name = "keep-server-review-after-missing-response"
rationale = """
Keep the next request eligible for server review when the response explicitly reports no classifier support or result.
In 2.1.325, eo is the settled response-level result used by the third-party provider latch.
"""
rationale_ref = "reference/v2.1.88/sources/src/utils/permissions/permissions.ts#L688-L704"
locator_kind = "regex"
locator_pattern = '''(?=(?:d6e|mqe)\(\)==="thirdParty"&&(?:Cjt|H2t)\(eo\)&&!(?:OG|D6)\(\)&&!(?:Fxo|uPo)\(\)\)(?:O8t|B9t)\(\),l\("tengu_server_classifier_no_result_latched")'''
replacement = '''!["server_no_result","server_unsupported","server_thread_unsupported"].includes(eo.why)&&'''

[[patches.tests]]
kind = "static"
name = "keep-server-review-after-missing-response is rendered"
assert_contains = '''!["server_no_result","server_unsupported","server_thread_unsupported"].includes(eo.why)&&'''

[[patches]]
name = "keep-server-review-after-missing-call"
rationale = """
Keep the next request eligible for server review when the permission gate observes a missing verdict.
In 2.1.325, pu is the settled result in the arbiter fallback predicate.
"""
rationale_ref = "reference/v2.1.88/sources/src/utils/permissions/permissions.ts#L688-L704"
locator_kind = "regex"
locator_pattern = '''(?=(?:hf|gf)&&Ur==="arbiter"&&!(?:kr|vr)&&!(?:Ni|Mi)&&!i\.CLAUDE_CODE_USER_DELEGATED_SESSION_DIRECT_API&&!(?:OG|D6)\(\)\)(?:O8t|B9t)\(\),l\("tengu_server_classifier_no_result_latched")'''
replacement = '''!["server_no_result","server_unsupported","server_thread_unsupported"].includes(pu.why)&&'''

[[patches.tests]]
kind = "static"
name = "keep-server-review-after-missing-call is rendered"
assert_contains = '''!["server_no_result","server_unsupported","server_thread_unsupported"].includes(pu.why)&&'''

[[patches]]
name = "mark-local-classifier-fallback"
rationale = """
Pass the missing-verdict reason from the queued tool check into its existing local classifier invocation.
In 2.1.325, Gi is the gate's per-call local classifier reason.
"""
rationale_ref = "reference/v2.1.88/sources/src/utils/permissions/permissions.ts#L688-L704"
locator_kind = "literal"
locator_pattern = '''localClassifierSite:"gate"'''
replacement = '''localClassifierSite:"gate",pccMissingServerVerdict:Gi==="missing_server_verdict"'''

[[patches.tests]]
kind = "static"
name = "mark-local-classifier-fallback is rendered"
assert_contains = '''localClassifierSite:"gate",pccMissingServerVerdict:Gi==="missing_server_verdict"'''

[[patches]]
name = "permit-local-classifier-for-missing-verdict"
rationale = """
Make the built-in local classifier available for the explicitly marked auto-mode call.
In 2.1.325, y holds invocation-specific classifier options.
"""
rationale_ref = "reference/v2.1.88/sources/src/utils/permissions/permissions.ts#L688-L704"
locator_kind = "regex"
locator_pattern = '''(?=(?:ert|crt)\(\{handoffReview:H==="handoff"\|\|y\.judgesHandback===!0,outsideAutoMode:y\.outsideAutoMode===!0\}\))'''
replacement = '''!y.pccMissingServerVerdict&&'''

[[patches.tests]]
kind = "static"
name = "permit-local-classifier-for-missing-verdict is rendered"
assert_contains = '''!y.pccMissingServerVerdict&&'''

[[patches]]
name = "queue-missing-verdict-fallback-linux-x64"
lineage = "queue-missing-verdict-fallback"
platforms = ["linux-x64"]
rationale = """
Run the local classifier in the existing tool-review queue for normal auto-mode calls with a missing server verdict.
In 2.1.325, ei marks an active server role, Xe is the permission context,
dr marks withheld context, An marks a manual approval path, vs marks flagged handback,
and QB detects delegated sessions.
Use to and vhe to read the settled verdict and ep to classify the same call locally.
eYn validates a real local verdict, zce marks no result, and Kyt marks interruption.
The existing queue callback (_i?Ym:Df) processes every other case.
"""
rationale_ref = "reference/v2.1.88/sources/src/utils/permissions/permissions.ts#L688-L704"
locator_kind = "literal"
locator_pattern = '''_i?Ym:Df'''
replacement = '''async(progress)=>{
if(ei&&Xe.mode==="auto"&&!dr&&!An&&!vs&&!QB()&&!i.CLAUDE_CODE_USER_DELEGATED_SESSION_DIRECT_API){
  const reason=vhe(await to(),h);
  if(["server_no_result","server_unsupported","server_thread_unsupported"].includes(reason)){
    Gi="missing_server_verdict";
    t("[server-classifier] "+e.name+": checking locally after "+reason);
    try{
      if(H.abortController.signal.aborted)return Kyt;
      const result=await ep(progress);
      if(H.abortController.signal.aborted)return Kyt;
      if(result&&typeof result.shouldBlock==="boolean"&&eYn(result))return result;
    }catch{
      if(H.abortController.signal.aborted)return Kyt;
      t("[server-classifier] "+e.name+": local classifier failed during fallback",{level:"warn"});
    }
    return zce;
  }
}
return (_i?Ym:Df)(progress);
}'''

[[patches.tests]]
kind = "static"
name = "queue-missing-verdict-fallback-linux-x64 is rendered"
assert_contains = '''const reason=vhe(await to(),h)'''

