name = "channel-access"
target_version = "2.1.133"
applies_to = ">=2.1.133 <2.2.0"

rationale = """
Group the channel feature/provider gates and the interactive ask-user-question gate used by channel sessions.
"""
[[patches]]
name = "ask-user-question-channels-gate"
target_version = "2.1.133"
applies_to = ">=2.1.112 <2.2.0"

rationale = """
Re-enable AskUserQuestion / EnterPlanMode / ExitPlanMode when --channels is
populated.

In v2.1.88 the gate read `(feature('KAIROS') || feature('KAIROS_CHANNELS'))
&& getAllowedChannels().length > 0` (see rationale_ref). Bun's bundler
inlines feature() macros at build time, leaving only the channel-length
check in production. By 2.1.112 the gate body is identical modulo
identifier renaming and is shared across the three multiple-choice tools. By
2.1.132 upstream added a second runtime predicate to the same channel-length
check; the same three tool definitions still share the gate.

The harness in this house always launches Claude Code with `--channels
plugin:telegram@claude-plugins-official` (telegram dev channel notification
relay), which would silently strip these tools from every session. We
prefer keeping the tools available — the channel relay handles permission
prompts elsewhere.

The patch flips the gate to unconditional return-true. Cleanup condition:
upstream allows opting out of the gate per-tool, or removes the gate.
"""
rationale_ref = "reference/v2.1.88/sources/src/tools/AskUserQuestionTool/AskUserQuestionTool.tsx#L135-L146"

locator_kind = "ast_transform"
expected_matches = 3

[patches.ast]
schema = 1
match = { node = "ObjectMethod", method_name = "isEnabled", string = "return!1;return!0" }

[patches.transform]
op = "replace_function_body"
body = "{return!0}"

[[patches.tests]]
kind = "static"
name = "replacement is rendered"
assert_contains = '''isEnabled(){return!0}'''

[[patches]]
name = "channels-feature-gate"
target_version = "2.1.133"
applies_to = ">=2.1.133 <2.2.0"

rationale = """
Enable the runtime channels feature gate for patched bundles.

The channel server gate first checks MCP capability, then the global
channels feature flag before session, policy, and allowlist checks. Local
development channels already require explicit CLI opt-in; leaving this
remote feature flag in place makes --channels and
--dangerously-load-development-channels no-ops for non-enabled accounts.

The patch changes only the global runtime flag to true. Cleanup condition:
upstream exposes a local development path that is not account/feature-flag
gated.
"""
rationale_ref = "reference/v2.1.88/sources/src/services/mcp/channelAllowlist.ts#L46-L53"

locator_kind = "ast_transform"

[patches.ast]
schema = 1
match = { node = "FunctionDeclaration", string_literal = "tengu_harbor", body_statement_count = 1 }

[patches.transform]
op = "replace_function_body"
body = "{return!0}"

[[patches.tests]]
kind = "static"
name = "replacement is rendered"
assert_contains = '''return!0}'''

[[patches]]
name = "channels-provider-gate"
target_version = "2.1.133"
applies_to = ">=2.1.133 <2.2.0"

rationale = """
Allow explicitly requested channels to register when the active provider is
not first-party.

v2.1.132 added a provider gate ahead of the existing channels feature,
policy, session, and allowlist gates. That blocks local development channel
testing even when the user supplied --channels or
--dangerously-load-development-channels. The patch removes only the provider
short-circuit; channel capability, managed-org policy, session opt-in, and
dev/allowlist checks still run.

Cleanup condition: upstream makes provider gating conditional on production
marketplace channels rather than all channel registration.
"""
rationale_ref = "reference/v2.1.88/sources/src/services/mcp/channelNotification.ts#L220-L228"

locator_kind = "ast_transform"

[patches.ast]
schema = 1
match = { node = "IfStatement", string_literal = "channels are not available on third-party providers" }

[patches.transform]
op = "replace_node"
value = '''if(!1)return{action:"skip",kind:"provider",reason:"channels are not available on third-party providers"};'''

[[patches.tests]]
kind = "static"
name = "replacement is rendered"
assert_contains = '''if(!1)return{action:"skip",kind:"provider",reason:"channels are not available on third-party providers"};'''
