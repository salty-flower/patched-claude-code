Enable the runtime channels feature gate for patched bundles.

The channel server gate first checks MCP capability, then the global
channels feature flag before session, policy, and allowlist checks. Local
development channels already require explicit CLI opt-in; leaving this
remote feature flag in place makes --channels and
--dangerously-load-development-channels no-ops for non-enabled accounts.

The patch changes only the global runtime flag to true. Cleanup condition:
upstream exposes a local development path that is not account/feature-flag
gated.
