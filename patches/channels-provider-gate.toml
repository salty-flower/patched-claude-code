name = "channels-provider-gate"
target_version = "2.1.132"
applies_to = ">=2.1.132 <2.2.0"

rationale = """
Allow explicitly requested channels to register when the active provider is
not first-party.

v2.1.132 added a provider gate ahead of the existing channels feature,
policy, session, and allowlist gates. That blocks local development channel
testing even when the user supplied --channels or
--dangerously-load-development-channels. The patch removes only the provider
short-circuit; channel capability, managed-org policy, session opt-in, and
dev/allowlist checks still run.

Cleanup condition: upstream makes provider gating conditional on production
marketplace channels rather than all channel registration.
"""
rationale_ref = "reference/v2.1.88/sources/src/services/mcp/channelNotification.ts#L220-L228"

locator_pattern = '''if\(gq\(\)!=="firstParty"\)return\{action:"skip",kind:"provider",reason:"channels are not available on third-party providers"\};'''
locator_kind = "regex"
expected_matches = 1

replacement = '''if(!1)return{action:"skip",kind:"provider",reason:"channels are not available on third-party providers"};'''
