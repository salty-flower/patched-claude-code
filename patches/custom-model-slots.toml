name = "custom-model-slots"
target_version = "2.1.234"
applies_to = ">=2.1.234 <2.2.0"

rationale = """
Add a second environment-configured custom model option and model-local effort
levels for both custom slots.

The upstream picker exposes one ANTHROPIC_CUSTOM_MODEL_OPTION row. This patch
adds an independent ANTHROPIC_CUSTOM_MODEL_OPTION_2 row, recognizes it as a
preconfigured model, and accepts an optional capability list.

ANTHROPIC_CUSTOM_MODEL_OPTION_EFFORT_LEVEL and
ANTHROPIC_CUSTOM_MODEL_OPTION_2_EFFORT_LEVEL are resolved by model at request
time and do not write userSettings.effortLevel or AppState.effortValue.
Switching slots or switching back to a built-in model therefore restores that
model's local effort or the existing global effort automatically. Valid local
effort values are low, medium, high, xhigh, and max.
"""

