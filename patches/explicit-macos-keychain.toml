name = "explicit-macos-keychain"
enabled = true
target_version = "2.1.220"
applies_to = ">=2.1.220 <2.1.221"

[[patches]]
name = "explicit-macos-keychain-storage-bridge-2-1-220"
rationale = """
Route the complete macOS credential-storage abstraction through a versioned
repo-owned bridge. The bridge is a no-op when CLAUDE_CODE_KEYCHAIN_PATH is
unset; when set, it replaces the combined Keychain/plaintext store with one
fail-closed explicit-Keychain store, covering reads, mutations, writes, and
deletes without copying credentials or falling back to default storage.

Plugin-eval children use a separate internal materialization marker. Those
children have no preload bridge, so the storage factory selects only the
temporary plaintext store populated by the parent instead of attempting any
Keychain access. Public explicit selection always takes precedence if both
variables are present.

The bridge receives upstream's generic `ixt` mutation coordinator so explicit
storage retains the same `.storage-write` cross-process lock as the original
Keychain implementation.

This 2.1.220 variant carries the storage factory symbols `bFc`, `Q5i`, and
`XJn`, mutation helper `ixt`, service-name symbols `oG` and `j1e`, and account
helper `_q`.
Remove it when upstream accepts an explicit Keychain path at the secure-storage
factory boundary.
"""
rationale_ref = "reference/v2.1.88/sources/src/utils/secureStorage/index.ts#L1-L17"
locator_kind = "ast_transform"

[patches.ast]
schema = 1
match = { node = "CallExpression", source = "bFc(Q5i,XJn)", parent_node = "ReturnStatement" }

[patches.transform]
op = "wrap_expression"
template = '''((e,t)=>{if(process.env.CLAUDE_CODE_KEYCHAIN_PATH!==void 0){let r=globalThis[Symbol.for("patched-claude-code.macos-keychain.v1")];if(!r)throw Error("CLAUDE_CODE_KEYCHAIN_PATH requires the packaged claude-patched launcher; refusing to use the default Keychain without its preload bridge.");return r.secureStorage({defaultStorage:e,serviceName:oG(j1e),accountName:_q(),mutateWithLock:(e,t)=>ixt(e,t)})}if(process.env.PATCHED_CLAUDE_CODE_MATERIALIZED_CREDENTIALS==="1")return t;return e})(%%EXPR%%,XJn)'''

[[patches.tests]]
kind = "static"
name = "macOS storage factory crosses the explicit-Keychain bridge"
assert_contains = '''Symbol.for("patched-claude-code.macos-keychain.v1")'''

[[patches.tests]]
kind = "static"
name = "unpreloaded bundles retain the existing storage factory"
assert_contains = '''return e})(bFc(Q5i,XJn),XJn)'''

[[patches.tests]]
kind = "static"
name = "raw bundles fail closed when explicit selection lacks its preload bridge"
assert_contains = '''if(!r)throw Error("CLAUDE_CODE_KEYCHAIN_PATH requires the packaged claude-patched launcher; refusing to use the default Keychain without its preload bridge.")'''

[[patches.tests]]
kind = "static"
name = "public selection precedes plugin eval materialized plaintext credentials"
assert_contains = '''if(process.env.CLAUDE_CODE_KEYCHAIN_PATH!==void 0){let r=globalThis[Symbol.for("patched-claude-code.macos-keychain.v1")];if(!r)throw Error'''

[[patches]]
