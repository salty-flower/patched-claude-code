[[patches]]
name = "explicit-macos-keychain-disable-default-prefetch-2-1-220"
rationale = """
Skip the early default-Keychain prefetch when an explicit Keychain was
requested. The explicit store performs its own targeted reads, so allowing
startup prefetch to query the login Keychain would violate process isolation
and could prime an unrelated credential cache before the storage bridge runs.
Materialized plugin-eval children also skip prefetch because their temporary
plaintext store is their only credential source.

This 2.1.220 variant names the platform-split prefetch entrypoint
`__acc_darwin_rqi`. Remove it with the storage bridge when upstream makes the
prefetch consume the explicit secure-storage target.
"""
rationale_ref = "reference/v2.1.88/sources/src/utils/secureStorage/keychainPrefetch.ts#L60-L91"
locator_kind = "ast_transform"

[patches.ast]
schema = 1
match = { node = "FunctionDeclaration", function_name = "__acc_darwin_rqi", string = "Promise.all" }

[patches.transform]
op = "prepend_function_body"
code = '''if(process.env.CLAUDE_CODE_KEYCHAIN_PATH!==void 0||process.env.PATCHED_CLAUDE_CODE_MATERIALIZED_CREDENTIALS==="1")return;'''

