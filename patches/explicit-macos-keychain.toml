rationale = """
Fail before CLI command handlers can catch credential lookup errors when an
explicit Keychain was requested without the packaged preload bridge. This
makes raw rendered bundles fail closed instead of degrading to an unauthenticated
or default-Keychain result.

This 2.1.220 variant names top-level CLI entrypoint call `sTT`.
"""
rationale_ref = "reference/v2.1.88/sources/src/entrypoints/cli.tsx#L298-L302"
locator_kind = "ast_transform"

[patches.ast]
