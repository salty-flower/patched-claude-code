[[patches]]
name = "explicit-macos-keychain-storage-bridge-2-1-221"
target_version = "2.1.221"
applies_to = ">=2.1.221 <2.1.227"
rationale = """
Route the complete macOS credential-storage abstraction through a versioned
repo-owned bridge. The bridge is a no-op when CLAUDE_CODE_KEYCHAIN_PATH is
unset; when set, it replaces the combined Keychain/plaintext store with one
fail-closed explicit-Keychain store, covering reads, mutations, writes, and
deletes without copying credentials or falling back to default storage.

Plugin-eval children use a separate internal materialization marker. Those
children have no preload bridge, so the storage factory selects only the
temporary plaintext store populated by the parent instead of attempting any
Keychain access. Public explicit selection always takes precedence if both
variables are present.

The bridge receives upstream's generic `YHt` mutation coordinator so explicit
storage retains the same `.storage-write` cross-process lock as the original
Keychain implementation.

This is the 2.1.221 minified-symbol variant. The storage factory call is now
