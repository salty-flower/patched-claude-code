name = "fable-model-picker"
target_version = "2.1.197"
applies_to = ">=2.1.197 <2.1.198"

rationale = """
Expose Fable 5 in the interactive model picker when the v2.1.197 local model
catalog knows the model.

v2.1.197 includes the Fable 5 catalog entry and `fable` alias, but official
first-party menu construction still waits for bootstrap-provided model options
or the AWS-specific path before showing a row. Patched bundles show the local
Fable row across first-party and gateway-like catalog-backed paths while leaving
request-time entitlement, usage-credit consent, disabled-model hints, and server
errors unchanged. Cleanup condition: upstream shows Fable in the picker whenever
the bundled catalog and provider mapping expose it.
"""

[[patches]]
name = "oauth-primary-picker-shows-local-fable"
target_version = "2.1.197"
applies_to = ">=2.1.197 <2.1.198"
rationale = """
Insert the catalog-backed Fable row into the primary Claude.ai OAuth picker.

The v2.1.197 OAuth menu branch adds default, high-end, Sonnet, and Haiku rows
but skips the Fable catalog entry unless the server bootstrap later contributes
an additional model option. This 2.1.197 minified-symbol variant calls the
existing Fable-row inserter when `Xre("fable5")` says the active provider has a
catalog mapping. Cleanup condition: upstream includes Fable in this branch.
"""
rationale_ref = "reference/v2.1.88/sources/src/components/ModelPicker.tsx#L68-L76"
locator_kind = "ast_transform"

[patches.ast]
schema = 1
match = { node = "FunctionDeclaration", function_name = "Amp", strings = ['''return a.push(ada),Blo(a,e)''', '''Xre("fable5")'''] }

[patches.transform]
op = "replace_substring"
find = '''return a.push(ada),Blo(a,e)'''
value = '''if(Xre("fable5"))Jut(a,Ulo());return a.push(ada),Blo(a,e)'''

[[patches.tests]]
kind = "static"
name = "oauth primary picker inserts local fable before haiku"
assert_contains = '''if(Xre("fable5"))Jut(a,Ulo());return a.push(ada),Blo(a,e)'''

[[patches]]
name = "oauth-standard-picker-shows-local-fable"
target_version = "2.1.197"
applies_to = ">=2.1.197 <2.1.198"
rationale = """
Insert the catalog-backed Fable row into the standard Claude.ai OAuth picker.

The v2.1.197 standard OAuth menu branch similarly omits Fable unless bootstrap
adds it as an additional model option. This 2.1.197 minified-symbol variant
reuses the existing Fable-row insertion helper and only widens local menu
visibility. Cleanup condition: upstream includes Fable in this branch.
"""
rationale_ref = "reference/v2.1.88/sources/src/components/ModelPicker.tsx#L68-L76"
locator_kind = "ast_transform"

[patches.ast]
schema = 1
match = { node = "FunctionDeclaration", function_name = "Amp", strings = ['''return i.push(ada),Blo(i,e)''', '''Xre("fable5")'''] }

[patches.transform]
op = "replace_substring"
find = '''return i.push(ada),Blo(i,e)'''
value = '''if(Xre("fable5"))Jut(i,Ulo());return i.push(ada),Blo(i,e)'''

[[patches.tests]]
kind = "static"
name = "oauth standard picker inserts local fable before haiku"
assert_contains = '''if(Xre("fable5"))Jut(i,Ulo());return i.push(ada),Blo(i,e)'''

[[patches]]
name = "api-key-picker-shows-local-fable"
target_version = "2.1.197"
applies_to = ">=2.1.197 <2.1.198"
rationale = """
Show the catalog-backed Fable row for non-OAuth first-party API-key sessions.

The v2.1.197 API-key menu branch already has a Fable-row path, but the gate is
restricted to `anthropicAws`. Since the same branch only runs for catalog-backed
providers and `Xre("fable5")` checks the active provider mapping, the narrower
provider-name check hides an otherwise valid local menu row. Cleanup condition:
upstream removes the AWS-only picker special case or replaces it with a shared
Fable availability predicate.
"""
rationale_ref = "reference/v2.1.88/sources/src/components/ModelPicker.tsx#L68-L76"
locator_kind = "ast_transform"

[patches.ast]
schema = 1
match = { node = "FunctionDeclaration", function_name = "Amp", string = '''_r()==="anthropicAws"&&Xre("fable5")''' }

[patches.transform]
op = "replace_substring"
find = '''_r()==="anthropicAws"&&Xre("fable5")'''
value = '''Xre("fable5")'''

[[patches.tests]]
kind = "static"
name = "api-key picker fable gate uses catalog mapping"
assert_contains = '''else if(Xre("fable5"))Jut(i,Ulo())'''

[[patches.tests]]
kind = "static"
name = "api-key picker no longer restricts fable to anthropic aws"
assert_not_contains = '''_r()==="anthropicAws"&&Xre("fable5")'''
