name = "file-read-path-context"
target_version = "2.1.133"
applies_to = ">=2.1.133 <2.2.0"

rationale = """
Group the FileRead result render patches that preserve path context across every result variant.
"""
[[patches]]
name = "read-result-path-context"
target_version = "2.1.133"
applies_to = ">=2.1.133 <2.2.0"

rationale = """
Make the Read tool result renderer aware of the input path.

The tool-use summary shows which file is being read, but the result summary
only says how many lines, pages, or cells were read. Patched bundles add a
compact path suffix derived from the render input so result rows remain useful
in dense transcripts. Cleanup condition: upstream includes the file path in Read
tool result rows or provides equivalent transcript context.
"""
rationale_ref = "reference/v2.1.88/sources/src/tools/FileReadTool/UI.tsx#L77-L143"

locator_kind = "ast_transform"

[patches.ast]
schema = 1
match = { node = "FunctionDeclaration", string_literal = "Read image (" }

[patches.transform]
op = "prepend_function_body"
code = '''let P=arguments[2]?.input?.file_path,Z=P?` \xB7 ${String(P).split(/[\\/]/).pop()||String(P)}`:"";'''

[[patches.tests]]
kind = "static"
name = "replacement is rendered"
assert_contains = '''function Jd7(H){let P=arguments[2]?.input?.file_path,Z=P?` \xB7 ${String(P).split(/[\\/]/).pop()||String(P)}`:"";switch(H.type){'''

[[patches]]
name = "read-result-path-image"
target_version = "2.1.133"
applies_to = ">=2.1.133 <2.2.0"

rationale = """
Show the file path on image Read result rows.

Read image results currently display only the image size. Patched bundles append
the same compact path suffix used for other Read result types so transcripts can
identify which image was read without relying on surrounding context. Cleanup
condition: upstream includes the file path in Read tool result rows or provides
equivalent transcript context.
"""
rationale_ref = "reference/v2.1.88/sources/src/tools/FileReadTool/UI.tsx#L80-L88"

locator_kind = "ast_transform"

[patches.ast]
schema = 1
match = { node = "CallExpression", callee_property = "createElement", direct_string_literal = "Read image (" }

[patches.transform]
op = "append_call_arg"
arg = "Z"

[[patches.tests]]
kind = "static"
name = "replacement is rendered"
assert_contains = '''tK.createElement(V,null,"Read image (",q,")",Z)'''

