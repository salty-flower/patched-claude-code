identify the source file without relying on surrounding context. Cleanup
condition: upstream includes the file path in Read tool result rows or provides
equivalent transcript context.
"""
rationale_ref = "reference/v2.1.88/sources/src/tools/FileReadTool/UI.tsx#L114-L122"

locator_kind = "ast_transform"

[patches.ast]
schema = 1
match = { node = "CallExpression", callee_property = "createElement", direct_string_literal = "Read ", string = '"page":"pages"' }

[patches.transform]
op = "append_call_arg"
arg = "Z"

[[patches.tests]]
kind = "static"
name = "replacement is rendered"
assert_contains = '''tK.createElement(V,null,"Read ",tK.createElement(V,{bold:!0},H.file.count)," ",H.file.count===1?"page":"pages"," (",p7(H.file.originalSize),")",Z)'''

