Expose `/later` through the existing slash-command suggestion pipeline.

This is the 2.1.212 minified-symbol variant of
`later-command-suggestion-metadata`. Cleanup condition: upstream exposes an
interactive delayed-send command.
"""
rationale_ref = "reference/v2.1.88/sources/src/commands.ts#L476-L489"

locator_kind = "ast_transform"

[patches.ast]
schema = 1
match = { node = "VariableDeclaration", source = '''let t=await aAo(e),r=Poo(),n=rst()?nku():[],o=t.filter((g)=>Flr(g)&&v0(g));''' }

[patches.transform]
op = "insert_after_node"
code = '''if(!o.some((g)=>g.name==="later"))o.push({type:"local",name:"later",description:"Schedule a prompt; use 10m or [YYYY-MM-dd] HH:mm[:ss]",supportsNonInteractive:!1,load:async()=>({call:async()=>({type:"skip"})})});'''

[[patches.tests]]
kind = "static"
name = "later command absolute-time suggestion metadata is rendered in 2.1.212"
assert_contains = '''name:"later",description:"Schedule a prompt; use 10m or [YYYY-MM-dd] HH:mm[:ss]"'''

[[patches.tests]]
kind = "static"
name = "2.1.212 suggestion variant no longer carries 2.1.210 loader symbols"
assert_not_contains = '''let t=await dSo(e),r=kno(),n=Uot()?SNu():[],o=t.filter((g)=>Osr(g)&&Z0(g));'''

