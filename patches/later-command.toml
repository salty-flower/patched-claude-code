[[patches]]
name = "later-command-suggestion-metadata-2-1-168"
applies_to = ">=2.1.168 <2.1.172"
rationale = """
Expose `/later` through the existing slash-command suggestion pipeline.

Claude Code's input dropdown is driven by getCommands(), not by the prompt
submit hook. Patched bundles inject a small local command record after
availability filtering so `/later` appears with syntax help while the submit
hook above continues to handle `/later <delay> <prompt>` and `/later list`
before normal slash-command execution.
Cleanup condition: upstream exposes an interactive delayed-send command.
"""
rationale_ref = "reference/v2.1.88/sources/src/commands.ts#L476-L489"

locator_kind = "ast_transform"

[patches.ast]
schema = 1
match = { node = "VariableDeclaration", source = '''let _=await Xu6(H),q=ThK().concat(u2H()?FTK():[]),K=_.filter((A)=>qI_(A)&&jV(A));''' }

[patches.transform]
op = "insert_after_node"
code = '''if(!K.some((A)=>A.name==="later"))K.push({type:"local",name:"later",description:"Schedule a prompt for later; use /later 10m <prompt> or /later list",supportsNonInteractive:!1,load:async()=>({call:async()=>({type:"skip"})})});'''

[[patches.tests]]
kind = "static"
name = "later command suggestion metadata is rendered"
assert_contains = '''name:"later",description:"Schedule a prompt for later; use /later 10m <prompt> or /later list"'''

