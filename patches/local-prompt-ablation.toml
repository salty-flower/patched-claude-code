name = "local-prompt-ablation"
target_version = "2.1.296"
applies_to = ">=2.1.293 <2.1.294"

[[patches]]
name = "local-prompt-ablation-local-source-admission-2-1-290"
lineage = "local-prompt-ablation-local-source-admission"
target_version = "2.1.290"
applies_to = ">=2.1.290 <2.1.291"
rationale = """
Require local opt-in before the 2.1.290 prompt-ablation helper reads its
server-sourced client_data fallback. Preserve the native
CLAUDE_CODE_REMOVE_PROMPT_STRINGS JSON override as the higher-precedence local
source. If that override is absent and CLAUDE_CODE_ALLOW_SERVED_TOOL_TEXT is
not exactly 1, return undefined without consulting the cached remote value.
Leaving this fetched prompt text available by default is rejected because it
silently changes prompt content without the served-text opt-in.
Remove when upstream applies the same local admission rule to this fallback.
"""
rationale_ref = "reference/v2.1.88/sources/src/constants/prompts.ts#L444-L576"
locator_kind = "ast_transform"
expected_matches = 1

  [patches.ast]
  schema = 1

    [patches.ast.match]
    node = "ConditionalExpression"
    source_regex = '^\w\?\w+\(\w+\.CLAUDE_CODE_REMOVE_PROMPT_STRINGS,!1\):\w+\(\)\?\.\[\w+\]$'

    [patches.ast.captures.nativee]
    kind = "identifier"
    path = "test"

  [patches.transform]
  op = "wrap_expression"
  template = '''(%%CAPTURE:nativee%%||process.env.CLAUDE_CODE_ALLOW_SERVED_TOOL_TEXT==="1"?%%EXPR%%:void 0)'''

  [[patches.tests]]
  kind = "static"
  name = "local prompt ablation keeps explicit JSON precedence and gates remote fallback"
  assert_contains = '''process.env.CLAUDE_CODE_ALLOW_SERVED_TOOL_TEXT==="1"?e?ft(a.CLAUDE_CODE_REMOVE_PROMPT_STRINGS,!1):'''

  [[patches.tests]]
  kind = "static"
  name = "local prompt ablation retains the explicit environment source"
  assert_contains = '''a.CLAUDE_CODE_REMOVE_PROMPT_STRINGS!==void 0'''

