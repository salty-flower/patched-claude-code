[[patches]]
name = "local-prompt-ablation-telemetry-bookkeeping-2-1-293"
lineage = "local-prompt-ablation-telemetry-unreachable"
target_version = "2.1.293"
applies_to = ">=2.1.293 <2.1.294"
rationale = """
Keep 2.1.293 prompt text replacement while removing the matched-string Set
and event bookkeeping branch from the rewrite loop. The AST locator requires
both the replaceAll assignment and the matched.has/add telemetry branch; its
single regex capture retains only the business assignment. Unknown source
shape fails closed. Disabling replacement entirely would also remove explicit
local user-configured behavior. Remove when the rewrite path stops tracking
matched strings for analytics.
"""
rationale_ref = "reference/v2.1.88/sources/src/services/analytics/index.ts#L80-L146"
locator_kind = "ast_transform"
expected_matches = 1

  [patches.ast]
  schema = 1
  match = { node = "IfStatement", strings = [".replaceAll(", ".matched.has(", ".matched.add("] }

  [patches.transform]
  op = "replace_substring_regex"
  find = '^if\((\w+=\w+\.replaceAll\(\w+,""\)),!\w+\.matched\.has\(\w+\)\)\w+\.matched\.add\(\w+\),\w+\(\w+\)$'
  value = "$1"

  [[patches.tests]]
  kind = "static"
  name = "2.1.293 prompt deletion retains its current replaceAll assignment"
  assert_contains = '''g=g.replaceAll(h,"")'''

  [[patches.tests]]
  kind = "static"
  name = "2.1.293 prompt deletion no longer records matched strings"
  assert_not_contains = '''s.matched.has(h)'''

  [[patches.tests]]
  kind = "static"
  name = "2.1.293 prompt deletion no longer adds matched strings"
  assert_not_contains = '''s.matched.add(h)'''

[[patches]]
name = "local-prompt-ablation-telemetry-emitter-noop-2-1-293"
lineage = "local-prompt-ablation-telemetry-unreachable"
target_version = "2.1.293"
applies_to = ">=2.1.293 <2.1.294"
rationale = """
Make the 2.1.293 prompt-ablation analytics emitter a no-op before configured
and matched counts can reach the analytics queue. This keeps explicit local
deletion and opted-in prompt rewriting functional while making this
content-derived telemetry event unreachable. Local opt-in to prompt rewriting
does not require analytics collection. Remove when upstream drops the event.
"""
rationale_ref = "reference/v2.1.88/sources/src/services/analytics/index.ts#L80-L146"
locator_kind = "ast_transform"
expected_matches = 1

  [patches.ast]
  schema = 1
  match = { node = "FunctionDeclaration", body_statement_count = 1, strings = ["tengu_remove_prompt_strings_applied"] }

  [patches.transform]
  op = "replace_function_body"
  body = "{}"

  [[patches.tests]]
  kind = "static"
  name = "2.1.293 prompt-ablation analytics event cannot reach the queue"
  assert_not_contains = '''tengu_remove_prompt_strings_applied'''

