name = "mcp-result-render-array-text-full"
target_version = "2.1.132"
applies_to = ">=2.1.132 <2.2.0"

rationale = """
Render MCP text-array results without terminal truncation.

MCP content-array results route each text block through the generic output
line renderer using the current verbose flag, which can hide most of the text
in normal interactive transcripts. Patched bundles force the result renderer's
text path into verbose mode while preserving the existing large-output warning.
Cleanup condition: upstream exposes a setting that keeps MCP text output
visible in transcripts.
"""
rationale_ref = "reference/v2.1.88/sources/src/tools/MCPTool/UI.tsx#L113-L130"

locator_pattern = '''Z4.createElement(qi5,{key:J,item:w,verbose:q})'''
locator_kind = "literal"
expected_matches = 1

replacement = '''Z4.createElement(qi5,{key:J,item:w,verbose:!0})'''

[[tests]]
kind = "static"
name = "replacement is rendered"
assert_contains = '''Z4.createElement(qi5,{key:J,item:w,verbose:!0})'''
