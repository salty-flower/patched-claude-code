name = "model-effort-capabilities"
target_version = "2.1.263"
applies_to = "=2.1.263"

[[patches]]
name = "explicit-capabilities-first-party-darwin-arm64"
platforms = ["darwin-arm64"]
rationale = "Honor explicit capability declarations on every provider with normalized model identity. A configured slot effort default itself declares effort support and its corresponding max/xhigh capability, matching historical slot semantics even when the capability list only says effort. Other slot capabilities come from the explicit list; tier declarations apply after the two custom slots. Authored against 2.1.263: Fre parameters e/t and tier table zre. Retire when upstream honors these declarations on firstParty."
rationale_ref = "reference/v2.1.88/sources/src/utils/model/modelSupportOverrides.ts#L11-L50"
locator_kind = "literal"
locator_pattern = '''if(Ca())return;for(let r of zre)'''
replacement = '''const __acc_norm=(s)=>s.trim().replace(/\[1m\]/gi,"").toLowerCase();for(const __acc_key of ["ANTHROPIC_CUSTOM_MODEL_OPTION","ANTHROPIC_CUSTOM_MODEL_OPTION_2"]){const __acc_model=process.env[__acc_key];if(!__acc_model?.trim()||__acc_norm(__acc_model)!==__acc_norm(e))continue;const __acc_effort=process.env[__acc_key+"_EFFORT_LEVEL"]?.trim().toLowerCase();if(["low","medium","high","xhigh","max"].includes(__acc_effort??"")&&(t==="effort"||t==="max_effort"&&__acc_effort==="max"||t==="xhigh_effort"&&__acc_effort==="xhigh"))return true;const __acc_caps=process.env[__acc_key+"_SUPPORTED_CAPABILITIES"];if(__acc_caps!==undefined)return __acc_caps.toLowerCase().split(",").some((s)=>s.trim()===t)}for(const {modelEnvVar,capabilitiesEnvVar} of zre){const __acc_model=process.env[modelEnvVar],__acc_caps=process.env[capabilitiesEnvVar];if(__acc_model?.trim()&&__acc_caps!==void 0&&__acc_norm(__acc_model)===__acc_norm(e))return __acc_caps.toLowerCase().split(",").some((s)=>s.trim()===t)}for(let r of zre)'''

[[patches.tests]]
kind = "static"
name = "explicit-capabilities-first-party is rendered on darwin-arm64"
assert_contains = '''const __acc_norm=(s)=>s.trim().replace(/\[1m\]/gi,"").toLowerCase();for(const __acc_key of ["ANTHROPIC_CUSTOM_MODEL_OPTION","ANTHROPIC_CUSTOM_MODEL_OPTION_2"]){const __acc_model=process.env[__acc_key];if(!__acc_model?.trim()||__acc_norm(__acc_model)!==__acc_norm(e))continue;const __acc_effort=process.env[__acc_key+"_EFFORT_LEVEL"]?.trim().toLowerCase();if(["low","medium","high","xhigh","max"].includes(__acc_effort??"")&&(t==="effort"||t==="max_effort"&&__acc_effort==="max"||t==="xhigh_effort"&&__acc_effort==="xhigh"))return true;const __acc_caps=process.env[__acc_key+"_SUPPORTED_CAPABILITIES"];if(__acc_caps!==undefined)return __acc_caps.toLowerCase().split(",").some((s)=>s.trim()===t)}for(const {modelEnvVar,capabilitiesEnvVar} of zre){const __acc_model=process.env[modelEnvVar],__acc_caps=process.env[capabilitiesEnvVar];if(__acc_model?.trim()&&__acc_caps!==void 0&&__acc_norm(__acc_model)===__acc_norm(e))return __acc_caps.toLowerCase().split(",").some((s)=>s.trim()===t)}for(let r of zre)'''

[[patches]]
name = "effort-reactive-capability-darwin-arm64"
platforms = ["darwin-arm64"]
rationale = "Send the selected max/xhigh value rather than silently lowering it based on capability guesses. Authored against 2.1.263: P locals o/t and capability checks FN/i6. Keep organization policy normalization before this site and the existing unsupported-model latch and retry. Retire when upstream removes speculative clamping."
rationale_ref = "reference/v2.1.88/sources/src/utils/effort.ts#L147-L169"
locator_kind = "literal"
locator_pattern = '''if(o==="max"&&!FN(t))o="high";if(o==="xhigh"&&!i6(t))o="high";'''
replacement = '''/* effort capability is learned from backend rejection */'''

[[patches.tests]]
kind = "static"
name = "effort-reactive-capability is rendered on darwin-arm64"
assert_contains = '''/* effort capability is learned from backend rejection */'''

[[patches]]
name = "effort-retry-notice-queue-darwin-arm64"
platforms = ["darwin-arm64"]
rationale = "Queue a visible notice when the existing unsupported-effort recovery latches the backend refusal. Authored against 2.1.263: recovery callback zZ, classifier PIe, options p. State belongs to this request callback and is drained with native recovery notices."
rationale_ref = "reference/v2.1.88/sources/src/utils/effort.ts#L147-L180"
locator_kind = "literal"
locator_pattern = '''zZ=(et)=>{if(!PIe(et))return null;'''
replacement = '''zZ=(et)=>{if(!PIe(et))return null;zZ.__acc_notice=`Model ${p.model} rejected the effort parameter. Retrying without effort; the backend default is unknown. Effort stays disabled for this model in this session.`;'''

[[patches.tests]]
kind = "static"
name = "effort-retry-notice-queue is rendered on darwin-arm64"
assert_contains = '''zZ=(et)=>{if(!PIe(et))return null;zZ.__acc_notice=`Model ${p.model} rejected the effort parameter. Retrying without effort; the backend default is unknown. Effort stays disabled for this model in this session.`;'''

[[patches]]
name = "effort-retry-notice-drain-darwin-arm64"
platforms = ["darwin-arm64"]
rationale = "Render the queued effort rejection through the native warning message consumer. Authored against 2.1.263: recovery generator XZ, callback zZ, warning factory lV. Drain once after recovery using the same path as native recovery notices. Verified in the interactive main-conversation rejection path; background title calls use a separate consumer."
rationale_ref = "reference/v2.1.88/sources/src/utils/effort.ts#L172-L180"
locator_kind = "literal"
locator_pattern = '''function*XZ(){'''
replacement = '''function*XZ(){if(zZ.__acc_notice!==void 0){const __acc_notice=zZ.__acc_notice;delete zZ.__acc_notice;yield lV(__acc_notice,"warning")}'''

[[patches.tests]]
kind = "static"
name = "effort-retry-notice-drain is rendered on darwin-arm64"
assert_contains = '''function*XZ(){if(zZ.__acc_notice!==void 0){const __acc_notice=zZ.__acc_notice;delete zZ.__acc_notice;yield lV(__acc_notice,"warning")}'''

