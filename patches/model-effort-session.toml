name = "model-effort-session"
target_version = "2.1.263"
applies_to = "=2.1.263"

[[patches]]
name = "effort-session-owner-darwin-arm64"
platforms = ["darwin-arm64"]
rationale = """
Use model-specific session defaults and explicit overrides without changing saved settings.
Authored for 2.1.263; bindings MT, drt, wt, VH, zh, bHt, UN, P, A, X, q and D were inspected in the target graph.
Remove when upstream scopes interactive effort to each session and resolved model.
"""
rationale_ref = "reference/v2.1.88/sources/src/utils/effort.ts#L147-L169"
locator_kind = "regex"
locator_pattern = '''function drt\(e\)\{(?=n\(\)\.modelSelection\.replaceMainLoopEffortState)'''
replacement = '''function drt(e){if(e===Symbol.for("patched-cc.effort-session"))return n().modelSelection;'''

[[patches.tests]]
kind = "static"
name = "effort-session-owner is active on darwin-arm64"
assert_contains = '''function drt(e){if(e===Symbol.for("patched-cc.effort-session"))return n().modelSelection;'''

