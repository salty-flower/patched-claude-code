assert_contains = '''async function lSe(t,o,n=!0,r){if(!jn()){const current=MT.session(rt()),input=t.trim().toLowerCase();if(current.cli)return{message:`Not applied: CLI --effort holds ${current.slug} at ${current.value??"backend default"} this session.`};if(input==="ultracode"){const result=await patchedNativeEffortDarwin(t,o,!1,r);if(result.effortUpdate){const effective=MT.session(rt(),"set",result.effortUpdate.value);o(state=>({...state,effortByModel:effective.effortByModel,effortRevision:(state.effortRevision??0)+1}))}return result;}const reset=input==="auto"||input==="unset",requested=reset?void 0:_$e(input);if(!reset&&requested===null||!reset&&requested===void 0)return{message:`Invalid effort: ${t}. ${E(rt())}`};const effective=MT.session(rt(),reset?"clear":"set",requested);o(state=>({...state,effortByModel:effective.effortByModel,effortRevision:(state.effortRevision??0)+1,ultracode:!1}));return{message:`${reset?"Reset":"Set"} effort to ${effective.value??"backend default"} for ${effective.slug} (${effective.source}).`};}return patchedNativeEffortDarwin(t,o,n,r);}async function patchedNativeEffortDarwin(t,o,n=!0,r){'''

