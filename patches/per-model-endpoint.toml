name = "per-model-endpoint"
target_version = "2.1.168"
applies_to = ">=2.1.168 <2.2.0"

rationale = """
Allow per-model API endpoint and auth configuration via environment variables.

Set ANTHROPIC_MODEL_BASE_URL_<sanitized_model> to override the API endpoint,
ANTHROPIC_MODEL_API_KEY_<model> for the x-api-key header, and
ANTHROPIC_MODEL_AUTH_TOKEN_<model> for the Authorization: Bearer header.

The sanitized model ID replaces all non-alphanumeric characters with '_'.
Example:

  ANTHROPIC_MODEL_BASE_URL_claude_sonnet_4_6=https://openrouter.ai/api/v1
  ANTHROPIC_MODEL_API_KEY_claude_sonnet_4_6=sk-or-...

This enables mixing providers within a single session — route different
models to different API endpoints, each with its own credentials.

Important: Model names with the [1m] suffix (e.g. "deepseek-v4-flash[1m]")
have the suffix stripped by Claude Code before the API call. The env var
key must use the stripped name. For example:

  ANTHROPIC_MODEL_BASE_URL_deepseek_v4_flash=https://...

(The injection occurs after suffix stripping, so O.model / H.model
already reflects the canonical name.)

Scope: per-model routing applies to model-inference calls that carry a
`model` parameter — Messages.create() and Messages.countTokens(), both
beta and non-beta. Model-catalog calls (models.list, models.retrieve)
and infrastructure calls (files, sessions, agents, etc.) use the
default client endpoint (ANTHROPIC_BASE_URL or api.anthropic.com).

Five changes are needed:
1. Disable the buildURL() guard that blocks per-request defaultBaseURL
   when the client's base URL is already custom.
2. Inject per-model defaultBaseURL + auth into Messages.create()
   (beta path — /v1/messages?beta=true, YYH class).
3. Same injection into the non-beta create path (/v1/messages, FC class).
4. Same injection into Messages.countTokens() (beta path).
5. Same injection into Messages.countTokens() (non-beta path).

Auth header injection goes AFTER caller-supplied headers (..._?.headers)
in the merge so per-model env vars take precedence over the default
client auth. Per-model URL goes BEFORE caller options (..._) so
callers can still override.

Note on header naming:
  ANTHROPIC_MODEL_API_KEY_*    → x-api-key header (Anthropic-native auth)
  ANTHROPIC_MODEL_AUTH_TOKEN_* → Authorization: Bearer (OpenRouter etc.)
"""

# ════════════════════════════════════════════════════════════
# Patch 1: Disable the buildURL guard so per-request
# defaultBaseURL always takes effect, regardless of the client's
# configured base URL.
#
# The guard function body is version-stable across all 2.1.x
# releases. Patching it to return !1 removes the conditional
# that ignores defaultBaseURL when this.baseURL is custom.
# ════════════════════════════════════════════════════════════

[[patches]]
name = "disable-default-base-url-guard"
applies_to = ">=2.1.168 <2.2.0"
rationale_ref = "reference/v2.1.88/sources/src/utils/messages.ts#L1-L50"
locator_kind = "literal"
locator_pattern = '''return this.baseURL!=="https://api.anthropic.com"'''
replacement = '''return !1'''

[[patches.tests]]
kind = "static"
name = "guard function always returns false"
assert_contains = '''return !1'''

[[patches.tests]]
kind = "static"
name = "old guard pattern is removed"
assert_not_contains = '''return this.baseURL!=="https://api.anthropic.com"'''

# ════════════════════════════════════════════════════════════
# Patch 2: Inject per-model defaultBaseURL + auth into
# Messages.create() (beta path — /v1/messages?beta=true, YYH)
#
# Variables in scope at the return site:
#   O = request body (has .model)
#   q = normalized input (has .stream)
#   K = betas
#   $ = x-stainless-helper headers
#   T = timeout
#   _ = caller extra options
# ════════════════════════════════════════════════════════════

[[patches]]
name = "inject-per-model-into-beta-create"
applies_to = ">=2.1.168 <2.2.0"
rationale_ref = "reference/v2.1.88/sources/src/utils/messages.ts#L100-L200"
locator_kind = "literal"
locator_pattern = '''return this._client.post("/v1/messages?beta=true",{body:O,timeout:T??600000,..._,headers:lq([{...K?.toString()!=null?{"anthropic-beta":K?.toString()}:void 0},$,_?.headers]),stream:q.stream??!1})'''
replacement = '''let Vb=process.env["ANTHROPIC_MODEL_BASE_URL_"+O.model?.replace(/[^a-zA-Z0-9]/g,"_")],Vk=process.env["ANTHROPIC_MODEL_API_KEY_"+O.model?.replace(/[^a-zA-Z0-9]/g,"_")],Vt=process.env["ANTHROPIC_MODEL_AUTH_TOKEN_"+O.model?.replace(/[^a-zA-Z0-9]/g,"_")];return this._client.post("/v1/messages?beta=true",{body:O,timeout:T??600000,...(Vb?{defaultBaseURL:Vb}:{}),..._,headers:lq([{...K?.toString()!=null?{"anthropic-beta":K?.toString()}:void 0},$,_?.headers,...(Vk?[{"x-api-key":Vk}]:[]),...(Vt?[{Authorization:"Bearer "+Vt}]:[])]),stream:q.stream??!1})'''

[[patches.tests]]
kind = "static"
name = "beta create injects per-model URL lookup"
assert_contains = '''ANTHROPIC_MODEL_BASE_URL_'''

[[patches.tests]]
kind = "static"
name = "beta create injects per-model API key lookup"
assert_contains = '''ANTHROPIC_MODEL_API_KEY_'''

[[patches.tests]]
kind = "static"
name = "beta create injects per-model auth token lookup"
assert_contains = '''ANTHROPIC_MODEL_AUTH_TOKEN_'''

[[patches.tests]]
kind = "static"
name = "beta create spreads defaultBaseURL before caller options"
assert_contains = '''...(Vb?{defaultBaseURL:Vb}:{}),..._'''

# ════════════════════════════════════════════════════════════
# Patch 3: Inject per-model defaultBaseURL + auth into
# Messages.create() (non-beta path — /v1/messages, FC class)
#
# Variables in scope at the return site:
#   H = request body (has .model)
#   q = timeout
#   K = x-stainless-helper headers
#   _ = caller extra options
# ════════════════════════════════════════════════════════════

[[patches]]
name = "inject-per-model-into-nonbeta-create"
applies_to = ">=2.1.168 <2.2.0"
rationale_ref = "reference/v2.1.88/sources/src/utils/messages.ts#L200-L300"
locator_kind = "literal"
locator_pattern = '''return this._client.post("/v1/messages",{body:H,timeout:q??600000,..._,headers:lq([K,_?.headers]),stream:H.stream??!1})'''
replacement = '''let Vb=process.env["ANTHROPIC_MODEL_BASE_URL_"+H.model?.replace(/[^a-zA-Z0-9]/g,"_")],Vk=process.env["ANTHROPIC_MODEL_API_KEY_"+H.model?.replace(/[^a-zA-Z0-9]/g,"_")],Vt=process.env["ANTHROPIC_MODEL_AUTH_TOKEN_"+H.model?.replace(/[^a-zA-Z0-9]/g,"_")];return this._client.post("/v1/messages",{body:H,timeout:q??600000,...(Vb?{defaultBaseURL:Vb}:{}),..._,headers:lq([K,_?.headers,...(Vk?[{"x-api-key":Vk}]:[]),...(Vt?[{Authorization:"Bearer "+Vt}]:[])]),stream:H.stream??!1})'''

[[patches.tests]]
kind = "static"
name = "non-beta create injects per-model URL lookup"
assert_contains = '''ANTHROPIC_MODEL_BASE_URL_'''

[[patches.tests]]
kind = "static"
name = "non-beta create injects per-model API key lookup"
assert_contains = '''ANTHROPIC_MODEL_API_KEY_'''

[[patches.tests]]
kind = "static"
name = "non-beta create injects per-model auth token lookup"
assert_contains = '''ANTHROPIC_MODEL_AUTH_TOKEN_'''

[[patches.tests]]
kind = "static"
name = "non-beta create spreads defaultBaseURL before caller options"
assert_contains = '''...(Vb?{defaultBaseURL:Vb}:{}),..._'''

# ════════════════════════════════════════════════════════════
# Patch 4: Inject per-model defaultBaseURL + auth into
# Messages.countTokens() (beta path, YYH class)
#
# Beta countTokens desugars betas from the input, exposing the
# request body as O. O.model is the target model.
#
# Variables in scope at the return site:
#   O = request body (has .model, after betas stripped)
#   K = betas (used for the beta header)
#   _ = caller extra options
# ════════════════════════════════════════════════════════════

[[patches]]
name = "inject-per-model-into-beta-count-tokens"
applies_to = ">=2.1.168 <2.2.0"
rationale_ref = "reference/v2.1.88/sources/src/utils/messages.ts#L300-L400"
locator_kind = "literal"
locator_pattern = '''return this._client.post("/v1/messages/count_tokens?beta=true",{body:O,..._,headers:lq([{"anthropic-beta":[...K??[],"token-counting-2024-11-01"].toString()},_?.headers])})'''
replacement = '''let Vb=process.env["ANTHROPIC_MODEL_BASE_URL_"+O.model?.replace(/[^a-zA-Z0-9]/g,"_")],Vk=process.env["ANTHROPIC_MODEL_API_KEY_"+O.model?.replace(/[^a-zA-Z0-9]/g,"_")],Vt=process.env["ANTHROPIC_MODEL_AUTH_TOKEN_"+O.model?.replace(/[^a-zA-Z0-9]/g,"_")];return this._client.post("/v1/messages/count_tokens?beta=true",{body:O,...(Vb?{defaultBaseURL:Vb}:{}),..._,headers:lq([{"anthropic-beta":[...K??[],"token-counting-2024-11-01"].toString()},_?.headers,...(Vk?[{"x-api-key":Vk}]:[]),...(Vt?[{Authorization:"Bearer "+Vt}]:[])])})'''

[[patches.tests]]
kind = "static"
name = "beta countTokens injects per-model URL lookup"
assert_contains = '''ANTHROPIC_MODEL_BASE_URL_'''

[[patches.tests]]
kind = "static"
name = "beta countTokens injects per-model API key lookup"
assert_contains = '''ANTHROPIC_MODEL_API_KEY_'''

[[patches.tests]]
kind = "static"
name = "beta countTokens injects per-model auth token lookup"
assert_contains = '''ANTHROPIC_MODEL_AUTH_TOKEN_'''

# ════════════════════════════════════════════════════════════
# Patch 5: Inject per-model defaultBaseURL + auth into
# Messages.countTokens() (non-beta path, FC class)
#
# Non-beta countTokens passes the request body directly as H.
# H.model is the target model.
#
# Variables in scope at the return site:
#   H = request body (has .model)
#   _ = caller extra options
# ════════════════════════════════════════════════════════════

[[patches]]
name = "inject-per-model-into-nonbeta-count-tokens"
applies_to = ">=2.1.168 <2.2.0"
rationale_ref = "reference/v2.1.88/sources/src/utils/messages.ts#L400-L500"
locator_kind = "literal"
locator_pattern = '''return this._client.post("/v1/messages/count_tokens",{body:H,..._})'''
replacement = '''let Vb=process.env["ANTHROPIC_MODEL_BASE_URL_"+H.model?.replace(/[^a-zA-Z0-9]/g,"_")],Vk=process.env["ANTHROPIC_MODEL_API_KEY_"+H.model?.replace(/[^a-zA-Z0-9]/g,"_")],Vt=process.env["ANTHROPIC_MODEL_AUTH_TOKEN_"+H.model?.replace(/[^a-zA-Z0-9]/g,"_")];return this._client.post("/v1/messages/count_tokens",{body:H,...(Vb?{defaultBaseURL:Vb}:{}),..._,headers:lq([_?.headers,...(Vk?[{"x-api-key":Vk}]:[]),...(Vt?[{Authorization:"Bearer "+Vt}]:[])])})'''

[[patches.tests]]
kind = "static"
name = "non-beta countTokens injects per-model URL lookup"
assert_contains = '''ANTHROPIC_MODEL_BASE_URL_'''

[[patches.tests]]
kind = "static"
name = "non-beta countTokens injects per-model API key lookup"
assert_contains = '''ANTHROPIC_MODEL_API_KEY_'''

[[patches.tests]]
kind = "static"
name = "non-beta countTokens injects per-model auth token lookup"
assert_contains = '''ANTHROPIC_MODEL_AUTH_TOKEN_'''
