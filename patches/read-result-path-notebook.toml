name = "read-result-path-notebook"
target_version = "2.1.133"
applies_to = ">=2.1.133 <2.2.0"

rationale = """
Show the file path on notebook Read result rows.

Notebook Read results currently display only the cell count. Patched bundles
append the compact input path so transcripts can identify which notebook was
read without relying on surrounding context. Cleanup condition: upstream
includes the file path in Read tool result rows or provides equivalent
transcript context.
"""
rationale_ref = "reference/v2.1.88/sources/src/tools/FileReadTool/UI.tsx#L90-L102"

locator_pattern = '''tK.createElement(V,null,"Read ",tK.createElement(V,{bold:!0},_.length)," cells")'''
locator_kind = "literal"
expected_matches = 1

replacement = '''tK.createElement(V,null,"Read ",tK.createElement(V,{bold:!0},_.length)," cells",Z)'''

[[tests]]
kind = "static"
name = "replacement is rendered"
assert_contains = '''tK.createElement(V,null,"Read ",tK.createElement(V,{bold:!0},_.length)," cells",Z)'''
