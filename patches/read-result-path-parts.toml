name = "read-result-path-parts"
target_version = "2.1.133"
applies_to = ">=2.1.133 <2.2.0"

rationale = """
Show the file path on multi-part Read result rows.

Multi-part Read results currently display only the extracted page count and
source size. Patched bundles append the compact input path so transcripts can
identify the source file without relying on surrounding context. Cleanup
condition: upstream includes the file path in Read tool result rows or provides
equivalent transcript context.
"""
rationale_ref = "reference/v2.1.88/sources/src/tools/FileReadTool/UI.tsx#L114-L122"

locator_pattern = '''tK.createElement(V,null,"Read ",tK.createElement(V,{bold:!0},H.file.count)," ",H.file.count===1?"page":"pages"," (",p7(H.file.originalSize),")")'''
locator_kind = "literal"
expected_matches = 1

replacement = '''tK.createElement(V,null,"Read ",tK.createElement(V,{bold:!0},H.file.count)," ",H.file.count===1?"page":"pages"," (",p7(H.file.originalSize),")",Z)'''

[[tests]]
kind = "static"
name = "replacement is rendered"
assert_contains = '''tK.createElement(V,null,"Read ",tK.createElement(V,{bold:!0},H.file.count)," ",H.file.count===1?"page":"pages"," (",p7(H.file.originalSize),")",Z)'''
