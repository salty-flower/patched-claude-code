name = "read-result-path-pdf"
target_version = "2.1.132"
applies_to = ">=2.1.132 <2.2.0"

rationale = """
Show the file path on PDF Read result rows.

PDF Read results currently display only the PDF size. Patched bundles append
the compact input path so transcripts can identify which PDF was read without
relying on surrounding context. Cleanup condition: upstream includes the file
path in Read tool result rows or provides equivalent transcript context.
"""
rationale_ref = "reference/v2.1.88/sources/src/tools/FileReadTool/UI.tsx#L104-L112"

locator_pattern = '''oK.createElement(V,null,"Read PDF (",q,")")'''
locator_kind = "literal"
expected_matches = 1

replacement = '''oK.createElement(V,null,"Read PDF (",q,")",Z)'''

[[tests]]
kind = "static"
name = "replacement is rendered"
assert_contains = '''oK.createElement(V,null,"Read PDF (",q,")",Z)'''
