name = "read-result-path-text"
target_version = "2.1.133"
applies_to = ">=2.1.133 <2.2.0"

rationale = """
Show the file path on text Read result rows.

Text Read results currently display only the number of lines read. Patched
bundles append the compact input path so transcripts can identify which file
was read without relying on surrounding context. Cleanup condition: upstream
includes the file path in Read tool result rows or provides equivalent
transcript context.
"""
rationale_ref = "reference/v2.1.88/sources/src/tools/FileReadTool/UI.tsx#L124-L134"

locator_pattern = '''tK.createElement(V,null,"Read ",tK.createElement(V,{bold:!0},_)," ",_===1?"line":"lines")'''
locator_kind = "literal"
expected_matches = 1

replacement = '''tK.createElement(V,null,"Read ",tK.createElement(V,{bold:!0},_)," ",_===1?"line":"lines",Z)'''

[[tests]]
kind = "static"
name = "replacement is rendered"
assert_contains = '''tK.createElement(V,null,"Read ",tK.createElement(V,{bold:!0},_)," ",_===1?"line":"lines",Z)'''
