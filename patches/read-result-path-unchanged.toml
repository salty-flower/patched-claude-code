name = "read-result-path-unchanged"
target_version = "2.1.132"
applies_to = ">=2.1.132 <2.2.0"

rationale = """
Show the file path on unchanged Read result rows.

Unchanged Read results currently say only that the prior read is still valid.
Patched bundles append the compact input path so transcripts can identify which
cached file is being referenced. Cleanup condition: upstream includes the file
path in Read tool result rows or provides equivalent transcript context.
"""
rationale_ref = "reference/v2.1.88/sources/src/tools/FileReadTool/UI.tsx#L136-L140"

locator_pattern = '''oK.createElement(V,{dimColor:!0},"Unchanged since last read")'''
locator_kind = "literal"
expected_matches = 1

replacement = '''oK.createElement(V,{dimColor:!0},"Unchanged since last read",Z)'''

[[tests]]
kind = "static"
name = "replacement is rendered"
assert_contains = '''oK.createElement(V,{dimColor:!0},"Unchanged since last read",Z)'''
