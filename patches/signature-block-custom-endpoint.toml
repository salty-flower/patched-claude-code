name = "signature-block-custom-endpoint"
target_version = "2.1.150"
applies_to = ">=2.1.150 <2.2.0"

rationale = """
Strip stale signature-bearing thinking blocks before requests that cross API
endpoint boundaries.

Claude Code already carries a helper for removing signed thinking,
redacted_thinking, and connector_text blocks because their signatures are
bound to the API key and model that produced them. In the current minified
request path, that cleanup only runs for Bedrock. Third-party endpoints
selected via ANTHROPIC_BASE_URL are still treated as the first-party provider
for this branch, so Kimi/OpenRouter/LiteLLM sessions can replay signed
thinking blocks generated by a different endpoint or key and fail with API
400s or unrecoverable resume loops.

The patch makes non-Anthropic base URLs send clean history by stripping all
signed blocks. First-party Anthropic requests retain compatible signed
thinking, but still drop signed blocks from messages whose recorded model
differs from the active request model. Cleanup condition: upstream applies
signature cleanup based on endpoint/key/model provenance before replaying
transcripts.
"""

[[patches]]
name = "strip-signatures-for-custom-base-url"
applies_to = ">=2.1.150 <2.1.156"
rationale_ref = "reference/v2.1.88/sources/src/utils/messages.ts#L5061-L5065"
locator_kind = "literal"
locator_pattern = '''let v=Cq()==="bedrock"?DfK(H,YP(T.model)):H,'''
replacement = '''let v=!DO()?bx8(H):DfK(H,YP(T.model)),'''

[[patches.tests]]
kind = "static"
name = "custom base URL strips signed blocks"
assert_contains = '''let v=!DO()?bx8(H):DfK(H,YP(T.model)),'''

[[patches.tests]]
kind = "static"
name = "old bedrock-only cleanup gate is removed"
assert_not_contains = '''let v=Cq()==="bedrock"?DfK(H,YP(T.model)):H,'''

[[patches]]
name = "strip-signatures-for-custom-base-url-2-1-156"
target_version = "2.1.156"
applies_to = ">=2.1.156 <2.2.0"
rationale_ref = "reference/v2.1.88/sources/src/utils/messages.ts#L5061-L5065"
locator_kind = "literal"
locator_pattern = '''let v=tZK(H,NP(T.model)),'''
replacement = '''let v=!CO()?eZK(H):tZK(H,NP(T.model)),'''

[[patches.tests]]
kind = "static"
name = "custom base URL strips signed blocks in 2.1.156"
assert_contains = '''let v=!CO()?eZK(H):tZK(H,NP(T.model)),'''

[[patches.tests]]
kind = "static"
name = "model-only cleanup is no longer used for custom base URLs"
assert_not_contains = '''let v=tZK(H,NP(T.model)),'''
