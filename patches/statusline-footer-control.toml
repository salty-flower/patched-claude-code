top-level field.

Recent upstream bundles include an `effort.level` object for models that
support effort selection. Status line scripts often want the selected level as
a direct scalar beside `fast_mode` and `thinking.enabled`; patched bundles add
`effort_level` using the same effective display-level helper while preserving
the upstream nested `effort` object. Unsupported models receive `null` instead
of omitting the top-level field.
