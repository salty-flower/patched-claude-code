op = "replace_substring_regex"
find = "(fast_mode:q,)\\.\\.\\.(\\w+)\\(M\\)&&\\{effort:\\{level:(\\w+)\\(M,w\\)\\}\\}"
value = "$1effort_level:$2(M)?$3(M,w):null,...$2(M)&&{effort:{level:$3(M,w)}}"

[[patches.tests]]
