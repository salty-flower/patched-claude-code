locator_kind = "ast_transform"

[patches.ast]
schema = 1
match = { node = "VariableDeclaration", source_regex = "^let ", strings = ["CLAUDE_CODE_SHELL_PREFIX", "CLAUDE_PROJECT_DIR"] }

[patches.transform]
op = "replace_substring_regex"
find = "(let [^;]+?,([A-Za-z_$][A-Za-z0-9_$]*)=\\{\\.\\.\\.[A-Za-z_$][A-Za-z0-9_$]*\\(\\),CLAUDE_PROJECT_DIR:[A-Za-z_$][A-Za-z0-9_$]*\\([A-Za-z_$][A-Za-z0-9_$]*\\)\\}),([A-Za-z_$][A-Za-z0-9_$]*=[A-Za-z_$][A-Za-z0-9_$]*\\(\\);)"
value = "$1;if(_===\"StatusLine\"&&process.stdout.columns)$2.COLUMNS=String(process.stdout.columns);let $3"

