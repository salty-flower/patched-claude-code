name = "statusline-footer-control"
target_version = "2.1.133"
applies_to = ">=2.1.133 <2.2.0"

rationale = """
Let custom status lines own the built-in footer surfaces.

Patched bundles add a CLI switch and settings schema for hiding specific
built-in footer items, while preserving the status JSON fields custom
statusLine commands need to render those items themselves. Cleanup condition:
upstream ships official statusLine footer controls and equivalent statusLine
JSON fields.
"""

[[patches]]
name = "statusline-footer-control-cli-option"
applies_to = ">=2.1.133 <2.2.0"
rationale = """
Add a CLI switch for hiding built-in footer items.

Users who configure statusLine output may want the same per-session override
without editing settings files. Patched bundles add `--hide-builtin-footer` as
a normal top-level option that accepts an optional comma-separated item list;
omitting the value hides all known footer items. Cleanup condition: upstream
ships an official CLI flag or settings command for built-in footer items.
"""
rationale_ref = "reference/v2.1.88/sources/src/main.tsx#L971-L1006"
locator_pattern = '''\.addOption\(new ([a-zA-Z0-9_$]+)\("--permission-mode <mode>","Permission mode to use for the session"\)\.choices\(([a-zA-Z0-9_$]+)\)\.argParser\(([a-zA-Z0-9_$]+)\)\)\.option\("-c, --continue"'''
locator_kind = "regex"
expected_matches = 1
replacement = '''.addOption(new $1("--permission-mode <mode>","Permission mode to use for the session").choices($2).argParser($3)).option("--hide-builtin-footer [items]","Hide built-in footer items. Pass a comma-separated list, or omit the value to hide all.",(H)=>{let _=H??"all",q=_===!0||_==="all"?["footer","permission_mode","mode","effort_notification","rate_limit_warning","clipboard_image_hint","teammate_idle_spacer"]:String(_).split(",").map((K)=>K.trim()).filter(Boolean);return globalThis.__acc_disabled_footer=q,_}).option("-c, --continue"'''

[[patches.tests]]
kind = "static"
name = "CLI option is rendered"
assert_contains = '''.option("--hide-builtin-footer [items]","Hide built-in footer items. Pass a comma-separated list, or omit the value to hide all.",(H)=>{let _=H??"all",q=_===!0||_==="all"?["footer","permission_mode","mode","effort_notification","rate_limit_warning","clipboard_image_hint","teammate_idle_spacer"]:String(_).split(",").map((K)=>K.trim()).filter(Boolean);return globalThis.__acc_disabled_footer=q,_}).option("-c, --continue"'''

[[patches]]
name = "statusline-footer-control-cli-settings"
applies_to = ">=2.1.133 <2.1.137"
rationale = """
Carry the hide-built-in-footer CLI switch into runtime settings.

The footer render path reads settings from AppState, not directly from parsed
CLI options. Patched bundles merge `--hide-builtin-footer` into the initial
runtime settings object as `statusLine.disabledFooter`, leaving persistent
settings files unchanged. Cleanup condition: upstream ships an official CLI
flag or runtime option for hiding built-in footer items.
"""
rationale_ref = "reference/v2.1.88/sources/src/main.tsx#L2927-L2961"
locator_kind = "ast_transform"

[patches.ast]
schema = 1
match = { node = "ObjectExpression", object_property_direct = "settings", strings = ["tasks", "taskDecorations"], parent_node = "VariableDeclarator" }

[patches.transform]
op = "set_object_property"
property = "settings"
value = 'Y.hideBuiltinFooter?(()=>{let H=m8(),_=Y.hideBuiltinFooter===!0||Y.hideBuiltinFooter==="all"?["footer","permission_mode","mode","effort_notification","rate_limit_warning","clipboard_image_hint","teammate_idle_spacer"]:String(Y.hideBuiltinFooter).split(",").map((q)=>q.trim()).filter(Boolean);return{...H,statusLine:{...H.statusLine,disabledFooter:_}}})():m8()'

[[patches.tests]]
kind = "static"
name = "CLI option expands to all footer items by default"
assert_contains = '''["footer","permission_mode","mode","effort_notification","rate_limit_warning","clipboard_image_hint","teammate_idle_spacer"]'''

