applies_to = ">=2.1.139 <2.2.0"
rationale = """
Forward the live TUI width into custom statusLine commands.

StatusLine commands run as hooks with piped stdio, so terminal-size probes
inside the command can fall back to 80 columns even while Claude Code is
rendering in a wider TTY. Custom right-aligned status lines then pad to the
wrong width and leave a large gap on the right. Upstream already tracks the
interactive terminal width in `process.stdout.columns`; patched bundles expose
that width as `COLUMNS` for StatusLine hooks only. Cleanup condition: upstream
adds terminal dimensions to the statusLine payload or hook environment.
