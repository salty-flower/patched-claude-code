[[patches]]
name = "statusline-json-clipboard-image-refresh"
applies_to = ">=2.1.133 <2.1.137"
rationale = """
Refresh custom statusLine output when clipboard image availability changes.

The clipboard image hint is detected in a focus-regain hook, outside the normal
statusLine refresh triggers. Patched bundles subscribe the StatusLine component
to the patched `clipboardImageAvailable` app-state field and schedule a refresh
when it changes, so custom statusLine commands receive the updated
`clipboard_image.available` payload. Cleanup condition: upstream adds official
statusLine fields and refresh triggers for current footer/input hints.
"""
rationale_ref = "reference/v2.1.88/sources/src/components/StatusLine.tsx#L170-L223"
locator_kind = "ast_transform"

[patches.ast]
schema = 1
match = { node = "VariableDeclaration", strings = ["thinkingEnabled", "useRef(void 0)", "toolPermissionContext", "addNotification"] }

[patches.transform]
op = "replace_substring_regex"
find = ",(\\w+=\\w+\\.useRef\\(\\w+\\));$"
value = ",b=Y_((l)=>l.clipboardImageAvailable??!1),$1;"

[[patches.tests]]
kind = "static"
name = "statusline observes clipboard image state"
assert_contains = '''clipboardImageAvailable??!1'''

[[patches]]
name = "statusline-json-permission-mode"
applies_to = ">=2.1.133 <2.1.181"
rationale = """
Expose current footer state to custom statusLine commands.

The upstream statusLine JSON payload includes session, model, workspace, cost,
context, vim, agent, remote, and worktree fields, but not the selected tool
permission/input mode that drives the built-in footer text such as "accept
edits on" or the clipboard image hint rendered below the prompt. Patched bundles
add a top-level `permission_mode` string and `clipboard_image` object so a
custom statusLine command can render the same footer state itself. When the
rate-limit warning hook publishes a rendered early-warning banner, patched
bundles include that string under `rate_limit_warning.message`. Cleanup
condition: upstream adds official statusLine fields for current footer/input
hints.
"""
rationale_ref = "reference/v2.1.88/sources/src/components/StatusLine.tsx#L65-L126"
locator_kind = "ast_transform"

[patches.ast]
schema = 1
match = { node = "ReturnStatement", strings = ["cwd:", "session_name:", "model:", "display_name:"] }

[patches.transform]
op = "replace_substring_regex"
find = "(cwd:\\w+,)"
value = '''$1permission_mode:H,clipboard_image:{available:globalThis.__acc_clipboard_image_available===!0,paste_shortcut:"ctrl+v"},...globalThis.__acc_rate_limit_warning&&{rate_limit_warning:{message:globalThis.__acc_rate_limit_warning}},'''

[[patches.tests]]
kind = "static"
name = "statusline JSON includes footer state"
assert_contains = '''permission_mode:H,clipboard_image:{available:globalThis.__acc_clipboard_image_available===!0,paste_shortcut:"ctrl+v"}'''

