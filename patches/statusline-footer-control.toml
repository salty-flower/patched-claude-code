[[patches]]
name = "statusline-footer-control-command-length-update-2-1-139"
applies_to = ">=2.1.139 <2.1.146"
rationale = """
Avoid crashing when footer-only statusLine settings have no command field.

The compatibility CLI flag stores footer controls under `settings.statusLine`
so existing footer patches can read them, but that object can exist without the
upstream `statusLine.command` field. Upstream statusLine rendering assumes
`statusLine.command` exists when it records update result telemetry, so 2.1.139
must read the command length defensively without disabling custom statusLine
rendering. Cleanup condition: footer controls move out of `settings.statusLine`
or upstream separates statusLine presence from command presence.
"""
rationale_ref = "reference/v2.1.88/sources/src/components/StatusLine.tsx#L185-L204"
locator_pattern = '''getCommandLength:()=>f.current?.statusLine?.command.length'''
locator_kind = "literal"
expected_matches = 1
replacement = '''getCommandLength:()=>f.current?.statusLine?.command?.length??0'''

[[patches.tests]]
kind = "static"
name = "statusline result telemetry tolerates missing command in 2.1.139"
assert_contains = '''getCommandLength:()=>f.current?.statusLine?.command?.length??0'''

