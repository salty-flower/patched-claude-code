[[patches]]
name = "statusline-footer-control-render"
applies_to = ">=2.1.133 <2.1.137"
rationale = """
Hide the built-in footer line when the footer item is disabled.

The footer currently renders the custom StatusLine and then always renders the
built-in PromptInputFooterLeftSide row under the normal prompt/footer
conditions. Patched bundles preserve the default behavior and suppress that
built-in row when either the compatibility boolean or `statusLine.disabledFooter`
includes `footer`. Cleanup condition: upstream ships an official setting or flag
for hiding the built-in footer status line.
"""
rationale_ref = "reference/v2.1.88/sources/src/components/PromptInput/PromptInputFooter.tsx#L138-L143"
locator_kind = "ast_transform"

