[[patches]]
name = "statusline-footer-control-schema-2-1-139"
applies_to = ">=2.1.139 <2.2.0"
rationale = """
Accept statusLine settings that hide built-in footer items.

Upstream already has statusLine-local display controls such as
`hideVimModeIndicator` in newer bundles, but no setting for suppressing specific
footer items below a custom statusLine. Patched bundles add
`statusLine.disabledFooter` as an enum-like item list and keep
`statusLine.hideBuiltinFooter` as a compatibility alias. In 2.1.139, the
statusLine schema object is built with the minified schema symbol `y`, so this
variant uses that local symbol instead of the older `v` symbol. Cleanup
condition: upstream ships an official setting for hiding built-in footer items
