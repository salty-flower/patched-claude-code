name = "statusline-footer-control-mode-hint"
applies_to = ">=2.1.143 <2.1.146"
rationale = """
Hide the built-in permission mode hint when the mode item is disabled.

The footer row can render the permission mode hint as its own segment before
other shortcut hints. Patched bundles let custom statusLine commands own that
surface with either the explicit `permission_mode` item name or the short
`mode` compatibility alias, while leaving the rest of the footer available.
