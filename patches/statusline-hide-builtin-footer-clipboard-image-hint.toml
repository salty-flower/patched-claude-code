name = "statusline-hide-builtin-footer-clipboard-image-hint"
target_version = "2.1.133"
applies_to = ">=2.1.133 <2.2.0"

rationale = """
Hide clipboard image hint banners when hideBuiltinFooter is enabled.

The focus-regain clipboard hook registers the `clipboard-image-hint`
notification, rendered as "Image in clipboard · ctrl+v to paste", separately
from the built-in footer row. Patched bundles still probe the clipboard and
record the result for custom statusLine commands, but suppress this immediate
notification when either the runtime CLI override or statusLine.hideBuiltinFooter
is true. Cleanup condition: upstream ships an official setting or flag for
hiding all built-in footer/status banners while exposing equivalent state to
custom status lines.
"""
rationale_ref = "reference/v2.1.88/sources/src/hooks/useClipboardImageHint.ts#L20-L67"

