name = "statusline-hide-builtin-footer-rate-limit-warning"
target_version = "2.1.133"
applies_to = ">=2.1.133 <2.2.0"

rationale = """
Hide rate-limit warning banners when hideBuiltinFooter is enabled.

The early-warning hook registers `rate-limit-warning` notifications such as
"You've used 72% of your session limit" separately from the built-in footer
row. Patched bundles preserve the quota state and error handling, publish the
rendered warning string for custom statusLine commands, but suppress this
warning notification when either the runtime CLI override or
statusLine.hideBuiltinFooter is true. Cleanup condition: upstream ships an
official setting or flag for hiding all built-in footer/status banners while
exposing equivalent state to custom status lines.
"""
rationale_ref = "reference/v2.1.88/sources/src/hooks/notifs/useRateLimitWarningNotification.tsx#L16-L26"

locator_pattern = '''let _=QbK.c(22),{addNotification:q}=J7(),K=uYH(),O=Y_(su3),T;if(_[0]!==K||_[1]!==H)T=l98(K,H),_[0]=K,_[1]=H,_[2]=T;else T=_[2];let A=T,z;if(_[3]!==K||_[4]!==O||_[5]!==H)'''
locator_kind = "literal"
expected_matches = 1

replacement = '''let _=QbK.c(22),{addNotification:q}=J7(),K=uYH(),O=Y_(su3),rH=Y_((m)=>m.settings.hideBuiltinFooter)||Y_((m)=>m.settings.statusLine?.hideBuiltinFooter),T;if(_[0]!==K||_[1]!==H)T=l98(K,H),_[0]=K,_[1]=H,_[2]=T;else T=_[2];globalThis.__acc_rate_limit_warning=T;let A=rH?null:T,z;if(_[3]!==K||_[4]!==O||_[5]!==H)'''

[[tests]]
kind = "static"
name = "rate limit warning is suppressed"
assert_contains = '''let A=rH?null:T,z;'''

[[tests]]
kind = "static"
name = "rate limit warning is available to statusline"
assert_contains = '''globalThis.__acc_rate_limit_warning=T'''
