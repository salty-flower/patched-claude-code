name = "statusline-hide-builtin-footer-schema"
target_version = "2.1.132"
applies_to = ">=2.1.132 <2.2.0"

rationale = """
Accept a statusLine setting that hides the built-in footer line.

Upstream already has statusLine-local display controls such as
`hideVimModeIndicator` in newer bundles, but no setting for suppressing the
additional built-in footer line below a custom statusLine. Patched bundles add
`statusLine.hideBuiltinFooter` as a conservative nested setting, keeping the
behavior scoped to sessions with a configured custom statusLine. Cleanup
condition: upstream ships an official setting for hiding the built-in footer
status line when a custom statusLine is present.
"""
rationale_ref = "reference/v2.1.88/sources/src/utils/settings/types.ts#L549-L557"

locator_pattern = '''hideVimModeIndicator:v.boolean().optional().describe("Hide the built-in `-- INSERT --` / `-- VISUAL --` indicator below the prompt. Use this when your status line script renders `vim.mode` itself.")}).optional().describe("Custom status line display configuration")'''
locator_kind = "literal"
expected_matches = 1

replacement = '''hideVimModeIndicator:v.boolean().optional().describe("Hide the built-in `-- INSERT --` / `-- VISUAL --` indicator below the prompt. Use this when your status line script renders `vim.mode` itself."),hideBuiltinFooter:v.boolean().optional().describe("Hide the additional built-in footer line when a custom status line is configured.")}).optional().describe("Custom status line display configuration")'''

[[tests]]
kind = "static"
name = "replacement is rendered"
assert_contains = '''hideVimModeIndicator:v.boolean().optional().describe("Hide the built-in `-- INSERT --` / `-- VISUAL --` indicator below the prompt. Use this when your status line script renders `vim.mode` itself."),hideBuiltinFooter:v.boolean().optional().describe("Hide the additional built-in footer line when a custom status line is configured.")}).optional().describe("Custom status line display configuration")'''
