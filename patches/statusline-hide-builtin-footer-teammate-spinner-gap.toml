locator_kind = "literal"
expected_matches = 1

replacement = '''if(D&&e&&!h)return tq.createElement(B,{flexDirection:"column",width:"100%",alignItems:"flex-start"},k?null:tq.createElement(B,{flexDirection:"row",flexWrap:"wrap",marginTop:1,width:"100%"},tq.createElement(V,{dimColor:!0},Ty," Idle",!t&&" \xB7 teammates running")),k&&tq.createElement(kK6,{selectedIndex:L,isInSelectionMode:N==="selecting-agent",allIdle:t,leaderTokenCount:JH,leaderIdleText:"Idle"}));'''

