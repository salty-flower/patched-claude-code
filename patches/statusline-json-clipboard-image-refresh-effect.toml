name = "statusline-json-clipboard-image-refresh-effect"
target_version = "2.1.133"
applies_to = ">=2.1.133 <2.2.0"

rationale = """
Trigger a custom statusLine rerender on clipboard image state changes.

Subscribing to the patched clipboard image app-state field is not enough by
itself because statusLine command execution is debounced behind explicit change
checks. Patched bundles schedule the existing statusLine refresh callback when
the clipboard image selector changes. Cleanup condition: upstream adds official
statusLine fields and refresh triggers for current footer/input hints.
"""
rationale_ref = "reference/v2.1.88/sources/src/components/StatusLine.tsx#L209-L223"

locator_pattern = '''let E=Y?.statusLine?.refreshInterval;'''
locator_kind = "literal"
expected_matches = 1

replacement = '''aY.useEffect(()=>{x()},[b,x]);let E=Y?.statusLine?.refreshInterval;'''

[[tests]]
kind = "static"
name = "clipboard image state triggers statusline refresh"
assert_contains = '''aY.useEffect(()=>{x()},[b,x]);let E=Y?.statusLine?.refreshInterval;'''
