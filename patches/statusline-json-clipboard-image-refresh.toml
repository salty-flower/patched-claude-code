name = "statusline-json-clipboard-image-refresh"
target_version = "2.1.133"
applies_to = ">=2.1.133 <2.2.0"

rationale = """
Refresh custom statusLine output when clipboard image availability changes.

The clipboard image hint is detected in a focus-regain hook, outside the normal
statusLine refresh triggers. Patched bundles subscribe the statusLine component
to the patched `clipboardImageAvailable` app-state field and schedule a refresh
when it changes, so custom statusLine commands receive the updated
`clipboard_image.available` payload. Cleanup condition: upstream adds official
statusLine fields and refresh triggers for current footer/input hints.
"""
rationale_ref = "reference/v2.1.88/sources/src/components/StatusLine.tsx#L170-L223"

locator_pattern = '''let O=aY.useRef(void 0),T=Y_((l)=>l.toolPermissionContext.mode),A=Y_((l)=>l.toolPermissionContext.additionalWorkingDirectories),z=Y_((l)=>l.statusLineText),$=c8(),Y=gY(),{addNotification:w}=J7(),J=yJ(),j=Y_((l)=>l.fastMode??!1),D=Y_((l)=>l.effortValue),M=Y_((l)=>l.thinkingEnabled),f=aY.useRef(Y);'''
locator_kind = "literal"
expected_matches = 1

replacement = '''let O=aY.useRef(void 0),T=Y_((l)=>l.toolPermissionContext.mode),A=Y_((l)=>l.toolPermissionContext.additionalWorkingDirectories),z=Y_((l)=>l.statusLineText),$=c8(),Y=gY(),{addNotification:w}=J7(),J=yJ(),j=Y_((l)=>l.fastMode??!1),D=Y_((l)=>l.effortValue),M=Y_((l)=>l.thinkingEnabled),b=Y_((l)=>l.clipboardImageAvailable??!1),f=aY.useRef(Y);'''

[[tests]]
kind = "static"
name = "statusline observes clipboard image state"
assert_contains = '''clipboardImageAvailable??!1'''
