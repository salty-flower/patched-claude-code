name = "statusline-json-permission-mode"
target_version = "2.1.133"
applies_to = ">=2.1.133 <2.2.0"

rationale = """
Expose the current permission mode to custom statusLine commands.

The upstream statusLine JSON payload includes session, model, workspace, cost,
context, vim, agent, remote, and worktree fields, but not the selected tool
permission/input mode that drives the built-in footer text such as "accept
edits on". Patched bundles add a top-level `permission_mode` string so a custom
statusLine command can render the same mode itself. Cleanup condition: upstream
adds an official statusLine field for the current permission/input mode.
"""
rationale_ref = "reference/v2.1.88/sources/src/components/StatusLine.tsx#L65-L126"

locator_pattern = '''return{...a1(),cwd:Y,...W&&{session_name:W},model:{id:M,display_name:oD(M)}'''
locator_kind = "literal"
expected_matches = 1

replacement = '''return{...a1(),cwd:Y,permission_mode:H,...W&&{session_name:W},model:{id:M,display_name:oD(M)}'''

[[tests]]
kind = "static"
name = "replacement is rendered"
assert_contains = '''return{...a1(),cwd:Y,permission_mode:H,...W&&{session_name:W},model:{id:M,display_name:oD(M)}'''
