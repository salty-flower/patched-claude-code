name = "statusline-json-permission-mode"
target_version = "2.1.133"
applies_to = ">=2.1.133 <2.2.0"

rationale = """
Expose current footer state to custom statusLine commands.

The upstream statusLine JSON payload includes session, model, workspace, cost,
context, vim, agent, remote, and worktree fields, but not the selected tool
permission/input mode that drives the built-in footer text such as "accept
edits on" or the clipboard image hint rendered below the prompt. Patched bundles
add a top-level `permission_mode` string and `clipboard_image` object so a custom
statusLine command can render the same footer state itself. When the rate-limit
warning hook publishes a rendered early-warning banner, patched bundles include
that string under `rate_limit_warning.message`. Cleanup condition: upstream adds
official statusLine fields for current footer/input hints.
"""
rationale_ref = "reference/v2.1.88/sources/src/components/StatusLine.tsx#L65-L126"

locator_pattern = '''return{...a1(),cwd:Y,...W&&{session_name:W},model:{id:M,display_name:oD(M)}'''
locator_kind = "literal"
expected_matches = 1

replacement = '''return{...a1(),cwd:Y,permission_mode:H,clipboard_image:{available:globalThis.__acc_clipboard_image_available===!0,paste_shortcut:"ctrl+v"},...globalThis.__acc_rate_limit_warning&&{rate_limit_warning:{message:globalThis.__acc_rate_limit_warning}},...W&&{session_name:W},model:{id:M,display_name:oD(M)}'''

[[tests]]
kind = "static"
name = "replacement is rendered"
assert_contains = '''return{...a1(),cwd:Y,permission_mode:H,clipboard_image:{available:globalThis.__acc_clipboard_image_available===!0,paste_shortcut:"ctrl+v"},...globalThis.__acc_rate_limit_warning&&{rate_limit_warning:{message:globalThis.__acc_rate_limit_warning}},...W&&{session_name:W},model:{id:M,display_name:oD(M)}'''
