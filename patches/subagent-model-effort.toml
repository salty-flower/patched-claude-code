[[patches]]
name = "agent-effective-effort-2-1-266-darwin-arm64"
lineage = "agent-effective-effort"
target_version = "2.1.266"
applies_to = ">=2.1.266 <2.1.267"
platforms = ["darwin-arm64"]
rationale = "The 2.1.266 Darwin Agent call keeps input e and model F at method entry, with xi guarding forced coordinator inheritance. Resolve effort beside model and suppress both under the same guard."
rationale_ref = "reference/v2.1.88/sources/src/tools/AgentTool/AgentTool.tsx#L239-L253"
locator_kind = "ast_transform"
[patches.ast]
schema = 1
match = { node = "ObjectMethod", method_name = "call", strings = ["CLAUDE_CODE_COORDINATOR_FORCE_WORKER_INHERIT_MODEL", "subagent_launch", "makeStream", "agentDefinition"] }
[patches.transform]
op = "replace_substring"
find = '''F=e.model,U=Date.now();if(xi()&&a.CLAUDE_CODE_COORDINATOR_FORCE_WORKER_INHERIT_MODEL)F=void 0;'''
value = '''F=e.model,patchedAgentEffort=e.effort,U=Date.now();if(xi()&&a.CLAUDE_CODE_COORDINATOR_FORCE_WORKER_INHERIT_MODEL)F=patchedAgentEffort=void 0;'''
[[patches.tests]]
kind = "static"
name = "2.1.266 Darwin Agent effort mirrors coordinator model suppression"
assert_contains = '''F=e.model,patchedAgentEffort=e.effort,U=Date.now();if(xi()&&a.CLAUDE_CODE_COORDINATOR_FORCE_WORKER_INHERIT_MODEL)F=patchedAgentEffort=void 0;'''
assert_not_contains = '''if(Ci()&&a.CLAUDE_CODE_COORDINATOR_FORCE_WORKER_INHERIT_MODEL)'''

