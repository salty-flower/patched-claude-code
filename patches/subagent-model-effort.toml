lineage = "agent-model-and-effort-schema"
target_version = "2.1.289"
applies_to = ">=2.1.289 <2.1.290"
platforms = ["darwin-arm64"]
rationale = "Accept custom model IDs and explicit effort in the 2.1.289 Darwin subagent schema. Capture the current enum and string constructors, coordinator predicate, and settings namespace. Preserve target model descriptions and forced-inheritance behavior."
