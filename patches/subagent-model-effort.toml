[[patches]]
name = "agent-ordinary-effort-2-1-266-darwin-arm64"
lineage = "agent-ordinary-effort"
target_version = "2.1.266"
applies_to = ">=2.1.266 <2.1.267"
platforms = ["darwin-arm64"]
rationale = "After 2.1.266 plugin rewriting, Darwin binds the selected definition as dt and fork state as en. Clone the definition only for ordinary agents before resolving its model."
rationale_ref = "reference/v2.1.88/sources/src/tools/AgentTool/AgentTool.tsx#L603-L635"
locator_kind = "ast_transform"
[patches.ast]
schema = 1
match = { node = "ObjectMethod", method_name = "call", strings = ["CLAUDE_CODE_COORDINATOR_FORCE_WORKER_INHERIT_MODEL", "subagent_launch", "makeStream", "agentDefinition"] }
[patches.transform]
op = "replace_substring"
find = '''let as=Rr?dt.color:void 0;if(as)Z$e(dt.agentType,as);let _o=en?"inherit":V,'''
value = '''let as=Rr?dt.color:void 0;if(as)Z$e(dt.agentType,as);if(patchedAgentEffort!==void 0&&!en)dt={...dt,effort:patchedAgentEffort};let _o=en?"inherit":V,'''
[[patches.tests]]
kind = "static"
name = "2.1.266 Darwin ordinary agents apply tool effort without changing forks"
assert_contains = '''if(patchedAgentEffort!==void 0&&!en)dt={...dt,effort:patchedAgentEffort};let _o=en?"inherit":V'''
assert_not_contains = '''if(patchedAgentEffort!==void 0&&!Wt)'''

