[patches.ast]
schema = 1
match = { node = "ObjectExpression", object_property_direct = "model", strings = ["Optional model override for this agent.", "Agents run in the background by default;"] }

[patches.ast.captures.enumeration]
kind = "identifier"
path = "callee"
select = { node = "CallExpression", source_regex = '''^[A-Za-z_$][A-Za-z0-9_$]*\(\["sonnet","opus","haiku","fable"\]\)$''' }

[patches.ast.captures.string]
kind = "identifier"
path = "properties.1.value.callee.object.callee"

[patches.ast.captures.coordinator]
kind = "identifier"
path = "test.callee"
select = { node = "ConditionalExpression", source_regex = '''^[A-Za-z_$][A-Za-z0-9_$]*\(\)\?''', string = "CLAUDE_CODE_COORDINATOR_FORCE_WORKER_INHERIT_MODEL" }

[patches.ast.captures.settings]
kind = "identifier"
path = "object"
select = { node = "MemberExpression", member_property = "CLAUDE_CODE_COORDINATOR_FORCE_WORKER_INHERIT_MODEL" }

[patches.transform]
op = "replace_substring_regex"
find = '''model:[A-Za-z_$][A-Za-z0-9_$]*\(\["sonnet","opus","haiku","fable"\]\)\.optional\(\)'''
value = '''effort:%%CAPTURE:enumeration%%(["low","medium","high","xhigh","max"]).optional().describe(`Optional effort override for this agent. Takes precedence over the agent definition's effort; otherwise the agent inherits its configured or parent effort. Ignored for fork agents.`+(%%CAPTURE:coordinator%%()&&%%CAPTURE:settings%%.CLAUDE_CODE_COORDINATOR_FORCE_WORKER_INHERIT_MODEL?" Unavailable on this session: this parameter is ignored — do not set it.":"")),model:%%CAPTURE:string%%().optional()'''

