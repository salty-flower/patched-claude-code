kind = "static"
name = "2.1.289 Darwin schema exposes current agent effort and custom model bindings"
assert_contains = '''effort:j(["low","medium","high","xhigh","max"]).optional().describe(`Optional effort override for this agent.'''
assert_not_contains = '''model:G(["sonnet","opus","haiku","fable"]).optional()'''

[[patches.tests]]
kind = "static"
name = "2.1.289 Darwin schema uses current coordinator guard"
assert_contains = '''(Ta()&&a.CLAUDE_CODE_COORDINATOR_FORCE_WORKER_INHERIT_MODEL?" Unavailable on this session'''
assert_not_contains = '''Zi()&&a.CLAUDE_CODE_COORDINATOR_FORCE_WORKER_INHERIT_MODEL'''

