locator_kind = "ast_transform"

[patches.ast]
schema = 1
match = { node = "ObjectExpression", object_property_direct = "effort", strings = ["Reasoning effort for this agent.", "Optional model override for this agent.", "Agents run in the background by default;"] }

[patches.ast.captures.coordinator]
kind = "identifier"
path = "test.callee"
select = { node = "ConditionalExpression", source_regex = '''^[A-Za-z_$][A-Za-z0-9_$]*\(\)\?''', string = "CLAUDE_CODE_COORDINATOR_FORCE_WORKER_INHERIT_MODEL" }

[patches.ast.captures.settings]
kind = "identifier"
path = "object"
select = { node = "MemberExpression", member_property = "CLAUDE_CODE_COORDINATOR_FORCE_WORKER_INHERIT_MODEL" }

[patches.transform]
op = "replace_substring_regex"
find = '''("Reasoning effort for this agent\.[^"]*")'''
value = '''$1+" Takes precedence over the agent definition's effort; otherwise the agent inherits its configured or parent effort."+(%%CAPTURE:coordinator%%()&&%%CAPTURE:settings%%.CLAUDE_CODE_COORDINATOR_FORCE_WORKER_INHERIT_MODEL?" Unavailable on this session: this parameter is ignored — do not set it.":"")'''

