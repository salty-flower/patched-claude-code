name = "agent-model-and-effort-schema-2-1-290-darwin-arm64"
lineage = "agent-model-and-effort-schema"
target_version = "2.1.290"
applies_to = ">=2.1.290 <2.1.291"
platforms = ["darwin-arm64"]
rationale = "Accept custom model IDs and explicit effort in the 2.1.290 Darwin subagent schema. Capture the current enum and string constructors, coordinator predicate, and settings namespace. Preserve target model descriptions and forced-inheritance behavior."
rationale_ref = "reference/v2.1.88/sources/src/tools/AgentTool/AgentTool.tsx#L81-L88"
locator_kind = "ast_transform"

[patches.ast]
schema = 1
match = { node = "ObjectExpression", object_property_direct = "model", strings = ["Optional model override for this agent.", "Agents run in the background by default;"] }

[patches.ast.captures.enumeration]
kind = "identifier"
path = "callee"
select = { node = "CallExpression", source_regex = '''^[A-Za-z_$][A-Za-z0-9_$]*\(\["sonnet","opus","haiku","fable"\]\)$''' }

[patches.ast.captures.string]
kind = "identifier"
path = "properties.1.value.callee.object.callee"

[patches.ast.captures.coordinator]
kind = "identifier"
path = "test.callee"
select = { node = "ConditionalExpression", source_regex = '''^[A-Za-z_$][A-Za-z0-9_$]*\(\)\?''', string = "CLAUDE_CODE_COORDINATOR_FORCE_WORKER_INHERIT_MODEL" }

[patches.ast.captures.settings]
kind = "identifier"
path = "object"
select = { node = "MemberExpression", member_property = "CLAUDE_CODE_COORDINATOR_FORCE_WORKER_INHERIT_MODEL" }

[patches.transform]
op = "replace_substring_regex"
find = '''model:[A-Za-z_$][A-Za-z0-9_$]*\(\["sonnet","opus","haiku","fable"\]\)\.optional\(\)'''
value = '''effort:%%CAPTURE:enumeration%%(["low","medium","high","xhigh","max"]).optional().describe(`Optional effort override for this agent. Takes precedence over the agent definition's effort; otherwise the agent inherits its configured or parent effort. Ignored for fork agents.`+(%%CAPTURE:coordinator%%()&&%%CAPTURE:settings%%.CLAUDE_CODE_COORDINATOR_FORCE_WORKER_INHERIT_MODEL?" Unavailable on this session: this parameter is ignored — do not set it.":"")),model:%%CAPTURE:string%%().optional()'''

[[patches.tests]]
kind = "static"
name = "2.1.290 Darwin schema exposes current agent effort and custom model bindings"
assert_contains = '''effort:G(["low","medium","high","xhigh","max"]).optional().describe(`Optional effort override for this agent.'''
assert_not_contains = '''model:G(["sonnet","opus","haiku","fable"]).optional()'''

[[patches.tests]]
kind = "static"
name = "2.1.290 Darwin schema uses the current custom model string builder"
assert_contains = '''model:o().optional().describe(`Optional model override for this agent.'''

[[patches.tests]]
kind = "static"
name = "2.1.290 Darwin schema uses current coordinator guard"
assert_contains = '''(ra()&&a.CLAUDE_CODE_COORDINATOR_FORCE_WORKER_INHERIT_MODEL?" Unavailable on this session'''
assert_not_contains = '''Ta()&&a.CLAUDE_CODE_COORDINATOR_FORCE_WORKER_INHERIT_MODEL'''

