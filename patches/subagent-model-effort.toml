[[patches]]
name = "coordinator-agent-override-guidance"
rationale = """
Keep coordinator instructions aligned with the Agent schema and runtime precedence.
Ordinary coordinator sessions may use explicit model and effort when the user requests them; forced-inheritance sessions ignore both, while model-only force still permits effort.
The upstream prompt distinguishes only model, leaving effort undocumented or incorrectly available under coordinator inheritance force.
