find = '''${a.CLAUDE_CODE_SUBAGENT_MODEL_FORCE?"":"; the `model` parameter here overrides the definition for this one call"}'''
value = '''${a.CLAUDE_CODE_SUBAGENT_MODEL_FORCE?"; the `effort` parameter here overrides the definition's reasoning effort for this one call":"; the `model` and `effort` parameters here override the definition for this one call"}'''

[[patches.tests]]
