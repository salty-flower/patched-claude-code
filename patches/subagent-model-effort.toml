value = '''a.CLAUDE_CODE_COORDINATOR_FORCE_WORKER_INHERIT_MODEL?"- The model and effort parameters are ignored on this session. Do not set them.":a.CLAUDE_CODE_SUBAGENT_MODEL_FORCE?"- The model parameter is ignored on this session. Do not set it. The effort parameter remains available for a per-call override.":'''

