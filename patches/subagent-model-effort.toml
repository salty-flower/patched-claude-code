match = { node = "ObjectExpression", object_property_direct = "model", strings = ["Optional model override for this agent.", "Agents run in the background by default;"] }
[patches.transform]
op = "replace_substring"
find = '''model:Y(["sonnet","opus","haiku","fable"]).optional()'''
value = '''effort:Y(["low","medium","high","xhigh","max"]).optional().describe(`Optional effort override for this agent. Takes precedence over the agent definition's effort; otherwise the agent inherits its configured or parent effort. Ignored for fork agents.`+(xi()&&a.CLAUDE_CODE_COORDINATOR_FORCE_WORKER_INHERIT_MODEL?" Unavailable on this session: this parameter is ignored — do not set it.":"")),model:s().optional()'''
[[patches.tests]]
kind = "static"
name = "2.1.266 Darwin Agent schema accepts custom models and effort"
assert_contains = '''effort:Y(["low","medium","high","xhigh","max"]).optional().describe(`Optional effort override for this agent.'''
assert_not_contains = '''effort:X(["low","medium","high","xhigh","max"])'''

