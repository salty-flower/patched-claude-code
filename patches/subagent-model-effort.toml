[[patches]]
name = "agent-prompt-fork-overrides"
rationale = """
Keep the fork guidance aligned with runtime: forks ignore both model and effort overrides.
The upstream prompt mentions model only, which can make the new effort field look effective on forks even though runAgent deliberately preserves parent context.
