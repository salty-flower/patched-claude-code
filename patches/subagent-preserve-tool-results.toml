name = "subagent-preserve-tool-results"
target_version = "2.1.133"
applies_to = ">=2.1.133 <2.2.0"

rationale = """
Preserve nested subagent tool results for viewable transcripts.

The subagent runner already supports preserving toolUseResult payloads, but the
flag is opt-in and many subagent paths still drop nested tool outputs before
the transcript UI can render them. Patched bundles enable the existing
preservation knob for all subagents so expanded transcripts show nested tool
I/O instead of only assistant tool-use rows. Cleanup condition: upstream makes
subagent transcript I/O visible by default or exposes an official transcript
visibility setting.
"""
rationale_ref = "reference/v2.1.88/sources/src/tools/AgentTool/runAgent.ts#L716-L719"

locator_pattern = '''if(j)ZH.preserveToolUseResults=!0'''
locator_kind = "literal"
expected_matches = 1

replacement = '''ZH.preserveToolUseResults=!0'''

[[tests]]
kind = "static"
name = "replacement is rendered"
assert_contains = '''ZH.preserveToolUseResults=!0'''
