name = "suppress-npm-native-installer-warning"
target_version = "2.1.133"
applies_to = ">=2.1.133 <2.1.227"

rationale = """
Suppress the npm-to-native-installer startup warning.

The upstream startup notification tells npm-wrapper users to migrate to the
native installer on every eligible startup. Patched bundles are deliberately
distributed through this repo's own wrapper and release process, so the
warning is noisy and not actionable for this installation path. Cleanup
condition: upstream stops showing this warning for wrapper-managed or
third-party-packaged launches, or the patched release pipeline switches to an
upstream-supported native installer package.

Cleanup condition met in 2.1.227: upstream removed the npm-to-native-installer
deprecation warning entirely. The 2.1.227 bundle contains no `npm-deprecation`
string (setup-card id, notification key lineage, and the
"npm-deprecation check failed" error log are all absent), no `npmInstallDeprecated`
state field, and no "Installed via npm (deprecated)" card title; the setup-card
id census is identical to 2.1.221 minus the `npm-deprecation` card. The
`sudo-npm-install` notice and auto-update npm diagnostics that do survive in
2.1.227 are separate pre-existing features untouched by this patch. All entries
below are therefore capped at <2.1.227 and no 2.1.227 variant exists.
"""
[[patches]]
name = "suppress-npm-native-installer-warning-compute"
applies_to = ">=2.1.133 <2.1.227"
rationale_ref = "reference/v2.1.88/sources/src/hooks/notifs/useNpmDeprecationNotification.tsx#L9-L23"
locator_kind = "ast_transform"

[patches.ast]
schema = 1
match = { node = "ObjectExpression", string_literal = "npm-deprecation" }

[patches.transform]
op = "set_object_property"
property = "compute"
value = "async()=>null"

[[patches.tests]]
kind = "static"
name = "npm deprecation notification remains targeted"
assert_contains = '''id:"npm-deprecation"'''

[[patches.tests]]
kind = "static"
name = "replacement compute is rendered"
assert_contains = '''compute:async()=>null'''

[[patches]]
name = "suppress-npm-native-installer-warning-setup-card-2-1-168"
applies_to = ">=2.1.168 <2.1.186"
rationale = """
Suppress the startup setup-issue card for the npm-to-native-installer warning.

In 2.1.168 the warning can still render from setup issue state even after the
notification compute hook is disabled. Patched bundles are intentionally
distributed through this repo's wrapper and release pipeline, so the native
installer migration prompt remains noisy and unactionable for this path.
Cleanup condition: upstream stops showing this warning for wrapper-managed or
third-party-packaged launches, or the patched release pipeline switches to an
upstream-supported native installer package.
"""
rationale_ref = "reference/v2.1.88/sources/src/hooks/notifs/useNpmDeprecationNotification.tsx#L9-L23"
locator_kind = "ast_transform"

[patches.ast]
schema = 1
match = { node = "ObjectExpression", string_literal = "Installed via npm (deprecated)" }

[patches.transform]
op = "set_object_property"
property = "isActive"
value = "()=>!1"

[[patches.tests]]
kind = "static"
name = "npm setup card remains targeted in 2.1.168"
assert_contains = '''id:"npm-deprecation"'''

[[patches.tests]]
kind = "static"
name = "npm setup card is inactive in 2.1.168"
assert_contains = '''isActive:()=>!1,render:()=>'''

[[patches]]
name = "suppress-npm-native-installer-warning-setup-card-2-1-186"
applies_to = ">=2.1.186 <2.1.227"
rationale = """
Suppress the startup setup-issue card for the npm-to-native-installer warning.

This is the 2.1.186 minified-symbol variant. The rendered title also appears
inside nested JSX props in this bundle, so this locator targets the outer
setup-issue object by its `npm-deprecation` id.

Retired at 2.1.227: upstream removed the `npm-deprecation` setup card (and the
whole npm-to-native-installer deprecation warning) from the bundle, so no
2.1.227 variant exists.
"""
rationale_ref = "reference/v2.1.88/sources/src/hooks/notifs/useNpmDeprecationNotification.tsx#L9-L23"
locator_kind = "ast_transform"

[patches.ast]
schema = 1
match = { node = "ObjectExpression", string = '''id:"npm-deprecation"''' }

[patches.transform]
op = "set_object_property"
property = "isActive"
value = "()=>!1"

[[patches.tests]]
kind = "static"
name = "npm setup card remains targeted in 2.1.186"
assert_contains = '''id:"npm-deprecation"'''

[[patches.tests]]
kind = "static"
name = "npm setup card is inactive in 2.1.186"
assert_contains = '''isActive:()=>!1,render:()=>'''
