name = "suppress-npm-native-installer-warning"
target_version = "2.1.133"
applies_to = ">=2.1.133 <2.2.0"

rationale = """
Suppress the npm-to-native-installer startup warning.

The upstream startup notification tells npm-wrapper users to migrate to the
native installer on every eligible startup. Patched bundles are deliberately
distributed through this repo's own wrapper and release process, so the
warning is noisy and not actionable for this installation path. Cleanup
condition: upstream stops showing this warning for wrapper-managed or
third-party-packaged launches, or the patched release pipeline switches to an
upstream-supported native installer package.
"""
rationale_ref = "reference/v2.1.88/sources/src/hooks/notifs/useNpmDeprecationNotification.tsx#L9-L23"

locator_kind = "ast_transform"

[ast]
schema = 1
match = { node = "ObjectExpression", string_literal = "npm-deprecation" }

[transform]
op = "set_object_property"
property = "compute"
value = "async()=>null"

[[tests]]
kind = "static"
name = "replacement is rendered"
assert_contains = '''{id:"npm-deprecation",compute:async()=>null}'''
