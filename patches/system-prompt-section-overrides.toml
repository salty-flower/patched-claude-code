schema = 1
match = { node = "ReturnStatement", parent_node = "BlockStatement", source = "return $c" }

[patches.transform]
op = "replace_node"
value = 'return ((body)=>(globalThis[Symbol.for("patched-claude-code.system-prompt-overrides.request.v2")]?.(body,J.querySource),body))($c)'

[[patches.tests]]
kind = "static"
name = "final request diagnostic preserves linux-x64 request object"
assert_contains = '?.(body,J.querySource),body))($c)'

[[patches.tests]]
kind = "static"
name = "304 Linux diagnostic excludes stale 301 request binding"
assert_not_contains = '?.(body,Q.querySource),body))(Rp)'
