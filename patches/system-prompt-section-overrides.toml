[[patches]]
name = "system-prompt-section-override-bridge-2-1-290"
target_version = "2.1.290"
applies_to = ">=2.1.290 <2.1.291"
rationale = """
The target now composes structured sections through the native prompt.compose resolver before converting them to the ordered text vector. The target additionally maps each converted section through its native prompt-string deletion function. Wrap the final map result so native composition and fallback retain ownership, while the original repo helper receives the same text-vector contract. Both platform graphs resolve $Un to the local structured-section conversion function; inserted code introduces no bundle-local symbols.
"""
rationale_ref = "reference/v2.1.88/sources/src/constants/prompts.ts#L444-L576"
locator_kind = "ast_transform"

[patches.ast]
schema = 1
match = { node = "CallExpression", callee_property = "map", parent_node = "ReturnStatement", source_regex = "^\\$Un\\(s,[A-Za-z_$][A-Za-z0-9_$]*\\(\\)\\?[A-Za-z_$][A-Za-z0-9_$]*:null\\)\\.map\\(" }

[patches.transform]
op = "wrap_expression"
template = '((orderedSections)=>globalThis[Symbol.for("patched-claude-code.system-prompt-overrides.v1")]?.({orderedSections})?.effectiveSections??orderedSections)(%%EXPR%%)'

[[patches.tests]]
kind = "static"
name = "native composed prompt vector crosses the override bridge"
assert_contains = 'Symbol.for("patched-claude-code.system-prompt-overrides.v1")'
