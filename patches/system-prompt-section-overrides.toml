[[patches]]
name = "system-prompt-section-override-bridge-2-1-289"
target_version = "2.1.289"
applies_to = ">=2.1.289 <2.1.290"
rationale = """
The target now composes structured sections through the native prompt.compose resolver before converting them to the ordered text vector. Wrap that final conversion result so native composition and fallback retain ownership, while the original repo helper receives the same text-vector contract. Both platform graphs resolve UDn to the local structured-section conversion function; inserted code introduces no bundle-local symbols.
"""
rationale_ref = "reference/v2.1.88/sources/src/constants/prompts.ts#L444-L576"
locator_kind = "ast_transform"

[patches.ast]
schema = 1
match = { node = "CallExpression", callee_property = "UDn", parent_node = "ReturnStatement", source_regex = "^UDn\\(s,[A-Za-z_$][A-Za-z0-9_$]*\\(\\)\\?[A-Za-z_$][A-Za-z0-9_$]*:null\\)$" }

[patches.transform]
op = "wrap_expression"
template = '((orderedSections)=>globalThis[Symbol.for("patched-claude-code.system-prompt-overrides.v1")]?.({orderedSections})?.effectiveSections??orderedSections)(%%EXPR%%)'

[[patches.tests]]
kind = "static"
name = "native composed prompt vector crosses the override bridge"
assert_contains = 'Symbol.for("patched-claude-code.system-prompt-overrides.v1")'

[[patches]]
name = "system-prompt-section-override-bridge-2-1-293-darwin"
target_version = "2.1.293"
applies_to = ">=2.1.293 <2.1.294"
platforms = ["darwin-arm64"]
rationale = """
Wrap the 2.1.293 Darwin central structured-section conversion after upstream
composition and local prompt-string deletion. The final map result remains the
same ordered text vector when the bridge is absent, and the replacement adds
no bundle-local identifiers. Keep this exact-version range until the central
main-session seam is re-proved on a later target.
"""
rationale_ref = "reference/v2.1.88/sources/src/constants/prompts.ts#L444-L576"
locator_kind = "ast_transform"
expected_matches = 1

  [patches.ast]
  schema = 1
  match = { node = "CallExpression", callee_property = "map", parent_node = "ReturnStatement", source_regex = "^hzn\\(s,Qle\\(\\)\\?i0:null\\)\\.map\\(" }

  [patches.transform]
  op = "wrap_expression"
  template = '((orderedSections)=>globalThis[Symbol.for("patched-claude-code.system-prompt-overrides.v1")]?.({orderedSections})?.effectiveSections??orderedSections)(%%EXPR%%)'

  [[patches.tests]]
  kind = "static"
  name = "2.1.293 Darwin central prompt vector crosses the override bridge"
  assert_contains = 'Symbol.for("patched-claude-code.system-prompt-overrides.v1")'

  [[patches.tests]]
  kind = "static"
  name = "2.1.293 Darwin bridge preserves the current final conversion bindings"
  assert_contains = '''hzn(s,Qle()?i0:null).map((g)=>pEe(g))'''

  [[patches.tests]]
  kind = "static"
  name = "2.1.293 Darwin bridge rejects the stale 2.1.290 conversion helper"
  assert_not_contains = '''$Un(s,'''

