target_version = "2.1.146"
applies_to = ">=2.1.146 <2.1.150"

rationale = """
Render only the latest thinking block outside transcript or verbose mode.

This is the 2.1.146 minified-symbol variant of `thinking-render-blocks`.
Cleanup condition: upstream exposes an official interactive display setting
for latest-thinking blocks.
"""
rationale_ref = "reference/v2.1.88/sources/src/components/Message.tsx#L524-L548"

locator_kind = "ast_transform"

[patches.ast]
schema = 1
match = { node = "SwitchCase", strings = ['case"thinking":{if(!M&&!z)return null;', "return null;let "] }

[patches.transform]
op = "replace_substring_regex"
find = "if\\(!M&&!z\\)return null;let ([A-Za-z_$][A-Za-z0-9_$]*)=M&&!\\(!P\\|\\|X===P\\)"
value = "if(!1)return null;let $1=!M&&!z&&!(!P||X===P)"

[[patches.tests]]
kind = "static"
name = "normal rendering keeps only latest thinking in 2.1.146"
assert_contains = '''case"thinking":{if(!1)return null;let'''

[[patches.tests]]
kind = "static"
name = "redacted thinking stays detailed-only in 2.1.146"
assert_contains = '''case"redacted_thinking":{if(!M&&!z)return null;'''

