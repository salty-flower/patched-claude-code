name = "thinking-display"
target_version = "2.1.133"
applies_to = ">=2.1.133 <2.2.0"

rationale = """
Group the ordered thinking display patches for live streaming, main-screen wiring, completion cleanup, normal rendering, and expanded bodies.
"""
[[patches]]
name = "thinking-render-live-stream"
target_version = "2.1.133"
applies_to = ">=2.1.133 <2.2.0"

rationale = """
Render thinking deltas while the current API response is still streaming.

The reference stream handler recognizes thinking_delta events only for
spinner state and response-length accounting, then waits until the thinking
content block completes before exposing text to the transcript renderer. For
the patched inspection build, live summary text should flow into the existing
streamingThinking render path as deltas arrive, without changing API request
construction or transport behavior.

Cleanup condition: upstream renders thinking_delta content live in the
interactive UI.
"""
rationale_ref = "reference/v2.1.88/sources/src/utils/messages.ts#L2995-L3077"

locator_kind = "ast_transform"

[patches.ast]
schema = 1
match = { node = "SwitchCase", string_literal = "thinking_delta", source = '''case"thinking_delta":return;''' }

[patches.transform]
op = "replace_node"
value = '''case"thinking_delta":{let w=H.event.delta.thinking;K(w.length),z?.((J)=>({thinking:(J?.thinking??"")+w,isStreaming:!0}));return}'''

[[patches.tests]]
kind = "static"
name = "thinking deltas update streaming thinking"
assert_contains = '''z?.((J)=>({thinking:(J?.thinking??"")+w,isStreaming:!0}))'''

[[patches]]
name = "thinking-render-live-main"
target_version = "2.1.133"
applies_to = ">=2.1.133 <2.1.137"

rationale = """
Pass live thinking state to the main interactive message renderer.

The reference REPL threads streamingThinking into the transcript renderer but
not the normal main-screen renderer, so thinking_delta chunks can update state
without appearing outside Ctrl-O. For the patched inspection build, the main
message list should receive the same live buffer as transcript mode, while
leaving API streaming and request construction unchanged.

Cleanup condition: upstream renders live thinking summaries on the main
interactive screen.
"""
rationale_ref = "reference/v2.1.88/sources/src/screens/REPL.tsx#L4570-L4570"

locator_kind = "ast_transform"

[patches.ast]
schema = 1
match = { node = "ObjectExpression", object_property_direct = "streamingText" }

[patches.transform]
op = "set_object_property"
property = "streamingThinking"
value = "S4"

[[patches.tests]]
kind = "static"
name = "main message renderer receives live thinking"
assert_contains = '''streamingThinking:'''

[[patches]]
name = "thinking-render-live-main-2-1-137"
target_version = "2.1.137"
applies_to = ">=2.1.137 <2.2.0"

rationale = """
Pass live thinking state to the main interactive message renderer.

This is the 2.1.137 minified-symbol variant of `thinking-render-live-main`.
Cleanup condition: upstream renders live thinking summaries on the main
interactive screen.
"""
rationale_ref = "reference/v2.1.88/sources/src/screens/REPL.tsx#L4570-L4570"

locator_kind = "ast_transform"

[patches.ast]
schema = 1
match = { node = "ObjectExpression", object_property_direct = "streamingText" }

[patches.transform]
op = "set_object_property"
property = "streamingThinking"
value = "r4"

[[patches.tests]]
kind = "static"
name = "main message renderer receives live thinking in 2.1.137"
assert_contains = '''streamingThinking:'''

[[patches]]
name = "thinking-render-live-complete"
target_version = "2.1.133"
applies_to = ">=2.1.133 <2.2.0"

rationale = """
Clear the live thinking buffer when a completed thinking block is appended.

The reference handler mirrors completed thinking into streamingThinking for
30 seconds so transcript mode can briefly show the latest summary. Once live
thinking deltas are rendered through the same buffer, that mirror duplicates
the completed transcript block in detailed views. Clearing the transient
buffer at completion keeps live rendering during the stream and leaves the
completed assistant block as the single post-stream rendering.

Cleanup condition: upstream reconciles live thinking deltas with completed
thinking block rendering in the interactive UI.
"""
rationale_ref = "reference/v2.1.88/sources/src/utils/messages.ts#L2963-L2974"

locator_kind = "ast_transform"

[patches.ast]
schema = 1
match = { node = "OptionalCallExpression", string = "streamingEndedAt:Date.now()" }

[patches.transform]
op = "set_call_arg"
index = 0
value = "()=>null"

[[patches.tests]]
kind = "static"
name = "completed thinking clears live buffer"
assert_contains = '''type==="thinking")z?.(()=>null)'''

[[patches.tests]]
kind = "static"
name = "completed thinking no longer mirrors for thirty seconds"
assert_not_contains = '''z?.(()=>({thinking:w.thinking,isStreaming:!1,streamingEndedAt:Date.now()}))'''

[[patches]]
name = "thinking-render-blocks"
target_version = "2.1.133"
applies_to = ">=2.1.133 <2.2.0"

rationale = """
Render only the latest thinking block outside transcript or verbose mode.

The reference UI drops thinking blocks in normal rendering unless the session
is in transcript mode or verbose mode, while already tracking the latest
thinking block for transcript filtering. For a patched inspection build,
normal interactive rendering should stream the current thinking block without
changing request construction, and detailed rendering should still expand the
full thinking history.

Cleanup condition: upstream exposes an official interactive display setting
for latest-thinking blocks.
"""
rationale_ref = "reference/v2.1.88/sources/src/components/Message.tsx#L524-L548"

locator_kind = "ast_transform"

[patches.ast]
schema = 1
match = { node = "SwitchCase", string = 'case"thinking":{if(!D&&!A)return null' }

[patches.transform]
op = "replace_substring"
find = "if(!D&&!A)return null;let k=D&&!(!P||X===P)"
value = "if(!1)return null;let k=!D&&!A&&!(!P||X===P)"

[[patches.tests]]
kind = "static"
name = "normal rendering keeps only latest thinking"
assert_contains = '''if(!1)return null;let k=!D&&!A&&!(!P||X===P)'''

[[patches.tests]]
kind = "static"
name = "redacted thinking stays detailed-only"
assert_contains = '''case"redacted_thinking":{if(!D&&!A)return null;'''

[[patches.tests]]
kind = "static"
name = "old normal-mode all-thinking override is absent"
assert_not_contains = '''case"redacted_thinking":{if(!1)return null;'''

[[patches]]
name = "thinking-render-expanded"
target_version = "2.1.133"
applies_to = ">=2.1.133 <2.2.0"

rationale = """
Show full thinking message bodies in the patched interactive UI.

The reference thinking component hides older transcript thinking blocks and
collapses normal-mode thinking behind the Ctrl-O affordance. Since the
patched build is for inspection, the block body should render directly
whenever the message renderer receives it.

Cleanup condition: upstream exposes an official display setting that expands
thinking content in interactive mode.
"""
rationale_ref = "reference/v2.1.88/sources/src/components/messages/AssistantThinkingMessage.tsx#L36-L45"

locator_kind = "ast_transform"

[patches.ast]
schema = 1
match = { node = "IfStatement", string = "if(!(O||T))" }

[patches.transform]
op = "replace_substring"
find = "if(!(O||T))"
value = "if(!1)"

[[patches.tests]]
kind = "static"
name = "replacement is rendered"
assert_contains = '''if(Y)return null;if(!1)'''
