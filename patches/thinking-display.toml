rationale = """
Render only the latest thinking block outside transcript or verbose mode.

The reference UI drops thinking blocks in normal rendering unless the session
is in transcript mode or verbose mode, while already tracking the latest
thinking block for transcript filtering. For a patched inspection build,
normal interactive rendering should stream the current thinking block without
changing request construction, and detailed rendering should still expand the
full thinking history.

Cleanup condition: upstream exposes an official interactive display setting
for latest-thinking blocks.
