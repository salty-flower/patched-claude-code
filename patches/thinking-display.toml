[[patches]]
name = "thinking-render-live-delta-2-1-263-darwin"
target_version = "2.1.263"
applies_to = ">=2.1.263 <2.2.0"
platforms = ["darwin-arm64"]
rationale = "The 2.1.263 Darwin stream handler is `aut`; its options object is `t`, current delta is `F`, API metrics callback is `d`, and fallback estimator is `chn`, so live text must update `t.onStreamingThinking`."
rationale_ref = "reference/v2.1.88/sources/src/utils/messages.ts#L2995-L3077"
locator_kind = "ast_transform"
[patches.ast]
schema = 1
match = { node = "FunctionDeclaration", function_name = "aut", strings = ["authoringProgressSurface", "thinking_delta", "onStreamingText"] }
[patches.transform]
op = "replace_substring"
find = '''case"thinking_delta":{let{delta:F}=e.event;if("estimated_tokens"in F&&typeof F.estimated_tokens==="number")d?.({type:"thinking_progress",estimatedTokensDelta:F.estimated_tokens})'''
value = '''case"thinking_delta":{let{delta:F}=e.event,w=typeof F.thinking==="string"?F.thinking:"";if(w)t.onStreamingThinking?.((j)=>({thinking:(j?.thinking??"")+w,isStreaming:!0}));if("estimated_tokens"in F&&typeof F.estimated_tokens==="number")d?.({type:"thinking_progress",estimatedTokensDelta:F.estimated_tokens})'''
[[patches.tests]]
kind = "static"
name = "2.1.263 Darwin thinking deltas update live state"
assert_contains = '''case"thinking_delta":{let{delta:F}=e.event,w=typeof F.thinking==="string"?F.thinking:"";if(w)t.onStreamingThinking?.'''


[[patches.tests]]
kind = "static"
name = "2.1.260 Darwin thinking-display inserted symbols are absent"
assert_not_contains = '''case"thinking_delta":{let{delta:U}=e.event,w=typeof U.thinking==="string"?U.thinking:"";if(w)n.onStreamingThinking?.((j)=>({thinking:(j?.thinking??"")+w,isStreaming:!0}));if("estimated_tokens"in U&&typeof U.estimated_tokens==="number")d?.({type:"thinking_progress",estimatedTokensDelta:U.estimated_tokens})'''

