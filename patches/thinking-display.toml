[[patches]]
name = "thinking-render-blocks-2-1-168"
target_version = "2.1.168"
applies_to = ">=2.1.168 <2.2.0"

rationale = """
Render thinking blocks outside transcript or verbose mode.

This is the 2.1.168 minified-symbol variant of
`thinking-render-blocks`. The upstream renderer no longer receives the
latest-thinking block identifier or threads a `hideInTranscript` prop through
the thinking component, so the patch restores normal-mode thinking rendering
at the thinking block gate while keeping redacted thinking detailed-only.

Cleanup condition: upstream exposes an official interactive display setting
for latest-thinking blocks.
"""
rationale_ref = "reference/v2.1.88/sources/src/components/Message.tsx#L524-L548"

locator_kind = "ast_transform"

[patches.ast]
schema = 1
match = { node = "SwitchCase", strings = ['case"thinking":{if(!f&&!$)return null;let k;', 'B5.createElement(rk6,{addMargin:K,param:q,isTranscriptMode:f,verbose:$})'] }

[patches.transform]
op = "replace_substring"
find = '''case"thinking":{if(!f&&!$)return null;let k;'''
value = '''case"thinking":{if(!1)return null;let k;'''

[[patches.tests]]
kind = "static"
name = "normal rendering keeps thinking in 2.1.168"
assert_contains = '''case"thinking":{if(!1)return null;let k;'''

[[patches.tests]]
kind = "static"
name = "redacted thinking stays detailed-only in 2.1.168"
assert_contains = '''case"redacted_thinking":{if(!f&&!$)return null;'''

[[patches]]
name = "thinking-render-expanded"
target_version = "2.1.133"
applies_to = ">=2.1.133 <2.1.156"

rationale = """
Show full thinking message bodies in the patched interactive UI.

The reference thinking component hides older transcript thinking blocks and
collapses normal-mode thinking behind the Ctrl-O affordance. Since the
patched build is for inspection, the block body should render directly
whenever the message renderer receives it.

Cleanup condition: upstream exposes an official display setting that expands
thinking content in interactive mode.
"""
rationale_ref = "reference/v2.1.88/sources/src/components/messages/AssistantThinkingMessage.tsx#L36-L45"

locator_kind = "ast_transform"

[patches.ast]
schema = 1
match = { node = "IfStatement", string = "if(!(O||T))" }

[patches.transform]
op = "replace_substring"
find = "if(!(O||T))"
value = "if(!1)"

[[patches.tests]]
kind = "static"
name = "replacement is rendered"
assert_contains = '''if(Y)return null;if(!1)'''

[[patches]]
name = "thinking-render-expanded-2-1-156"
target_version = "2.1.156"
applies_to = ">=2.1.156 <2.1.168"

rationale = """
Show full thinking message bodies in the patched interactive UI.

This is the 2.1.156 component variant of `thinking-render-expanded`. The
component now branches between full and compact thinking text through a local
`w` flag instead of an early return.

Cleanup condition: upstream exposes an official display setting that expands
thinking content in interactive mode.
"""
rationale_ref = "reference/v2.1.88/sources/src/components/messages/AssistantThinkingMessage.tsx#L36-L45"

locator_kind = "ast_transform"

[patches.ast]
schema = 1
match = { node = "FunctionDeclaration", string = "hideInTranscript", strings = ["z.trim().replace", "let w=O||T"] }

[patches.transform]
op = "replace_substring"
find = "let w=O||T,j=Y?1:0"
value = "let w=!0,j=Y?1:0"

[[patches.tests]]
kind = "static"
name = "replacement is rendered in 2.1.156"
assert_contains = '''let w=!0,j=Y?1:0'''

[[patches]]
name = "thinking-render-expanded-2-1-168"
target_version = "2.1.168"
applies_to = ">=2.1.168 <2.2.0"

rationale = """
Show full thinking message bodies in the patched interactive UI.

This is the 2.1.168 thinking component variant. The old collapsed-body
early-return gate is gone, but normal-mode rendering still chooses a compact
single-line body when neither transcript nor verbose mode is active. The
patch forces the full body path whenever the message renderer receives a
thinking block.

Cleanup condition: upstream exposes an official display setting that expands
thinking content in interactive mode.
"""
rationale_ref = "reference/v2.1.88/sources/src/components/messages/AssistantThinkingMessage.tsx#L36-L45"

locator_kind = "ast_transform"

[patches.ast]
schema = 1
match = { node = "FunctionDeclaration", function_name = "rk6", strings = ['{thinking:$}=q', '$.trim().replace(/\s+/g," ")'] }

[patches.transform]
op = "replace_substring"
find = '''let A=O||T,Y=z?1:0,w;'''
value = '''let A=!0,Y=z?1:0,w;'''

[[patches.tests]]
kind = "static"
name = "thinking body uses expanded render path in 2.1.168"
assert_contains = '''let A=!0,Y=z?1:0,w;'''

[[patches.tests]]
kind = "static"
name = "thinking body no longer depends on transcript or verbose mode in 2.1.168"
assert_not_contains = '''let A=O||T,Y=z?1:0,w;'''
