name = "thinking-render-live-complete"
target_version = "2.1.132"
applies_to = ">=2.1.132 <2.2.0"

rationale = """
Clear the live thinking buffer when a completed thinking block is appended.

The reference handler mirrors completed thinking into streamingThinking for
30 seconds so transcript mode can briefly show the latest summary. Once live
thinking deltas are rendered through the same buffer, that mirror duplicates
the completed transcript block in detailed views. Clearing the transient
buffer at completion keeps live rendering during the stream and leaves the
completed assistant block as the single post-stream rendering.

Cleanup condition: upstream reconciles live thinking deltas with completed
thinking block rendering in the interactive UI.
"""
rationale_ref = "reference/v2.1.88/sources/src/utils/messages.ts#L2963-L2974"

locator_pattern = '''z?.(()=>({thinking:w.thinking,isStreaming:!1,streamingEndedAt:Date.now()}))'''
locator_kind = "literal"
expected_matches = 1

replacement = '''z?.(()=>null)'''

[[tests]]
kind = "static"
name = "completed thinking clears live buffer"
assert_contains = '''if(w&&w.type==="thinking")z?.(()=>null)'''

[[tests]]
kind = "static"
name = "completed thinking no longer mirrors for thirty seconds"
assert_not_contains = '''z?.(()=>({thinking:w.thinking,isStreaming:!1,streamingEndedAt:Date.now()}))'''
