name = "thinking-render-live-stream"
target_version = "2.1.133"
applies_to = ">=2.1.133 <2.2.0"

rationale = """
Render thinking deltas while the current API response is still streaming.

The reference stream handler recognizes thinking_delta events only for
spinner state and response-length accounting, then waits until the thinking
content block completes before exposing text to the transcript renderer. For
the patched inspection build, live summary text should flow into the existing
streamingThinking render path as deltas arrive, without changing API request
construction or transport behavior.

Cleanup condition: upstream renders thinking_delta content live in the
interactive UI.
"""
rationale_ref = "reference/v2.1.88/sources/src/utils/messages.ts#L2995-L3077"

locator_pattern = '''case"thinking_delta":return;'''
locator_kind = "literal"
expected_matches = 1

replacement = '''case"thinking_delta":{let w=H.event.delta.thinking;K(w.length),z?.((J)=>({thinking:(J?.thinking??"")+w,isStreaming:!0}));return}'''

[[tests]]
kind = "static"
name = "thinking deltas update streaming thinking"
assert_contains = '''z?.((J)=>({thinking:(J?.thinking??"")+w,isStreaming:!0}))'''
