name = "thinking-request-summaries"
target_version = "2.1.132"
applies_to = ">=2.1.132 <2.2.0"

rationale = """
Request visible thinking summaries instead of redacted thinking stubs.

The reference documents a first-party beta that skips API-side thinking
summaries for interactive users and returns redacted_thinking blocks unless
showThinkingSummaries is enabled. For a patched inspection build, the useful
default is visible summarized thinking, not opaque redaction placeholders.

Cleanup condition: upstream exposes a stable CLI or settings switch that
requests thinking summaries for local interactive use.
"""
rationale_ref = "reference/v2.1.88/sources/src/utils/betas.ts#L264-L277"

locator_pattern = '''if\(O&&e19\(H\)&&!N8\(\)&&u8\(\)\.showThinkingSummaries!==!0\)_\.push\(Tu_\)'''
locator_kind = "regex"
expected_matches = 1

replacement = "if(!1)_.push(Tu_)"

[[tests]]
kind = "static"
name = "replacement is rendered"
assert_contains = '''if(!1)_.push(Tu_)'''
