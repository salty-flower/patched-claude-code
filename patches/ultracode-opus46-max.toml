value = '''let oa=kG($s)?"xhigh":uHe($s)&&Tqe("max",$s)?"max":"high";if(Ro.ultracode===ai&&(!ai||Ro.effortValue===oa))return Ro;return{...Ro,ultracode:ai,effortValue:ai?oa:Ro.effortValue}'''

