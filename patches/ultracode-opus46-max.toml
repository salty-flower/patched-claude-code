[[patches]]
name = "ultracode-settings-report-max-fallback"
target_version = "2.1.197"
applies_to = ">=2.1.197 <2.1.198"
rationale = """
Report ultracode as active when its effective Opus 4.6 effort is max.

The v2.1.197 settings report only treats ultracode as active when the resolved
effort is xhigh. After Opus 4.6 falls back to max, settings consumers should
still see ultracode as active while the ultracode flag is true. Cleanup
condition: upstream reports ultracode independently from the exact compatible
effort string.
"""
rationale_ref = "reference/v2.1.88/sources/src/utils/effort.ts#L152-L167"
locator_kind = "ast_transform"

[patches.ast]
