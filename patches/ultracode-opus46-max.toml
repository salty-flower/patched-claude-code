[[patches]]
name = "ultracode-model-picker-max-fallback"
target_version = "2.1.197"
applies_to = ">=2.1.197 <2.1.198"
rationale = """
Set model-picker ultracode state to xhigh or max based on the active model.

The v2.1.197 model picker stores `effortValue: "xhigh"` when ultracode is
selected for the current session. This 2.1.197 minified-symbol variant keeps
xhigh for xhigh-capable models and uses max when the active model supports max.
