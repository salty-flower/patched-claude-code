[[patches]]
name = "ultracode-flag-settings-max-fallback"
target_version = "2.1.197"
applies_to = ">=2.1.197 <2.1.198"
rationale = """
Set apply_flag_settings ultracode state to xhigh or max based on the active model.

SDK and remote-control sessions can enable ultracode through flag settings. The
v2.1.197 handler hard-codes xhigh in that state update, so Opus 4.6 sessions
remain incompatible. This 2.1.197 minified-symbol variant computes the same
model-aware effort used by the interactive command. Cleanup condition: upstream
normalizes ultracode effort in the flag-settings control path.
"""
rationale_ref = "reference/v2.1.88/sources/src/utils/effort.ts#L152-L167"
