[[patches]]
name = "ultracode-thin-client-usage-max-fallback-2-1-205"
target_version = "2.1.205"
applies_to = ">=2.1.205 <2.2.0"
rationale = """
Show ultracode in thin-client `/effort` usage for max-compatible models.

This is the 2.1.205 minified-symbol variant. The thin-client command path is
now `c0_`, with local model `o`; compatibility is resolved through `Jde`,
`rBe`, and `nBe`. Cleanup condition: upstream shares model-compatible
ultracode availability across CLI/TUI usage surfaces.
"""
rationale_ref = "reference/v2.1.88/sources/src/commands/effort/effort.tsx#L171-L181"
locator_kind = "ast_transform"

[patches.ast]
schema = 1
match = { node = "FunctionDeclaration", function_name = "c0_", string = '''${$Q(o)?"|ultracode":""}''' }

[patches.transform]
op = "replace_substring"
find = '''${$Q(o)?"|ultracode":""}'''
value = '''${$Q(o)||$Q()&&rBe(o)&&nBe("max",o)?"|ultracode":""}'''

[[patches.tests]]
kind = "static"
name = "thin-client usage lists max-compatible ultracode in 2.1.205"
assert_contains = '''${$Q(o)||$Q()&&rBe(o)&&nBe("max",o)?"|ultracode":""}'''

[[patches]]
name = "ultracode-effort-notification-max-fallback-2-1-205"
target_version = "2.1.205"
applies_to = ">=2.1.205 <2.2.0"
rationale = """
Describe ultracode's effective Opus 4.6 effort as max in the prompt notification.

This is the 2.1.205 minified-symbol variant. The prompt notification helper is
now `xMd`; it receives the effective effort and ultracode flag but not the
session model, so it resolves the active model through `Oi` and uses the same
`Jde`/`rBe`/`nBe` compatibility rule as the command path. Cleanup condition:
upstream makes the ultracode notification text reflect the model-compatible
effort instead of hard-coding xhigh.
"""
rationale_ref = "reference/v2.1.88/sources/src/components/PromptInput/PromptInput.tsx#L1967-L1977"
locator_kind = "ast_transform"

[patches.ast]
schema = 1
match = { node = "FunctionDeclaration", function_name = "xMd", source = '''function xMd(e,t=!1,r=!1){if(!e)return;if(t)return`${r?"effort:":Vvr} ultracode \xB7 xhigh effort + dynamic workflows for maximum thoroughness`;return`${r?"effort:":gbo(e)} ${e} \xB7 /effort`}''' }

[patches.transform]
op = "replace_function_body"
body = '''{if(!e)return;if(t){let n=Oi(),o=$Q(n)?"xhigh":$Q()&&rBe(n)&&nBe("max",n)?"max":"xhigh";return`${r?"effort:":Vvr} ultracode \xB7 ${o} effort + dynamic workflows for maximum thoroughness`}return`${r?"effort:":gbo(e)} ${e} \xB7 /effort`}'''

[[patches.tests]]
kind = "static"
name = "effort notification describes max-compatible ultracode in 2.1.205"
assert_contains = '''function xMd(e,t=!1,r=!1){if(!e)return;if(t){let n=Oi(),o=$Q(n)?"xhigh":$Q()&&rBe(n)&&nBe("max",n)?"max":"xhigh";return`${r?"effort:":Vvr} ultracode \xB7 ${o} effort + dynamic workflows for maximum thoroughness`}return`${r?"effort:":gbo(e)} ${e} \xB7 /effort`}'''

[[patches.tests]]
kind = "static"
name = "effort notification no longer hard-codes xhigh ultracode in 2.1.205"
assert_not_contains = '''function xMd(e,t=!1,r=!1){if(!e)return;if(t)return`${r?"effort:":Vvr} ultracode \xB7 xhigh effort + dynamic workflows for maximum thoroughness`;return`${r?"effort:":gbo(e)} ${e} \xB7 /effort`}'''
