name = "web-search-model"
enabled = true
target_version = "2.1.318"
applies_to = ">=2.1.310 <2.1.311"

[[patches]]
name = "web-search-model-parser-darwin-arm64"
platforms = ["darwin-arm64"]
rationale = "Expose the existing model ID parser in the WebSearch module so the override uses native alias and [1m] handling. Remove with upstream support for an independent search model."
rationale_ref = "reference/v2.1.88/sources/src/utils/model/model.ts#L438-L481"
locator_kind = "literal"
locator_pattern = '_S,it,Dh,Xe,Xqo,Dvt,_l,kn,k,dT}from"./chunk-27xjmczp.js"'
replacement = '_S,Ft as patchedWebSearchModel,it,Dh,Xe,Xqo,Dvt,_l,kn,k,dT}from"./chunk-27xjmczp.js"'

[[patches.tests]]
kind = "static"
name = "Darwin imports the native model parser"
assert_contains = '_S,Ft as patchedWebSearchModel,it,Dh,Xe,Xqo,Dvt,_l,kn,k,dT}from"./chunk-27xjmczp.js"'

[[patches]]
name = "web-search-model-select-darwin-arm64"
platforms = ["darwin-arm64"]
rationale = "Route WebSearch side queries through CLAUDE_CODE_WEB_SEARCH_MODEL when nonempty, independent of tengu_plum_vx3. Mixed providers can select a search-capable upstream without changing the main model. Preserve the original selection when unset or empty; forcing the feature flag would still couple routing to small-fast. Remove when upstream exposes an independent search model override."
rationale_ref = "reference/v2.1.88/sources/src/tools/WebSearchTool/WebSearchTool.ts#L262-L287"
locator_kind = "literal"
locator_pattern = 'x=k("tengu_plum_vx3",!1)?_S():y.mainLoopModel()'
replacement = 'x=process.env.CLAUDE_CODE_WEB_SEARCH_MODEL?patchedWebSearchModel(process.env.CLAUDE_CODE_WEB_SEARCH_MODEL):k("tengu_plum_vx3",!1)?_S():y.mainLoopModel()'

[[patches.tests]]
kind = "static"
name = "Darwin resolves the override before the untouched feature flag fallback"
assert_contains = 'x=process.env.CLAUDE_CODE_WEB_SEARCH_MODEL?patchedWebSearchModel(process.env.CLAUDE_CODE_WEB_SEARCH_MODEL):k("tengu_plum_vx3",!1)?_S():y.mainLoopModel()'

