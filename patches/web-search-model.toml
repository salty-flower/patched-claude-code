[[patches]]
name = "web-search-model-parser-darwin-arm64-2-1-318"
platforms = [ "darwin-arm64" ]
rationale = "2.1.318 Gt is the exported native model parser in chunk-axsjfnwn.js, wrapping the internal YG alias/[1m] parser and native context-suffix normalization. Expose the public parser in WebSearch for the independent override."
rationale_ref = "reference/v2.1.88/sources/src/utils/model/model.ts#L438-L481"
locator_kind = "literal"
locator_pattern = 'Qu,Fn,Oi,Ia,HE,it,i_,et,Ayo,JHt,Gl,yn,k,an,pR}from"./chunk-axsjfnwn.js"'
replacement = 'Gt as patchedWebSearchModel,Qu,Fn,Oi,Ia,HE,it,i_,et,Ayo,JHt,Gl,yn,k,an,pR}from"./chunk-axsjfnwn.js"'
lineage = "web-search-model-parser"
target_version = "2.1.318"
applies_to = ">=2.1.318 <2.1.319"

  [[patches.tests]]
  kind = "static"
  name = "318 imports the native alias parser"
  assert_contains = 'Gt as patchedWebSearchModel,Qu,Fn,Oi,Ia,HE,it,i_,et,Ayo,JHt,Gl,yn,k,an,pR}from"./chunk-axsjfnwn.js"'

  [[patches.tests]]
  kind = "static"
  name = "318 rejects predecessor inserted bindings"
  assert_not_contains = '_S,Ft as patchedWebSearchModel,it,Dh,Xe,Xqo,Dvt,_l,kn,k,dT}from"./chunk-27xjmczp.js"'

