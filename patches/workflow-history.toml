rationale = "Load the graph-local, integrity-bound selector and prompt resources without a global preload or external runtime dependency. This is the 2.1.285 darwin-arm64 minified-symbol variant; exact function/call matches and local identifiers are bounded to this target. The Workflow provenance surface postdates the audit baseline; the referenced native agent/tool-result/classifier boundary establishes the source intent. See docs/records/2026-10-02-workflow-history.md. Remove this entry when upstream supplies bounded, attributed Workflow history with genuine question answers and compatible classification."
rationale_ref = "reference/v2.1.88/sources/src/tools/AgentTool/AgentTool.tsx#L494-L541"
locator_kind = "ast_transform"

  [patches.ast]
  schema = 1

    [patches.ast.match]
    node = "FunctionDeclaration"
    function_name = "ccr"
    string = "strictHuman"

  [patches.transform]
  op = "insert_before_node"
  code = """
import {selectWorkflowHistory as __pccSelectWorkflowHistory,renderWorkflowHistory as __pccRenderWorkflowHistory,renderWorkflowTask as __pccRenderWorkflowTask,unwrapWorkflowTask as __pccUnwrapWorkflowTask} from "./patched-workflow-history.js";
